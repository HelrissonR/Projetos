window.addEventListener('DOMContentLoaded', async () => {
  console.log('🚀 Bolsa Família v3 — IndexedDB + UPSERT + Realtime');
  await IDB.open();

  // Limpeza única na inicialização: remove famílias órfãs herdadas de importações
  // anteriores (corrige a divergência famílias > beneficiários).
  try { await reconcileFamilias(); } catch(e){ console.warn('reconcile init:', e); }

  // Supabase
  // Config salva no aparelho tem prioridade; senão usa a conexão embutida padrão
  const sUrl = await IDB.getMeta('supabaseUrl') || SUPABASE_URL;
  const sKey = await IDB.getMeta('supabaseKey') || SUPABASE_KEY;
  if(sUrl && sKey){
    try{
      SB=supabase.createClient(sUrl,sKey);
      const authed = await _sbSignIn();
      Sync.setStatus(authed?'on':'off', authed?'Autenticado':'Sem auth');
      Sync.startRealtime();
      Sync.startPolling(30000);
    }
    catch(e){console.warn('SB init error:',e);}
  }

  // Sincroniza imediatamente ao (re)conectar à internet
  window.addEventListener('online', () => {
    if (SB && ME) { showToast('Conectado — sincronizando…', 'ok'); Sync.fullSync(); }
  });

  // Theme + design personalizado
  const tema = await IDB.getMeta('tema');
  if(tema==='dark') applyTheme('dark');
  await applyCustomDesign();

  // Session
  const session = JSON.parse(await IDB.getMeta('session') || 'null');
  if(session){
    const users = JSON.parse(await IDB.getMeta('users') || '[]');
    const u = users.find(x=>x.id===session.userId&&x.ativo!==false);
    if(u){
      ME=u;await _getPerms();$('#pageLogin').classList.remove('active');$('#pageApp').classList.add('active');
      $('#appTitle').textContent = await IDB.getMeta('instituicao') || 'Bolsa Família';
      updVig(); nav(await IDB.getMeta('designDefaultPage') || 'home');
      if(SB) Sync.download();
      Presence.start();
    }
  }

  $('#loginPass').addEventListener('keypress', e=>{if(e.key==='Enter')_doLoginSafe();});
  $('#loginUser').addEventListener('keypress', e=>{if(e.key==='Enter')_doLoginSafe();});

  // Auto-migração: corrigir familias agrupadas por CEP
  const famAll = await IDB.getAll('familias');
  const famCEP = famAll.filter(f => /^FAM_\d{8}$/.test(f.familyId) && (!f.cod_familiar || f.cod_familiar === f.familyId.replace('FAM_','')));
  for (const fc of famCEP) {
    if (fc.membros && fc.membros.length > 50) {
      console.warn(`⚠️ Família ${fc.familyId} tem ${fc.membros.length} membros (provável CEP). Corrigindo...`);
      // Separar cada membro em sua própria "família individual"
      for (const m of fc.membros) {
        const newFamId = 'FAM_IND_' + m.nis;
        m.cod_fam = newFamId;
        m.updated_at = new Date().toISOString();
        await IDB.put('beneficiarios', m);
        await IDB.put('familias', { familyId: newFamId, cod_familiar: null, endereco: m.endereco || 'Sem endereço', bairro: m.bairro || '', membros: [m], total_membros: 1, updated_at: new Date().toISOString() });
      }
      await IDB.delete('familias', fc.familyId);
      console.log(`✅ Corrigido: ${fc.membros.length} membros separados`);
    }
  }

  setInterval(updVig, 60000);
  _updOffBtn(); // estado inicial do botão de modo offline no topo

  // PWA: manifest dinâmico (instalável) + Service Worker para offline
  try {
    const inst = await IDB.getMeta('instituicao') || 'Bolsa Família';
    const icon = await IDB.getMeta('appIcon') || await IDB.getMeta('logoApp') || APP_ICON;
    const iconType = icon.startsWith('data:image/svg') ? 'image/svg+xml' : 'image/png';
    const man = {
      name: inst, short_name: 'Bolsa Família',
      start_url: location.href, scope: location.href.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#ffffff', theme_color: '#ffc400',
      icons: [{ src: icon, sizes: '512x512', type: iconType, purpose: 'any' }]
    };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);

    // Favicon + ícone Apple usando o mesmo ícone do app
    document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(n => n.remove());
    const fav = document.createElement('link');
    fav.rel = 'icon'; fav.type = iconType; fav.href = icon;
    document.head.appendChild(fav);
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon'; apple.href = icon;
    document.head.appendChild(apple);
  } catch (e) { console.warn('⚠️ manifest:', e); }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('✅ Service Worker registered'))
      .catch(e => console.warn('⚠️ SW error:', e));
  }
  
  console.log('✅ Pronto. Device:', DEVICE_ID.substring(0,8));
});

/* ── Transição de cores na rolagem da tela ──────────────
   Atualiza a variável CSS --sc (0..1) conforme o usuário rola,
   deslocando o matiz do cabeçalho e da camada de fundo. */
(function initScrollColorShift(){
  const root = document.documentElement;
  let ticking = false;
  function update(){
    ticking = false;
    const h = document.documentElement;
    const max = Math.max(1, (h.scrollHeight - h.clientHeight));
    const ratio = Math.min(1, Math.max(0, (window.scrollY || h.scrollTop || 0) / max));
    root.style.setProperty('--sc', ratio.toFixed(3));
  }
  function onScroll(){
    if (!ticking){ ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>

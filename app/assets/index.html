}

async function saveFooterImgBlock(idx) {
  const cfg = await _getFooterCfg();
  const b   = cfg.blocks[idx];
  if (!b || b.type !== 'image') return;
  b.imgWidth = parseInt(document.getElementById('fbImgW')?.value) || 100;
  b.align    = document.getElementById('fbImgAlign')?.value || 'center';
  await _saveFooterCfg(cfg);
  closeSheet();
  await _refreshFooterBlocksList();
  _renderFooter();
  showToast('✓ Bloco de imagem salvo!', 'ok');
}

async function uploadFooterImg(idx, file) {
  if (!file) return;
  if (file.size > 3*1024*1024) { showToast('Imagem muito grande (máx 3 MB)', 'err'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    const cfg = await _getFooterCfg();
    const b = cfg.blocks[idx];
    if (!b) return;
    b.imgData = e.target.result;
    await _saveFooterCfg(cfg);
    // Atualiza o preview dentro do sheet sem fechar
    const prev = document.getElementById('fbImgPreview');
    if (prev) prev.innerHTML = `<div style="text-align:center"><img src="${b.imgData}" style="max-width:100%;max-height:130px;border-radius:var(--r);border:1px solid var(--border)"></div>`;
    _renderFooter();
    showToast('✓ Imagem carregada!', 'ok');
  };
  reader.readAsDataURL(file);
}

async function _getLoginBlocks() {
  return JSON.parse(await IDB.getMeta('loginBlocks') || '[]');
}
async function _saveLoginBlocks(blocks) {
  await IDB.setMeta('loginBlocks', JSON.stringify(blocks));
}
async function saveLBlockLayout(v) {
  await IDB.setMeta('loginBlocksLayout', v);
  _renderLoginBlocks();
}
async function _renderLoginBlocks() {
  const area = document.getElementById('loginBlocksArea');
  if (!area) return;
  const layout = await IDB.getMeta('loginBlocksLayout') || 'row';
  const blocks = await _getLoginBlocks();
  if (!blocks.length) { area.innerHTML = ''; return; }
  const items = blocks.map(b => {
    if (b.type === 'image' && b.imgData) {
      const w = b.imgWidth  || 64;
      const h = b.imgHeight || b.imgWidth || 64;
      return `<div class="lblock-img" style="width:${w}px;height:${h}px;flex-shrink:0"><img src="${b.imgData}"></div>`;
    }
    if (b.type === 'text' && b.text) {
      const st = [
        `font-size:${b.fontSize||13}px`,
        `color:${b.color||'#525252'}`,
        b.bold?'font-weight:700':'',b.italic?'font-style:italic':'',
        b.maxWidth?`max-width:${b.maxWidth}px`:''
      ].filter(Boolean).join(';');
      return `<div class="lblock-text" style="${st}">${esc(b.text).replace(/\n/g,'<br>')}</div>`;
    }
    return '';
  }).filter(Boolean).join('');
  const rowClass = layout === 'column' ? 'lcard-blocks-col' : 'lcard-blocks-row';
  area.innerHTML = `<div class="lcard-blocks"><div class="${rowClass}">${items}</div></div>`;
}

  blocks.push(type==='text'

    : {id,type:'image',imgData:null,imgWidth:64,imgHeight:64});
  await _saveLoginBlocks(blocks);
  await _refreshLoginBlocksList();
  editLBlock(blocks.length-1);
}

async function removeLBlock(idx) {
  const blocks = await _getLoginBlocks();
  blocks.splice(idx,1);

  _renderLoginBlocks();
}

  _renderLoginBlocks();

async function renderBanner(currentPage) {
  const cfg = await _getBannerCfg();
  const canManageBanner = can('banner.manage');
  const showOnThisPage = cfg.pages.includes(currentPage);
  const hasContent = (cfg.text && cfg.text.trim()) || cfg.images.length > 0;

  // Se não há conteúdo: mostrar botão "adicionar" apenas para quem pode gerenciar banner
  if (!hasContent) {
    return (canManageBanner && currentPage === 'home')
      ? `<button class="btn btn-g btn-b" onclick="showBannerEditor()" style="font-size:13px;color:var(--muted);border-style:dashed;gap:6px">${fi('plus',14)} Adicionar banner informativo</button>`
      : '';
  }

  // Se há conteúdo mas esta tela não está marcada, não mostra
  if (!showOnThisPage) return '';

  const editBtn = canManageBanner
    ? `<button class="btn-icon home-banner-edit" onclick="showBannerEditor()" title="Editar banner">${fi('edit',14)}</button>`
    : '';

  const slides = cfg.images.length > 0
    ? `<div class="home-banner-slides" data-interval="${cfg.interval}">
         ${cfg.images.map((src,i) => `<div class="bs ${i===0?'active':''}" style="background-image:url('${src}')"></div>`).join('')}
         ${cfg.images.length > 1 ? `<div class="home-banner-dots">${cfg.images.map((_,i)=>`<span class="d ${i===0?'active':''}" data-i="${i}"></span>`).join('')}</div>` : ''}
       </div>`
    : '';

  const txtBlock = (cfg.title || cfg.text)
    ? `<div class="home-banner-inner">
         ${cfg.title ? `<div class="home-banner-title">${esc(cfg.title)}</div>` : ''}
         ${cfg.text ? `<div class="home-banner-body">${esc(cfg.text)}</div>` : ''}
       </div>`
    : '';

  return `<div class="home-banner type-${esc(cfg.type)}">${editBtn}${slides}${txtBlock}</div>`;
}

function _startBannerSlideshow() {
  // Limpar slideshow anterior
  if (window._bannerSlideTimer) { clearInterval(window._bannerSlideTimer); window._bannerSlideTimer = null; }
  const wrap = document.querySelector('.home-banner-slides');
  if (!wrap) return;
  const slides = wrap.querySelectorAll('.bs');
  const dots   = wrap.querySelectorAll('.d');
  if (slides.length < 2) return;
  const interval = parseInt(wrap.dataset.interval) || 5000;
  let idx = 0;
  const go = (next) => {
    slides[idx].classList.remove('active');
    if (dots[idx]) dots[idx].classList.remove('active');
    idx = next;
    slides[idx].classList.add('active');
    if (dots[idx]) dots[idx].classList.add('active');
  };
  dots.forEach((d,i) => d.addEventListener('click', () => go(i)));
  window._bannerSlideTimer = setInterval(() => go((idx + 1) % slides.length), interval);
}

function _renderBannerImageList() {
  const c = document.getElementById('bImgList');
  if (!c) return;
  if (_bannerEditImages.length === 0) {
    c.innerHTML = `<div class="small muted" style="padding:8px 4px">Nenhuma imagem adicionada.</div>`;
    return;
  }
  c.innerHTML = _bannerEditImages.map((src,i) => `
    <div class="bimg-item">
      <img src="${src}" alt="">
      <div class="bimg-item-info">Imagem ${i+1}</div>
      ${i>0 ? `<button class="btn-icon" onclick="_moveBannerImage(${i},-1)" title="Subir">${fi('chevron-up',14)}</button>` : ''}
      ${i<_bannerEditImages.length-1 ? `<button class="btn-icon" onclick="_moveBannerImage(${i},1)" title="Descer">${fi('chevron-down',14)}</button>` : ''}
      <button class="btn-icon" onclick="_removeBannerImage(${i})" title="Remover" style="color:var(--err)">${fi('x',14)}</button>
    </div>`).join('');
}

async function _onBannerImageSelect(files) {
  if (!files || !files.length) return;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 3 * 1024 * 1024) { showToast(`Imagem "${file.name}" maior que 3 MB — ignorada`, 'warn'); continue; }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      _bannerEditImages.push(dataUrl);
    } catch(e) { showToast('Falha ao ler imagem', 'err'); }
  }
  _renderBannerImageList();
  document.getElementById('bImgInput').value = '';
}

function _removeBannerImage(i) {
  _bannerEditImages.splice(i,1);
  _renderBannerImageList();
}

function _moveBannerImage(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= _bannerEditImages.length) return;
  [_bannerEditImages[i], _bannerEditImages[j]] = [_bannerEditImages[j], _bannerEditImages[i]];
  _renderBannerImageList();
}

// PERIODICIDADE — acompanhamentos vencidos
// Regra: 1 acompanhamento por semestre para todos
// (S1 jan–jun · S2 jul–dez).
// ═══════════════════════════════════════════════════════
function _nameHue(s) {
  let h = 0;
  for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function _idadeAnos(b) {
  if (b.dob) {
    const d = new Date(b.dob + 'T12:00:00');
    if (!isNaN(d)) return Math.floor((Date.now() - d) / 3.15576e10);
  }
  if (b.idade != null && b.idade !== '') { const n = +b.idade; return isFinite(n) ? n : null; }
  return null;
}

// Regra: 1 acompanhamento por semestre para TODOS os beneficiários.
// Pendente = quem não tem acompanhamento registrado no semestre atual.
function _calcVencidos(benefs, ultimoPorNis) {
  const refAtual = semestreAtualRef();
  const hoje = Date.now();
  const out = [];
  for (const b of benefs) {
    const ult = ultimoPorNis.get(b.nis);
    const emDia = ult?.data && semestreRef(ult.data) === refAtual;
    if (emDia) continue;
    const ref = ult?.data ? new Date(ult.data + 'T12:00:00').getTime() : null;
    const diasDesde = ref ? Math.floor((hoje - ref) / 864e5) : null;
    out.push({ b, semestre: refAtual, diasDesde, ultimaData: ult?.data || null });
  }
  // Mais antigos / nunca acompanhados primeiro
  out.sort((a, b) => (b.diasDesde ?? 9e9) - (a.diasDesde ?? 9e9));
  return out;
}

async function showVencidos() {
  const benefs = await getBenefCache();
  const acomps = await getAcompCache();
  const ultimo = new Map();
  acomps.forEach(a => {
    const p = ultimo.get(a.nis);
    if (!p || new Date(a.data) > new Date(p.data)) ultimo.set(a.nis, a);
  });
  const v = _calcVencidos(benefs, ultimo);
  openSheet(`Acompanhamentos vencidos (${v.length})`, v.length === 0
    ? `<div class="empty-state"><div class="ei">${fi('award',44)}</div><strong>Tudo em dia</strong><p>Nenhum acompanhamento vencido pelas regras de periodicidade.</p></div>`
    : `<div class="s3">
        <div class="small muted">Regra: 1 acompanhamento por semestre (S1 jan–jun · S2 jul–dez). Pendentes do semestre ${semestreLabel(semestreAtualRef())}. Toque para abrir o beneficiário.</div>
        ${v.slice(0, 100).map(x => `<div class="card" onclick="showBenef('${esc(x.b.nis)}')">
          <div class="res-card-name">${esc(x.b.nome)}
            <span class="tag" style="background:var(--err-soft);color:var(--err)">${x.ultimaData == null ? 'nunca acompanhado' : `há ${x.diasDesde} dias`}</span></div>
          <div class="res-card-meta">
            <span>NIS: ${esc(x.b.nis)}</span><span class="dot"></span>
            <span>pendente no semestre ${semestreLabel(x.semestre)}</span>
            ${x.ultimaData ? `<span class="dot"></span><span>último: ${new Date(x.ultimaData + 'T12:00:00').toLocaleDateString('pt-BR')}</span>` : ''}
          </div>
        </div>`).join('')}
        ${v.length > 100 ? `<div class="small muted" style="text-align:center">Mostrando 100 de ${v.length}</div>` : ''}
      </div>`);
}

// ── Wizard do formulário de acompanhamento (3 etapas) ──────
let _wizStep = 1;
function _wizNao(){ return !!document.getElementById('aAcN')?.checked; }
function _wizGo(dir){
  if (dir > 0) {
    if (_wizStep === 1) {
      if (!$('#aD').value) { showToast('Preencha a data','err'); return; }
      if (_wizNao()) { saveAcomp(); return; } // não acompanhado: salva direto (motivo validado no saveAcomp)
    }
    if (_wizStep === 2) { saveAcomp(); return; }
  }
  _wizStep = Math.min(2, Math.max(1, _wizStep + dir));
  _wizRefresh();
}
function _wizRefresh(){
  if (!document.getElementById('aStep1')) return; // form não está aberto
  const labels = ['Registro','Medições, saúde e triagem'];
  for (let i = 1; i <= 2; i++) {
    const st = document.getElementById('aStep'+i);
    if (st) st.style.display = i === _wizStep ? 'block' : 'none';
  }
  document.querySelectorAll('#wizBar .wiz-seg').forEach((s,i)=>s.classList.toggle('active', i < _wizStep));
  const nao  = _wizNao();
  const lbl  = document.getElementById('wizLbl');
  if (lbl) lbl.textContent = nao ? 'Registro de não acompanhamento' : `Etapa ${_wizStep} de 2 — ${labels[_wizStep-1]}`;
  const back = document.getElementById('wizBack');
  const next = document.getElementById('wizNext');
  if (back) back.style.display = _wizStep > 1 ? 'inline-flex' : 'none';
  if (next) next.innerHTML = (_wizStep === 2 || (nao && _wizStep === 1))
    ? `${fi('save',15)} Salvar acompanhamento` : 'Avançar →';
  // rola a folha de volta ao topo ao trocar de etapa
  const sh = document.querySelector('#sheet .sheet-c') || document.getElementById('sheet');
  if (sh) sh.scrollTop = 0;
}

// Gráfico SVG de evolução de peso ao longo dos acompanhamentos
function _evoChart(acomps) {
  const pts = [...acomps].filter(a => a.peso && a.data).sort((a, b) => new Date(a.data) - new Date(b.data));
  if (pts.length < 2) return '';
  const W = 320, H = 110, P = 16;
  const vals = pts.map(p => p.peso);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const x = i => P + i * (W - 2 * P) / (pts.length - 1);
  const y = v => H - P - ((v - min) / span) * (H - 2 * P - 14);
  const coords = pts.map((p, i) => [x(i).toFixed(1), y(p.peso).toFixed(1)]);
  const line = coords.map(c => c.join(',')).join(' ');
  const area = `${P},${H - P} ${line} ${W - P},${H - P}`;
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  const first = pts[0], last = pts[pts.length - 1];
  const delta = +(last.peso - first.peso).toFixed(1);
  const deltaTxt = delta === 0 ? 'estável' : (delta > 0 ? `+${delta} kg` : `${delta} kg`);
  const deltaColor = delta === 0 ? 'var(--muted)' : (delta > 0 ? 'var(--ok)' : 'var(--warn)');
  // rotula só primeiro, último, mín e máx para não poluir
  const labeled = new Set([0, pts.length - 1, vals.indexOf(max), vals.indexOf(min)]);
  return `<div class="card card-sub nh" style="padding:14px">
    <div class="mb-section-title">${fi('trending-up', 12)} Evolução de peso
      <span style="margin-left:auto;font-size:11px;font-weight:700;color:${deltaColor};text-transform:none;letter-spacing:0">${deltaTxt}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <defs><linearGradient id="evoG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#evoG)"/>
      <polyline points="${line}" fill="none" stroke="var(--accent-hi)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${coords.map((c, i) => `<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="var(--panel)" stroke="var(--accent-hi)" stroke-width="2"><title>${fmt(pts[i].data)}: ${pts[i].peso} kg${pts[i].imc ? ` · IMC ${pts[i].imc}` : ''}</title></circle>`).join('')}
      ${coords.map((c, i) => labeled.has(i) ? `<text x="${c[0]}" y="${(+c[1] - 9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text)">${pts[i].peso}</text>` : '').join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px"><span>${fmt(first.data)}</span><span>${pts.length} registros</span><span>${fmt(last.data)}</span></div>
    ${last.imc ? `<div class="small muted" style="margin-top:6px">Último IMC: <strong style="color:var(--text)">${last.imc}</strong></div>` : ''}
  </div>`;
}

// Rótulo visual do resultado TRIA — usado em cards de listagem
function _triaLabel(risco) {
  if (risco === 'sem_risco')  return `<span class="tag tag-ok">${fi('check',11)} Sem risco</span>`;
  if (risco === 'risco')      return `<span class="tag tag-w" style="background:var(--warn-soft);color:var(--warn)">${fi('alert-triangle',11)} Risco</span>`;
  if (risco === 'risco_alto') return `<span class="tag" style="background:var(--err-soft);color:var(--err);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500">${fi('alert-octagon',11)} Risco alto</span>`;
  return '';
}

// Calcula e exibe o risco TRIA
function _updateTriaResult(nameA, nameB, resultId) {
  const a = document.querySelector(`input[name="${nameA}"]:checked`)?.value;
  const b = document.querySelector(`input[name="${nameB}"]:checked`)?.value;
  const el = document.getElementById(resultId);
  if (!el) return;
  if (a == null || b == null) { el.style.display = 'none'; return; }
  const sim = (a==='1'?1:0) + (b==='1'?1:0);
  let txt, bg, fg;
  if (sim === 0)      { txt = `${fi('check',13)} Sem risco de insegurança alimentar`; bg = 'var(--ok-soft)';   fg = 'var(--ok)';   }
  else if (sim === 1) { txt = `${fi('alert-triangle',13)} Risco de insegurança alimentar`;     bg = 'var(--warn-soft)'; fg = 'var(--warn)'; }
  else                { txt = `${fi('alert-octagon',13)} Risco alto — encaminhar à rede de proteção`; bg = 'var(--err-soft)'; fg = 'var(--err)'; }
  el.innerHTML = txt;
  el.style.background = bg;
  el.style.color = fg;
  el.style.fontWeight = '600';
  el.style.display = 'block';
}

async function saveAcomp() {
  if(!CURB)return;
  const data=$('#aD').value;
  if(!data){showToast('Preencha a data','err');return;}
  const acompanhado = !$('#aAcN')?.checked;
  const motivo_na = acompanhado ? null : ($('#aMotivo')?.value || null);
  if (!acompanhado && !motivo_na) { showToast('Selecione o motivo do não acompanhamento','err'); return; }
  const peso=parseFloat($('#aP').value)||null;
  const altura=parseInt($('#aA').value)||null;
  let imc=null;
  if(peso&&altura&&altura>0) imc=+(peso/Math.pow(altura/100,2)).toFixed(2);
  const vS=$('#vS')?.checked, vN=$('#vN')?.checked;
  const gestante=$('#aG').checked;
  const prenatalS=$('#aPS')?.checked, prenatalN=$('#aPN')?.checked;

  const triaA = document.querySelector('input[name="aTriaA"]:checked')?.value;
  const triaB = document.querySelector('input[name="aTriaB"]:checked')?.value;
  const tria_a = (triaA==='1') ? true : (triaA==='0' ? false : null);
  const tria_b = (triaB==='1') ? true : (triaB==='0' ? false : null);
  const tria_risco = (tria_a==null||tria_b==null) ? null
                   : ((tria_a?1:0)+(tria_b?1:0)===0 ? 'sem_risco'
                   : ((tria_a?1:0)+(tria_b?1:0)===1 ? 'risco' : 'risco_alto'));

  // 1 acompanhamento por semestre: id determinístico evita duplicata entre dispositivos
  const aId = acompId(CURB.nis, data);
  const existente = await IDB.get('acompanhamentos', aId);
  if (existente && !await uiConfirm(`Já existe acompanhamento de ${CURB.nome || 'este beneficiário'} no semestre ${semestreLabel(semestreRef(data))}.\nAtualizar/substituir o registro?`, {title:'Acompanhamento existente', okText:'Substituir'})) return;

  const acomp = {
    id: aId,
    nis: CURB.nis,
    data,
    tecnico: ME.nome,
    estabelecimento: await IDB.getMeta('instituicao') || '',
    acompanhado,
    motivo_na,
    peso: acompanhado ? peso : null,
    altura: acompanhado ? altura : null,
    imc: acompanhado ? imc : null,
    vacina_ok: acompanhado ? (vS ? true : (vN ? false : null)) : null,
    gestante: acompanhado ? gestante : false,
    dum: acompanhado && gestante ? ($('#aDum').value || null) : null,
    prenatal: acompanhado && gestante ? (prenatalS ? 'sim' : (prenatalN ? 'nao' : null)) : null,
    tria_a: acompanhado ? tria_a : null,
    tria_b: acompanhado ? tria_b : null,
    tria_risco: acompanhado ? tria_risco : null,
    observacoes: $('#aO').value.trim() || null,
    device_id: DEVICE_ID,
    created_at: existente?.created_at || new Date().toISOString(),
    updated_at: new Date().toISOString()
    // synced_at ausente → será enviado no próximo sync
  };

  await IDB.put('acompanhamentos', acomp);
  invalidateAcompCache();
  _updateSyncBadge();
  _audit(existente ? 'acomp.edit' : 'acomp.create', 'acompanhamento', aId);
  showToast('✓ Acompanhamento salvo!', 'ok');
  if (SB) setTimeout(() => Sync.upload(), 300);

  // Verificar se há outros membros da família para acompanhar
  const nisAtual = CURB.nis;
  const nomeAtual = CURB.nome;
  const codFamAtual = CURB.cod_fam;
  closeSheet();

  if (codFamAtual && !codFamAtual.startsWith('FAM_IND_') && !codFamAtual.startsWith('FAM_AVULSO_')) {
    const membros = (await IDB.getByIndex('beneficiarios', 'cod_fam', codFamAtual))
      .filter(m => m.nis !== nisAtual);

    if (membros.length > 0) {
      // Pendentes = membros SEM acompanhamento no semestre da data registrada
      const refSem = semestreRef(data);
      const noSemestre = new Set(
        (await getAcompCache())
          .filter(a => semestreRef(a.data) === refSem)
          .map(a => a.nis)
      );
      const pendentes = membros.filter(m => !noSemestre.has(m.nis));

      if (pendentes.length > 0) {
        setTimeout(() => showProximoMembro(pendentes, data), 400);
        return;
      }
    }
  }

  setTimeout(() => _showAcompConfirm(nomeAtual, nisAtual), 350);
}

// Limites plausíveis de peso/altura por idade (inspirado nas regras
// SISVAN/OMS usadas pelo e-Gestor, que rejeita valores fora da faixa)
function _antropoLimites(idade) {
  if (idade == null || isNaN(idade)) return null;
  if (idade < 1)  return { p:[1,20],   a:[40,105] };
  if (idade < 5)  return { p:[5,45],   a:[55,135] };
  if (idade < 10) return { p:[10,90],  a:[80,170] };
  if (idade < 20) return { p:[20,160], a:[100,210] };
  return { p:[25,250], a:[120,220] };
}
let _antropoIdade = null; // idade do beneficiário do formulário aberto
function _antropoAvisos(peso, altura) {
  const lim = _antropoLimites(_antropoIdade);
  if (!lim) return [];
  const av = [];
  if (peso   > 0 && (peso   < lim.p[0] || peso   > lim.p[1])) av.push(`Peso ${peso} kg fora do esperado (${lim.p[0]}–${lim.p[1]} kg)`);
  if (altura > 0 && (altura < lim.a[0] || altura > lim.a[1])) av.push(`Altura ${altura} cm fora do esperado (${lim.a[0]}–${lim.a[1]} cm)`);
  return av;
}

function calcIMC(pesoId, alturaId, resultId) {
  const peso = parseFloat($('#'+pesoId)?.value) || 0;
  const altura = parseInt($('#'+alturaId)?.value) || 0;
  const el = $('#'+resultId);
  if (!el) return;

  // Aviso de valores implausíveis para a idade (o e-Gestor rejeitaria)
  const avisos = _antropoAvisos(peso, altura);
  const avisoHtml = avisos.length
    ? `<div class="card card-sub nh" style="background:var(--warn-soft);border-color:var(--warn);padding:10px;margin-top:8px">
        <div class="small" style="color:var(--warn);font-weight:600">${fi('alert-triangle',13)} ${avisos.join(' · ')}${_antropoIdade!=null?` para ${_antropoIdade} ano${_antropoIdade===1?'':'s'}`:''}</div>
        <div class="small muted" style="margin-top:3px">Confira a medição — o e-Gestor pode rejeitar valores fora da faixa.</div>
      </div>` : '';

  if (peso > 0 && altura > 0) {
    const imc = +(peso / Math.pow(altura / 100, 2)).toFixed(2);
    let classe = '', label = '';
    if (imc < 18.5)      { classe = 'warn'; label = 'Abaixo do peso'; }
    else if (imc < 25)   { classe = 'ok';   label = 'Peso normal'; }
    else if (imc < 30)   { classe = 'warn'; label = 'Sobrepeso'; }
    else                  { classe = 'err';  label = 'Obesidade'; }
    
    el.style.display = 'block';
    el.innerHTML = `<div class="card card-sub nh" style="background:var(--${classe}-soft);border-color:var(--${classe});padding:10px">
      <div class="flex aic jcb">
        <div><span class="small muted">IMC:</span> <strong style="font-size:18px;color:var(--${classe})">${imc}</strong></div>
        <span class="tag tag-${classe==='ok'?'ok':(classe==='warn'?'w':'w')}" style="${classe==='err'?'background:var(--err-soft);color:var(--err)':''}">${label}</span>
      </div>
    </div>${avisoHtml}`;
  } else if (avisoHtml) {
    el.style.display = 'block';
    el.innerHTML = avisoHtml;
  } else {
    el.style.display = 'none';
  }
}

async function saveAcompAvulso() {
  const nome = ($('#avNome').value || '').trim().toUpperCase();
  const data = $('#avData').value;
  
  if (!nome) { showToast('Preencha o nome do beneficiário', 'err'); return; }
  if (!data) { showToast('Preencha a data', 'err'); return; }
  
  const nisDigitado = ($('#avNis').value || '').trim();
  const dob = $('#avDob').value || null;
  const peso = parseFloat($('#avPeso').value) || null;
  const altura = parseInt($('#avAltura').value) || null;
  let imc = null;
  if (peso && altura && altura > 0) imc = +(peso / Math.pow(altura / 100, 2)).toFixed(2);
  
  const vS = $('#avVS')?.checked;
  const vN = $('#avVN')?.checked;
  const gestante = $('#avGest').checked;
  const prenatalS = $('#avPS')?.checked;
  const prenatalN = $('#avPN')?.checked;
  
  // Gerar NIS temporário se não informou
  const nis = nisDigitado || ('AVULSO_' + Date.now());
  const idade = dob ? Math.floor((Date.now() - new Date(dob)) / 31557600000) : null;
  
  // 1. Cadastrar beneficiário com flag AVULSO
  const beneficiario = {
    nis,
    cns: '',
    nome,
    dob,
    idade,
    endereco: '',
    bairro: '',
    cod_fam: 'FAM_AVULSO_' + nis,
    tel: '',
    cpf: '',
    gestante,
    cadastro_avulso: true,       // ← FLAG para relatórios
    data_cadastro_avulso: new Date().toISOString(),
    cadastrado_por: ME?.nome || 'Sistema',
    updated_at: new Date().toISOString()
  };
  
  await IDB.put('beneficiarios', beneficiario);
  
  // 2. Criar família avulsa
  await IDB.put('familias', {
    familyId: 'FAM_AVULSO_' + nis,
    cod_familiar: null,
    endereco: 'Cadastro avulso',
    bairro: '',
    total_membros: 1,
    membros: [beneficiario],
    cadastro_avulso: true,
    updated_at: new Date().toISOString()
  });
  
  // 3. Salvar acompanhamento com flag AVULSO (id semestral evita duplicata)
  const aId = acompId(nis, data);
  const existente = await IDB.get('acompanhamentos', aId);
  const acomp = {
    id: aId,
    nis,
    data,
    tecnico: ME?.nome || '',
    estabelecimento: await IDB.getMeta('instituicao') || '',
    peso, altura, imc,
    vacina_ok: vS ? true : (vN ? false : null),
    gestante,
    dum: gestante ? ($('#avDum').value || null) : null,
    prenatal: gestante ? (prenatalS ? 'sim' : (prenatalN ? 'nao' : null)) : null,
    observacoes: ($('#avObs').value || '').trim() || null,
    cadastro_avulso: true,       // ← FLAG para relatórios
    device_id: DEVICE_ID,
    created_at: existente?.created_at || new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  
  await IDB.put('acompanhamentos', acomp);
  invalidateAcompCache();
  _audit(existente ? 'acomp.edit' : 'acomp.create', 'acompanhamento', aId);

  showToast(`✓ Acompanhamento avulso salvo!\n${nome}`, 'ok');
  closeSheet();
  
  if (SB) setTimeout(() => Sync.upload(), 300);
}

function toggleFiltrosBusca() {

function aplicarFiltrosBusca() {
  const f = _searchFilters;
  f.eas    = document.getElementById('fEas')?.value    || '';
  f.bairro = document.getElementById('fBairro')?.value || '';
  const fz = document.querySelector('input[name="fZona"]:checked');
  f.zona   = fz ? fz.value : '';
  f.gestante = document.getElementById('fGest')?.checked || false;
  f.vacPend  = document.getElementById('fVac')?.checked  || false;
  f.semAcomp = document.getElementById('fSAc')?.checked  || false;
  f.pendFirst = document.getElementById('fPend')?.checked || false;

  // Atualiza badge no botão
  const temFiltro = f.eas||f.bairro||f.zona||f.gestante||f.vacPend||f.semAcomp;
  const btn = document.getElementById('btnFiltros');
  if (btn) btn.innerHTML = `${fi('search',13)} Filtros avançados${temFiltro?' ●':''}`;

  // Re-executa a busca com filtros atualizados
  const q = document.getElementById('sI')?.value || '';
  doSearch(q);
}

function limparFiltrosBusca() {
  _searchFilters = { eas:'', bairro:'', zona:'', gestante:false, vacPend:false, semAcomp:false, pendFirst:false };
  // Limpa controles visuais
  const ids = ['fEas','fBairro','fGest','fVac','fSAc'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'SELECT') el.value = '';
    else el.checked = false;
  });
  const fzT = document.getElementById('fZT');
  if (fzT) fzT.checked = true;
  const btn = document.getElementById('btnFiltros');
  if (btn) btn.innerHTML = `${fi('search',13)} Filtros avançados`;
  doSearch(document.getElementById('sI')?.value || '');
}

async function saveCadastroBenef() {
  const nis  = ($('#cbNis')?.value  || '').trim().replace(/\D/g,'');
  const nome = ($('#cbNome')?.value || '').trim().toUpperCase();

  if (!nis)  { showToast('NIS é obrigatório', 'err'); return; }
  if (nis.length < 11) { showToast('NIS deve ter 11 dígitos', 'err'); return; }
  if (!nome) { showToast('Nome é obrigatório', 'err'); return; }

  // Verifica duplicata
  const existente = (await getBenefCache()).find(b => b.nis === nis);
  if (existente) {
    showToast(`NIS já cadastrado: ${existente.nome}`, 'err');
    return;
  }

  const codFamRaw = ($('#cbCodFam')?.value || '').trim().replace(/\D/g,'');
  const codFam    = /^\d{3,12}$/.test(codFamRaw) ? codFamRaw : '';
  const familyId  = codFam ? 'FAM_' + codFam : 'FAM_IND_' + nis;

  const benef = {
    nis,
    nome,
    cns:     ($('#cbCns')?.value  || '').trim() || null,
    dob:     $('#cbDob')?.value   || null,
    tel:     ($('#cbTel')?.value  || '').trim() || null,
    endereco:($('#cbEndereco')?.value || '').trim() || null,
    bairro:  ($('#cbBairro')?.value   || '').trim() || null,
    cep:     ($('#cbCep')?.value  || '').trim() || null,
    zona:    $('#cbZona')?.value  || null,
    eas:     ($('#cbEas')?.value  || '').trim() || null,
    cod_fam: familyId,
    familyId,
    gestante: $('#cbGest')?.checked || false,
    cadastro_manual: true,
    created_at: new Date().toISOString()
  };

  await IDB.put('beneficiarios', benef);

  // Atualiza / cria família
  if (codFam) {
    const famExist = await IDB.get('familias', familyId);
    if (famExist) {
      if (!famExist.membros.includes(nis)) famExist.membros.push(nis);
      await IDB.put('familias', famExist);
    } else {
      await IDB.put('familias', {
        familyId,
        cod_fam: codFam,
        cod_familiar: codFam,
        endereco: benef.endereco,
        bairro: benef.bairro,
        zona: benef.zona,
        eas: benef.eas,
        membros: [{ nis, nome, dob: benef.dob || null, idade: benef.dob ? Math.floor((Date.now()-new Date(benef.dob))/31557600000) : null, gestante: benef.gestante }],
        total_membros: 1,
        updated_at: new Date().toISOString()
      });
    }
  }

  invalidateBenefCache();
  _audit('benef.create', 'beneficiario', nis);
  showToast(`✓ ${nome} cadastrado com sucesso!`, 'ok');
  closeSheet();
  setTimeout(() => showBenef(nis), 400);
}

async function exportXLSX() {
  if (typeof XLSX === 'undefined') {
    showToast('Biblioteca XLSX não carregada. Verifique conexão.', 'err');
    return;
  }
  showToast('Gerando planilha...', 'ok');

  const benefs  = await IDB.getAll('beneficiarios');
  const acomps  = (await IDB.getAll('acompanhamentos')).sort((a,b)=>new Date(b.data)-new Date(a.data));
  const bMap    = new Map(benefs.map(b=>[b.nis,b]));
  const wb      = XLSX.utils.book_new();

  // ── Aba: Resumo ──────────────────────────────────────
  const hoje    = new Date().toISOString().split('T')[0];
  const mesAtual= hoje.slice(0,7);
  const acMes   = acomps.filter(a=>a.data&&a.data.startsWith(mesAtual));
  const gestantes = benefs.filter(b=>b.gestante).length;
  const ultimoAcompMap = new Map();
  acomps.forEach(a => {
    if (!ultimoAcompMap.has(a.nis)) ultimoAcompMap.set(a.nis, a);
  });
  const famSemAcomp = benefs.filter(b => !ultimoAcompMap.has(b.nis)).length;
  const vacPend     = benefs.filter(b => ultimoAcompMap.get(b.nis)?.vacina_ok === false).length;

  const resumoData = [
    ['RESUMO DO SISTEMA — BOLSA FAMÍLIA', ''],
    ['Data de exportação', hoje],
    ['',''],
    ['INDICADORES', 'Total'],
    ['Beneficiários cadastrados', benefs.length],
    ['Acompanhamentos este mês', acMes.length],
    ['Beneficiários sem acompanhamento', famSemAcomp],
    ['Gestantes', gestantes],
    ['Vacinação pendente (último acomp.)', vacPend],
  ];
  const wsResumo = XLSX.utils.aoa_to_sheet(resumoData);
  wsResumo['!cols'] = [{wch:40},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');

  // ── Aba: Beneficiários ───────────────────────────────
  const benefHeaders = ['NIS','Nome','CNS','Nascimento','Endereço','Bairro','CEP','Zona','Telefone','Código Familiar','EAS','Gestante','Manual'];
  const benefRows = benefs.map(b => [
    b.nis, b.nome, b.cns||'', b.dob||'',
    b.endereco||'', b.bairro||'', b.cep||'', b.zona||'', b.tel||'',
    b.cod_fam||'', b.eas||'',
    b.gestante?'Sim':'Não', b.cadastro_manual?'Sim':'Não'
  ]);
  const wsBenef = XLSX.utils.aoa_to_sheet([benefHeaders, ...benefRows]);
  wsBenef['!cols'] = [
    {wch:13},{wch:40},{wch:16},{wch:12},
    {wch:40},{wch:18},{wch:10},{wch:8},{wch:15},
    {wch:14},{wch:30},{wch:9},{wch:7}
  ];
  XLSX.utils.book_append_sheet(wb, wsBenef, 'Beneficiários');

  // ── Aba: Acompanhamentos ─────────────────────────────
  const acompHeaders = ['ID','NIS','Nome','Data','Técnico','Estabelecimento','Acompanhado','Motivo Não Acomp.','Peso (kg)','Altura (cm)','IMC','Vacinação','Gestante','DUM','Pré-natal','Observações','Avulso'];
  const acompRows = acomps.map(a => {
    const b = bMap.get(a.nis);
    return [
      a.id, a.nis, b?.nome||'', a.data||'', a.tecnico||'', a.estabelecimento||'',
      a.acompanhado===false?'Não':'Sim', a.acompanhado===false?(a.motivo_na||''):'',
      a.peso||'', a.altura||'', a.imc||'',
      a.vacina_ok===true?'Sim':a.vacina_ok===false?'Não':'',
      a.gestante?'Sim':'', a.dum||'', a.prenatal||'',
      a.observacoes||'', a.cadastro_avulso?'Sim':''
    ];
  });
  const wsAcomp = XLSX.utils.aoa_to_sheet([acompHeaders, ...acompRows]);
  wsAcomp['!cols'] = [
    {wch:36},{wch:13},{wch:36},{wch:12},{wch:22},{wch:30},{wch:12},{wch:40},
    {wch:8},{wch:10},{wch:7},{wch:10},{wch:9},{wch:12},{wch:10},{wch:30},{wch:7}
  ];
  XLSX.utils.book_append_sheet(wb, wsAcomp, 'Acompanhamentos');

  // ── Abas por EAS ─────────────────────────────────────
  const easSet = [...new Set(benefs.map(b=>b.eas).filter(Boolean))].sort();
  for (const eas of easSet) {
    const membrosEas = benefs.filter(b => b.eas === eas);
    const acompsEas  = acomps.filter(a => bMap.get(a.nis)?.eas === eas);
    const nomeAba    = eas.replace(/[/\\?*[\]]/g,'').substring(0,28);

    const easHeaders = ['NIS','Nome','Último Acomp.','Peso','Altura','IMC','Vacinação','Gestante'];
    const easRows = membrosEas.map(b => {
      const ul = ultimoAcompMap.get(b.nis);
      return [
        b.nis, b.nome, ul?.data||'Sem acomp.',
        ul?.peso||'', ul?.altura||'', ul?.imc||'',
        ul ? (ul.vacina_ok===true?'Sim':ul.vacina_ok===false?'Não':'') : '',
        b.gestante?'Sim':''
      ];
    });
    const wsEas = XLSX.utils.aoa_to_sheet([easHeaders, ...easRows]);
    wsEas['!cols'] = [{wch:13},{wch:36},{wch:14},{wch:7},{wch:8},{wch:7},{wch:10},{wch:9}];
    XLSX.utils.book_append_sheet(wb, wsEas, nomeAba);
  }

  // ── Download ─────────────────────────────────────────
  const filename = `bolsa_familia_${hoje}.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast(`✓ Planilha exportada: ${filename}`, 'ok');
}

  if (tipo === 'beneficiarios') {
    const benefs = await IDB.getAll('beneficiarios');
    headers = ['NIS','Nome','CNS','Data Nascimento','Idade','Endereço','Bairro','CEP','Zona','Telefone','Código Familiar','EAS','Gestante','Avulso'];
    rows = benefs.map(b => [
      b.nis, b.nome, b.cns||'', b.dob||'', b.idade||'',
      b.endereco||'', b.bairro||'', b.cep||'', b.zona||'', b.tel||'',
      b.cod_fam||'', b.eas||'',
      b.gestante?'Sim':'', b.cadastro_avulso?'Sim':''
    ]);
    filename = `beneficiarios_${new Date().toISOString().split('T')[0]}.csv`;

  } else if (tipo === 'acompanhamentos') {
    const acomps = (await IDB.getAll('acompanhamentos')).sort((a,b)=>new Date(b.data)-new Date(a.data));
    const benefs = await IDB.getAll('beneficiarios');
    const bMap   = new Map(benefs.map(b=>[b.nis,b]));
    headers = ['ID','NIS','Nome','Data','Técnico','Estabelecimento','Acompanhado','Motivo Não Acomp.','Peso (kg)','Altura (cm)','IMC','Vacinação','Gestante','DUM','Pré-natal','Observações','Avulso','Sincronizado'];
    rows = acomps.map(a => {
      const b = bMap.get(a.nis);
      return [
        a.id, a.nis, b?.nome||'', a.data||'', a.tecnico||'', a.estabelecimento||'',
        a.acompanhado===false?'Não':'Sim', a.acompanhado===false?(a.motivo_na||''):'',
        a.peso||'', a.altura||'', a.imc||'',
        a.vacina_ok===true?'Sim':a.vacina_ok===false?'Não':'',
        a.gestante?'Sim':'', a.dum||'', a.prenatal||'',
        a.observacoes||'', a.cadastro_avulso?'Sim':'',
        a.synced_at?'Sim':'Pendente'
      ];
    });
    filename = `acompanhamentos_${new Date().toISOString().split('T')[0]}.csv`;
  } else return;

  // BOM UTF-8 para Excel reconhecer acentos corretamente
  const esc2 = v => '"' + String(v==null?'':v).replace(/"/g, '""') + '"';
  const csv  = '﻿' + [headers, ...rows].map(r => r.map(esc2).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ Exportado: ${filename}`, 'ok');
}

// EXPORTAR MAPA e-GESTOR (BFA) — campos na ordem oficial de
// digitação do Sistema PBF na Saúde (bfa.saude.gov.br)
// ═══════════════════════════════════════════════════════
const fmtBR = iso => {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);
};
async function exportEgestor() {
  if (typeof XLSX === 'undefined') {
    showToast('Biblioteca XLSX não carregada. Verifique conexão.', 'err');
    return;
  }
  showToast('Gerando mapa e-Gestor...', 'ok');

  const benefs   = (await getBenefCache()).slice().sort((a,b)=> (a.eas||'').localeCompare(b.eas||'') || (a.nome||'').localeCompare(b.nome||''));
  const acompSem = await acompanhadosNoSemestre();
  const inst     = await IDB.getMeta('instituicao') || '';
  const vi       = await IDB.getMeta('vigenciaInicio') || '';
  const vf       = await IDB.getMeta('vigenciaFim') || '';
  const hoje     = new Date().toISOString().split('T')[0];

  const wb  = XLSX.utils.book_new();
  const hdr = [
    ['MAPA DE DIGITAÇÃO — SISTEMA PBF NA SAÚDE (e-Gestor AB)'],
    [inst],
    [`Vigência: ${semestreLabel(semestreAtualRef())}${vi?` (${fmtBR(vi)} a ${fmtBR(vf)})`:''} · Gerado em ${fmtBR(hoje)}`],
    [],
    ['NIS','Nome do Beneficiário','Data de Nascimento','CNS','EAS','Situação na Vigência','Motivo de Não Acompanhamento',
     'Data do Acompanhamento','Peso (kg)','Altura (cm)','Vacinação em dia','Gestante','DUM','Pré-natal em dia'],
  ];
  const rows = benefs.map(b => {
    const a = acompSem.get(b.nis);
    return [
      String(b.nis||'').padStart(11,'0'),
      b.nome || '',
      fmtBR(b.dob),
      b.cns || '',
      b.eas || '',
      a ? (a.acompanhado===false ? 'Não acompanhado' : 'Acompanhado') : 'Pendente',
      a?.acompanhado===false ? (a.motivo_na||'') : '',
      a ? fmtBR(a.data) : '',
      a?.peso ?? '',
      a?.altura ?? '',
      a ? (a.vacina_ok===true?'Sim':a.vacina_ok===false?'Não':'') : '',
      a ? (a.gestante?'Sim':'Não') : '',
      a?.gestante ? fmtBR(a.dum) : '',
      a?.gestante ? (a.prenatal==='sim'?'Sim':a.prenatal==='nao'?'Não':'') : ''
    ];
  });
  const ws = XLSX.utils.aoa_to_sheet([...hdr, ...rows]);
  ws['!cols'] = [{wch:13},{wch:40},{wch:14},{wch:17},{wch:30},{wch:16},{wch:40},{wch:16},{wch:9},{wch:11},{wch:14},{wch:9},{wch:12},{wch:14}];
  ws['!merges'] = [0,1,2].map(r => ({s:{r,c:0}, e:{r,c:13}}));
  XLSX.utils.book_append_sheet(wb, ws, 'Mapa e-Gestor');

  // Resumo por EAS (facilita conferência da meta de acompanhamento por unidade)
  const porEas = new Map();
  benefs.forEach(b => {
    const k = b.eas || '(sem EAS)';
    const o = porEas.get(k) || { total:0, acomp:0 };
    o.total++; if (acompSem.get(b.nis)?.acompanhado !== false && acompSem.has(b.nis)) o.acomp++;
    porEas.set(k, o);
  });
  const resumo = [['EAS','Beneficiários','Acompanhados','Pendentes','% Acompanhamento'],
    ...[...porEas.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o]) =>
      [k, o.total, o.acomp, o.total-o.acomp, o.total? Math.round(o.acomp/o.total*100)+'%':'—'])];
  const wsR = XLSX.utils.aoa_to_sheet(resumo);
  wsR['!cols'] = [{wch:34},{wch:13},{wch:13},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumo por EAS');

  const filename = `mapa_egestor_${semestreAtualRef()}_${hoje}.xlsx`;
  XLSX.writeFile(wb, filename);
  _audit('data.export', 'e-gestor', `${rows.length} benef.`);
  showToast(`✓ Mapa e-Gestor exportado: ${filename}`, 'ok');
}

async function saveEditAcomp(id) {
  const a = await IDB.get('acompanhamentos', id);
  if (!a) { showToast('Acompanhamento não encontrado', 'err'); return; }

  const data = $('#eaD').value;
  if (!data) { showToast('Preencha a data', 'err'); return; }

  const acompanhado = !$('#eaAcN')?.checked;
  const motivo_na = acompanhado ? null : ($('#eaMotivo')?.value || null);
  if (!acompanhado && !motivo_na) { showToast('Selecione o motivo do não acompanhamento','err'); return; }

  const peso   = parseFloat($('#eaP').value) || null;
  const altura = parseInt($('#eaA').value)   || null;
  let imc = null;
  if (peso && altura && altura > 0) imc = +(peso / Math.pow(altura/100, 2)).toFixed(2);

  const gestante  = $('#eaG').checked;
  const prenatalS = $('#eaPS')?.checked;
  const prenatalN = $('#eaPN')?.checked;

  a.data        = data;
  a.acompanhado = acompanhado;
  a.motivo_na   = motivo_na;
  a.peso       = acompanhado ? peso : null;
  a.altura     = acompanhado ? altura : null;
  a.imc        = acompanhado ? imc : null;
  a.vacina_ok  = acompanhado ? ($('#eaVS')?.checked ? true : ($('#eaVN')?.checked ? false : null)) : null;
  a.gestante   = acompanhado ? gestante : false;
  a.dum        = acompanhado && gestante ? ($('#eaDum').value || null) : null;
  a.prenatal   = acompanhado && gestante ? (prenatalS ? 'sim' : (prenatalN ? 'nao' : null)) : null;

  // TRIA desativada: preserva valores já gravados (form não exibe os rádios)
  if (await triaAtiva()) {
    const eTriaA = acompanhado ? document.querySelector('input[name="eaTriaA"]:checked')?.value : null;
    const eTriaB = acompanhado ? document.querySelector('input[name="eaTriaB"]:checked')?.value : null;
    a.tria_a = (eTriaA==='1') ? true : (eTriaA==='0' ? false : null);
    a.tria_b = (eTriaB==='1') ? true : (eTriaB==='0' ? false : null);
    a.tria_risco = (a.tria_a==null||a.tria_b==null) ? null
                 : ((a.tria_a?1:0)+(a.tria_b?1:0)===0 ? 'sem_risco'
                 : ((a.tria_a?1:0)+(a.tria_b?1:0)===1 ? 'risco' : 'risco_alto'));
  } else if (!acompanhado) {
    a.tria_a = a.tria_b = null; a.tria_risco = null;
  }

  a.observacoes = ($('#eaO').value || '').trim() || null;
  a.updated_at = new Date().toISOString();
  delete a.synced_at; // marcar para re-sync

  await IDB.put('acompanhamentos', a);
  invalidateAcompCache();
  _audit('acomp.edit', 'acompanhamento', a.id);
  showToast('✓ Acompanhamento atualizado', 'ok');
  closeSheet();
  if (SB) setTimeout(() => Sync.upload(), 300);
  // Recarregar a view correta
  const page = $('#mc')?.dataset?.page;
  if (page === 'acomp') nav('acomp');
  else if (CURB) setTimeout(() => showBenef(a.nis), 350);
}

async function deleteAcomp(id) {
  const reg = await IDB.get('acompanhamentos', id);
  if (!reg) return;
  const nis = CURB?.nis; // captura antes que closeSheet limpe
  await IDB.delete('acompanhamentos', id);
  invalidateAcompCache();
  _audit('acomp.delete', 'acompanhamento', id);
  // SOFT-DELETE: marca deleted_at na nuvem (não apaga). Assim a exclusão propaga
  // para os outros aparelhos sem "ressuscitar" em edição concorrente.
  if (SB && reg.synced_at) {
    SB.from('acompanhamentos')
      .update({ deleted_at: new Date().toISOString(), updated_at: new Date().toISOString() })
      .eq('id', id)
      .then(({ error }) => { if (error) console.warn('⚠️ Soft-delete remoto falhou:', error.message); });
  }
  const page = $('#mc')?.dataset?.page;
  const refresh = () => {
    if (page === 'acomp') nav('acomp');
    else if (nis) setTimeout(() => showBenef(nis), 250);
  };
  refresh();
  showUndoToast('Acompanhamento excluído', async () => {
    delete reg.synced_at; delete reg.deleted_at; // restaura
    reg.updated_at = new Date().toISOString();
    await IDB.put('acompanhamentos', reg);
    invalidateAcompCache();
    _updateSyncBadge();
    // Restaura na nuvem (limpa o deleted_at)
    if (SB) {
      SB.from('acompanhamentos').update({ deleted_at: null, updated_at: new Date().toISOString() }).eq('id', id)
        .then(({ error }) => { if (error) console.warn('undo remoto:', error.message); });
      setTimeout(() => Sync.upload(), 300);
    }
    showToast('Exclusão desfeita', 'ok');
    refresh();
  });
}

async function updUser(uid) {
  const users = JSON.parse(await IDB.getMeta('users') || '[]');
  const u = users.find(x=>x.id===uid); if(!u)return;
  u.nome=$('#eN').value.trim(); u.email=$('#eE').value.trim();
  const np=$('#eP').value.trim();
  if(np){ // atualiza credencial offline salgada
    if(np.length < 6){ showToast('A senha deve ter ao menos 6 caracteres','err'); return; }
    if(!u.off_salt) u.off_salt = SecureAuth._randSalt();
    u.off_hash = await SecureAuth.hashSalted(np, u.off_salt);
    delete u.pass; delete u.pass_hash;
  }
  u.role=$('#eR').value;
  u.eas=($('#eEas')?.value||'').trim();
  if(uid !== ME.id){ u.ativo = $('#eAtivo')?.checked !== false; } // não permite desativar a si mesmo
  await IDB.setMeta('users', JSON.stringify(users));
  _audit('user.edit', 'usuario', u.user);
  showToast('✓ Atualizado','ok'); closeSheet(); nav('config');
}

// Gera senha provisória, força troca no próximo login e mostra ao admin
async function resetUserPass(uid) {
  const users = JSON.parse(await IDB.getMeta('users') || '[]');
  const u = users.find(x=>x.id===uid); if(!u)return;
  const prov = 'bf' + Math.floor(1000 + Math.random()*9000); // ex.: bf4827
  u.off_salt = SecureAuth._randSalt();
  u.off_hash = await SecureAuth.hashSalted(prov, u.off_salt);
  u.mustChangePass = true;
  delete u.pass; delete u.pass_hash;
  await IDB.setMeta('users', JSON.stringify(users));
  _audit('user.resetpass', 'usuario', u.user);
  closeSheet();
  openSheet('Senha provisória gerada', `<div class="s3">

      <div class="small muted">Senha provisória de <b>${esc(u.nome)}</b> (${esc(u.user)}):</div>

// Estado de carregamento do botão Entrar (spinner)
function _setLoginLoading(on) {
  const btn = document.querySelector('.lcard-btn');
  if (!btn) return;
  if (on) {
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.dataset.html = btn.innerHTML;
    btn.innerHTML = '<span class="lspin"></span> Entrando…';
  } else {
    btn.classList.remove('loading');
    if (btn.dataset.html) { btn.innerHTML = btn.dataset.html; delete btn.dataset.html; }
  }
}

// Wrapper seguro: captura erros mesmo se doLogin não existir ainda
function _doLoginSafe() {
  const errEl = document.getElementById('loginErr');
  if (errEl) { errEl.classList.remove('show'); errEl.innerHTML = ''; }
  _setLoginLoading(true);
  try {
    doLogin().catch(e => {
      console.error('❌ doLogin error:', e);
      _showLoginErr('Erro: ' + (e && e.message ? e.message : String(e)));
    }).finally(() => _setLoginLoading(false));
  } catch(e) {
    console.error('❌ doLogin not defined:', e);
    _setLoginLoading(false);
    _showLoginErr('Erro ao carregar: recarregue a página.');
  }
}

function _showLoginErr(msg, canReset) {
  const el = document.getElementById('loginErr');
  if (!el) return;
  el.innerHTML = msg + (canReset
    ? '<br><span class="lerr-reset" onclick="_loginResetUsers()">Redefinir usuários padrão</span>'
    : '');
  el.classList.add('show');
  // Treme o card para chamar atenção ao erro
  const card = document.querySelector('.lcard');
  if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  try { showToast(msg, 'err'); } catch(e) {}
}

  const defaults = [
    {id:1, user:'admin',       pass_hash: await SecureAuth.hashPassword('123'), nome:'Administrador', role:'admin',         ativo:true},
    {id:2, user:'operador',    pass_hash: await SecureAuth.hashPassword('123'), nome:'Operador',       role:'operador',      ativo:true},

async function doLogin() {
  try {
    console.log('🔐 Iniciando login...');

    // Limpa erro anterior
    const errEl = document.getElementById('loginErr');
    if (errEl) { errEl.classList.remove('show'); errEl.innerHTML = ''; }

    const user = $('#loginUser').value.trim();
    const pass = $('#loginPass').value.trim();

    if (!user || !pass) {
      _showLoginErr('Preencha usuário e senha');
      return;
    }

    console.log('📋 Buscando usuários...');
    const users = JSON.parse(await IDB.getMeta('users') || '[]');

    // Criar defaults se não existirem
    if (!users.length) {
      console.log('👥 Criando usuários padrão...');
      const defaults = [
        {id:1, user:'admin',       pass_hash: await SecureAuth.hashPassword('123'), nome:'Administrador', role:'admin',        ativo:true},
        {id:2, user:'operador',    pass_hash: await SecureAuth.hashPassword('123'), nome:'Operador',      role:'operador',     ativo:true},
        {id:3, user:'visualizador',pass_hash: await SecureAuth.hashPassword('123'), nome:'Visualizador',  role:'visualizador', ativo:true}
      ];
      await IDB.setMeta('users', JSON.stringify(defaults));
      users.push(...defaults);
      console.log('✅ Usuários criados:', defaults.map(u => u.user));
    }

    // Localiza o perfil local por username OU email (perfil/role + cache offline)
    const idLower = user.toLowerCase();
    const looksEmail = user.includes('@');
    let u = users.find(x => (x.user === user || (x.email || '').toLowerCase() === idLower) && x.ativo !== false);

    const online = !!(SB && navigator.onLine);
    // Email para autenticar: do perfil local OU o próprio texto digitado (aparelho novo)
    const loginEmail = u?.email || (looksEmail ? user : null);

    // ── CAMINHO ONLINE: autentica no Supabase Auth e AUTO-CONFIGURA o aparelho ──
    if (online && loginEmail) {
      console.log('🌐 Tentando login online (Supabase Auth)...');
      try {
        const { data, error } = await SB.auth.signInWithPassword({ email: loginEmail, password: pass });
        if (!error && data?.session) {
          console.log('✅ Autenticado no Supabase como', loginEmail);
          window._sbAuthed = true; window._sbAccount = loginEmail; window._sbAuthErr = null;

          // Auto-configuração: guarda as credenciais de sync deste aparelho
          await IDB.setMeta('syncEmail', loginEmail);
          await IDB.setMeta('syncPass', pass);

          // Aparelho novo (sem perfil local): baixa usuários/permissões/config da nuvem
          if (!u) {
            console.log('⬇️ Primeiro acesso neste aparelho — baixando dados da nuvem...');
            try { await Sync.downloadSettings(); } catch (e) { console.warn('downloadSettings:', e); }
            const users2 = JSON.parse(await IDB.getMeta('users') || '[]');
            u = users2.find(x => (x.email || '').toLowerCase() === loginEmail.toLowerCase() && x.ativo !== false);
          }
          if (!u) {
            _showLoginErr('Autenticado na nuvem, mas seu perfil não foi encontrado.<br>Peça ao administrador para cadastrar este usuário no app e clicar em "Sincronizar tudo".');
            return;
          }

          await _cacheOfflineCred(u.id, pass); // semeia/atualiza credencial offline
          if (pass === '123' || u.mustChangePass) { _showForcePassChange(u); return; }
          await _finishLogin(u);
          return;
        }
        // Supabase rejeitou (credenciais inválidas, conta inexistente, ou rede):
        // não bloqueia — tenta validar pela credencial local (offline-first).
        console.warn('⚠️ Login online indisponível, tentando offline:', error?.message || 'sem sessão');
      } catch (e) {
        console.warn('⚠️ Falha de rede no login — tentando offline:', e?.message);
      }
    }

    // ── CAMINHO OFFLINE: verifica contra credencial salva localmente ──
    if (!u) {
      _showLoginErr(online
        ? 'Usuário ou senha incorretos'
        : 'Usuário não encontrado neste aparelho.<br>Conecte-se à internet para o primeiro acesso.');
      return;
    }
    console.log('🔑 Verificando credencial offline...');
    const hasLocalCred = !!(u.off_hash || u.pass_hash || u.pass);
    if (!hasLocalCred) {
      _showLoginErr('Faça login online ao menos uma vez neste dispositivo antes de usar offline.');
      return;
    }
    const valid = await _verifyOfflineCred(u, pass);
    if (!valid) {
      console.warn('❌ Senha incorreta (offline)');
      _showLoginErr('Usuário ou senha incorretos');
      return;
    }

    console.log('✅ Login offline bem-sucedido:', u.nome);
    if (pass === '123' || u.mustChangePass) { _showForcePassChange(u); return; }
    await _finishLogin(u);
  } catch (error) {
    console.error('❌ Erro no login:', error);
    _showLoginErr('Erro interno: ' + (error && error.message ? error.message : String(error)));
  }
}

// Etapas pós-autenticação (compartilhado entre login normal e troca forçada de senha)
async function _finishLogin(u) {
  ME = u;
  await _getPerms();

async function _saveForcedPass(uid) {
  const p1 = $('#npass1').value, p2 = $('#npass2').value;
  if (p1.length < 6) { showToast('A senha deve ter pelo menos 6 caracteres', 'err'); return; }
  if (['123','123456','111111','senha','000000'].includes(p1)) { showToast('Escolha uma senha menos óbvia', 'err'); return; }
  if (p1 !== p2) { showToast('As senhas não coincidem', 'err'); return; }
  const users = JSON.parse(await IDB.getMeta('users') || '[]');
  const u = users.find(x => x.id === uid);
  if (!u) { showToast('Usuário não encontrado', 'err'); return; }

  // Online + autenticado: troca a senha também no Supabase Auth (fonte da verdade)
  if (SB && navigator.onLine && window._sbAuthed) {
    try {
      const { error } = await SB.auth.updateUser({ password: p1 });
      if (error) console.warn('⚠️ Não foi possível atualizar a senha no Supabase:', error.message);
    } catch (e) { console.warn('⚠️ updateUser falhou:', e?.message); }
  }

  // Atualiza cache offline (salgado por usuário) com a nova senha
  if (!u.off_salt) u.off_salt = SecureAuth._randSalt();
  u.off_hash = await SecureAuth.hashSalted(p1, u.off_salt);
  delete u.pass; delete u.pass_hash; // remove formatos legados
  delete u.mustChangePass; // troca concluída
  await IDB.setMeta('users', JSON.stringify(users));
  closeSheet();
  await _finishLogin(u);
}

function uiConfirm(message, opts) {
  opts = opts || {};
  const title = opts.title || 'Confirmar';
  const okText = opts.okText || 'Confirmar';
  const cancelText = opts.cancelText || 'Cancelar';
  const danger = !!opts.danger;
  return new Promise(function(resolve) {
    const ov = document.createElement('div');
    ov.className = 'ui-confirm-ov';
    ov.innerHTML = `<div class="ui-confirm" role="dialog" aria-modal="true">
      <div class="ui-confirm-title">${esc(title)}</div>
      <div class="ui-confirm-msg">${esc(message).replace(/\n/g,'<br>')}</div>
      <div class="ui-confirm-btns">
        <button class="btn btn-g ui-confirm-cancel">${esc(cancelText)}</button>
        <button class="btn ${danger?'btn-danger':'btn-p'} ui-confirm-ok">${esc(okText)}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ ov.classList.add('show'); });
    const done = function(v){ ov.classList.remove('show'); setTimeout(function(){ ov.remove(); }, 180); resolve(v); };
    ov.querySelector('.ui-confirm-ok').onclick = function(){ done(true); };
    ov.querySelector('.ui-confirm-cancel').onclick = function(){ done(false); };
    ov.onclick = function(e){ if (e.target === ov) done(false); };
  });
}

function showToast(msg, type='') {
  // Feedback tátil sutil no celular (sucesso = toque curto, erro = duplo)
  try { if (navigator.vibrate) navigator.vibrate(type==='err' ? [40,60,40] : type==='ok' ? 18 : 0); } catch(e){}
  const t = $('#toast');
  const icons = { ok: fi('check-circle',16), err: fi('x-circle',16), warn: fi('alert-triangle',16) };
  const icon = icons[type] || fi('info',16);
  t.innerHTML = `<span class="t-icon">${icon}</span><span class="t-msg">${esc(msg)}</span>`;
  t.className = type ? `show ${type}` : 'show';
  t.style.pointerEvents = '';
  clearTimeout(t._tid);
  // Duração configurável (padrão 4s)
  IDB.getMeta('designToastDur').then(dur => {
    t._tid = setTimeout(() => t.classList.remove('show'), (parseInt(dur) || 4) * 1000);
  });
}

// Toast com botão "Desfazer" — usado em exclusões
function showUndoToast(msg, onUndo, seconds = 8) {
  const t = $('#toast');
  t.innerHTML = `<span class="t-icon">${fi('check-circle',16)}</span><span class="t-msg">${esc(msg)}</span>` +
    `<button id="undoBtn" style="flex-shrink:0;margin-left:6px;font-weight:700;color:inherit;text-decoration:underline;font-size:13px;padding:0">Desfazer</button>`;
  t.className = 'show ok';
  t.style.pointerEvents = 'all';
  clearTimeout(t._tid);
  const hide = () => { t.classList.remove('show'); t.style.pointerEvents = ''; };
  document.getElementById('undoBtn').onclick = () => { clearTimeout(t._tid); hide(); onUndo(); };
  t._tid = setTimeout(hide, seconds * 1000);
}

async function applyCustomDesign() {
  const root = document.documentElement;
  const body = document.body;

  // ── Fonte ──────────────────────────────────────────────
  const fontKey  = await IDB.getMeta('designFont')     || 'system';
  const fontSize = await IDB.getMeta('designFontSize') || '15';
  root.style.setProperty('--font-family', FONT_STACKS[fontKey] || FONT_STACKS.system);
  root.style.setProperty('--font-size-base', fontSize + 'px');

  // ── Cores extras ──────────────────────────────────────
  const corOk   = await IDB.getMeta('corOk');
  const corWarn = await IDB.getMeta('corWarn');
  const corErr  = await IDB.getMeta('corErr');
  if (corOk)   root.style.setProperty('--ok',  corOk);
  if (corWarn) root.style.setProperty('--warn', corWarn);
  if (corErr)  root.style.setProperty('--err',  corErr);

  // ── Densidade ─────────────────────────────────────────
  const density = await IDB.getMeta('designDensity') || 'normal';
  body.classList.remove('density-compact', 'density-comfortable');
  if (density !== 'normal') body.classList.add('density-' + density);

  // ── Raio das bordas ───────────────────────────────────
  const radius = await IDB.getMeta('designRadius') || 'medium';
  body.classList.remove('radius-square', 'radius-pill');
  if (radius === 'square') body.classList.add('radius-square');
  else if (radius === 'pill') body.classList.add('radius-pill');
  else {
    // medium: valores padrão
    root.style.setProperty('--r', '8px');
    root.style.setProperty('--r-lg', '12px');
  }

  // ── Sombra dos cards ──────────────────────────────────
  const shadow = await IDB.getMeta('designShadow') || 'none';
  body.classList.remove('shadow-sm', 'shadow-md', 'shadow-lg');
  if (shadow !== 'none') body.classList.add('shadow-' + shadow);

  // ── Estilo dos botões ─────────────────────────────────
  const btnStyle = await IDB.getMeta('designBtn') || 'filled';
  body.classList.remove('btn-outline', 'btn-soft');
  if (btnStyle !== 'filled') body.classList.add('btn-' + btnStyle);

    const el = document.getElementById('loginSubtitle');
    if (el) el.textContent = loginSubtitle;
  }

  // ── Imagem de fundo no login ──────────────────────────
  const loginBg = await IDB.getMeta('designLoginBg');
  const loginEl = document.getElementById('pageLogin');
  if (loginBg && loginEl) {
    loginEl.style.backgroundImage = `url(${loginBg})`;
    loginEl.classList.add('has-bg');
  } else if (loginEl) {
    loginEl.style.backgroundImage = '';
    loginEl.classList.remove('has-bg');
  }

  // ── Cor de destaque (accent) ──────────────────────────
  const accentColor = await IDB.getMeta('designAccent');
  if (accentColor) root.style.setProperty('--accent', accentColor);
  else root.style.removeProperty('--accent');

  // ── Cor de fundo do app ───────────────────────────────
  const bgColor = await IDB.getMeta('designBg');
  if (bgColor) root.style.setProperty('--bg', bgColor);
  else root.style.removeProperty('--bg');

  // ── Cor do cabeçalho (header) ─────────────────────────
  const headerBg = await IDB.getMeta('designHeaderBg');
  const headerEl = document.querySelector('header');
  if (headerBg && headerEl) headerEl.style.background = headerBg;
  else if (headerEl) headerEl.style.background = '';

  // ── Cor do menu inferior ──────────────────────────────
  const navBg = await IDB.getMeta('designNavBg');
  const navEl = document.querySelector('nav.bottom');
  if (navBg && navEl) navEl.style.background = navBg;
  else if (navEl) navEl.style.background = '';

  // ── Logo principal (anel circular no topo do login) ──────
  // Prioridade: logo do sistema > ícone do app (custom) > ícone oficial embutido
  const logo = await IDB.getMeta('logoApp') || await IDB.getMeta('appIcon') || APP_ICON;
  const loginLogo = document.getElementById('loginLogo');
  if (loginLogo) {
    loginLogo.innerHTML = `<img src="${logo}" style="width:88px;height:88px;object-fit:contain;border-radius:20px">`;
  }

  // ── Imagem atrás da logo (hero da tela de login) ──────
  const heroBg = await IDB.getMeta('designLoginHeroBg');
  const heroEl = document.querySelector('.lcard-hero');
  if (heroEl) {
    if (heroBg) { heroEl.style.backgroundImage = `url("${heroBg}")`; heroEl.classList.add('has-hero-bg'); }
    else { heroEl.style.backgroundImage = ''; heroEl.classList.remove('has-hero-bg'); }
  }

  _renderLoginBlocks();

  const navLabels = await IDB.getMeta('designNavLabels') || 'show';
  body.classList.toggle('nav-no-labels', navLabels === 'hide');

  // ── Menu compacto ─────────────────────────────────────
  const navCompact = await IDB.getMeta('designNavCompact') || 'off';
  body.classList.toggle('nav-compact', navCompact === 'on');

  // ── Largura do conteúdo ───────────────────────────────
  const cWidth = await IDB.getMeta('designWidth') || 'normal';
  body.classList.remove('width-narrow', 'width-wide');
  if (cWidth !== 'normal') body.classList.add('width-' + cWidth);

  // ── Cor de destaque secundária (detalhe) ──────────────
  const accent2 = await IDB.getMeta('designAccent2');
  if (accent2) { root.style.setProperty('--accent-2', accent2); root.style.setProperty('--accent-2-soft', accent2 + '26'); }
  else { root.style.removeProperty('--accent-2'); root.style.removeProperty('--accent-2-soft'); }

  // ── Menu no computador (barra lateral / inferior) ─────
  const deskNav = await IDB.getMeta('designDeskNav') || 'sidebar';
  body.classList.toggle('desk-bottom', deskNav === 'bottom');

  // ── Indicador do item ativo do menu ───────────────────
  const navInd = await IDB.getMeta('designNavInd') || 'bar';
  body.classList.toggle('navind-pill', navInd === 'pill');

  // ── Plano de fundo ────────────────────────────────────
  const bgStyle = await IDB.getMeta('designBgStyle') || 'solid';
  body.classList.toggle('bg-gradient', bgStyle === 'gradient');

  // ── Linhas zebradas ───────────────────────────────────
  const zebra = await IDB.getMeta('designZebra') || 'off';
  body.classList.toggle('zebra', zebra === 'on');

  // ── Separadores entre itens ───────────────────────────
  const dividers = await IDB.getMeta('designDividers') || 'off';
  body.classList.toggle('list-dividers', dividers === 'on');

  // ── Velocidade das animações ──────────────────────────
  const animSpeed = await IDB.getMeta('designAnim') || 'normal';
  body.classList.remove('anim-none', 'anim-fast', 'anim-slow');
  if (animSpeed !== 'normal') body.classList.add('anim-' + animSpeed);

  // ── Fundo do app (main) ───────────────────────────────
  const appBg = await IDB.getMeta('designAppBg');
  const mcEl = document.getElementById('mc');
  if (appBg && mcEl) { mcEl.style.backgroundImage = `url(${appBg})`; mcEl.classList.add('has-app-bg'); }
  else if (mcEl) { mcEl.style.backgroundImage = ''; mcEl.classList.remove('has-app-bg'); }
}

// Autentica no Supabase Auth (RLS exige usuário autenticado para ler/escrever)
async function _sbSignIn() {
  if (!SB) return false;
  try {
    const { data: { session } } = await SB.auth.getSession();
    if (session) { window._sbAuthed = true; window._sbAccount = session.user?.email || ''; return true; }
    const email = await IDB.getMeta('syncEmail');
    const pass  = await IDB.getMeta('syncPass');
    if (!email || !pass) {
      window._sbAuthed = false;
      console.warn('⚠️ Sem credenciais de sincronização — RLS bloqueará leitura/escrita');
      return false;
    }
    const { error } = await SB.auth.signInWithPassword({ email, password: pass });
    if (error) {
      window._sbAuthed = false;
      window._sbAuthErr = error.message;
      console.warn('⚠️ Auth Supabase falhou:', error.message);
      return false;
    }
    window._sbAuthErr = null;
    window._sbAuthed = true;
    window._sbAccount = email;
    console.log('✅ Autenticado no Supabase como', email);
    return true;
  } catch(e) { console.warn('⚠️ Auth Supabase:', e); window._sbAuthed = false; return false; }
}

  const url = await IDB.getMeta('supabaseUrl');

async function gerarRelatorio(filtro = {}) {
  showToast('Gerando relatório…', '');
  const inst    = await IDB.getMeta('instituicao') || 'Prefeitura Municipal';
  const vi      = await IDB.getMeta('vigenciaInicio') || '';
  const vf      = await IDB.getMeta('vigenciaFim') || '';
  const benefs  = await IDB.getAll('beneficiarios');
  const acomps  = await IDB.getAll('acompanhamentos');
  const _famRefIds = new Set(benefs.map(b=>b.cod_fam).filter(Boolean));
  const familias = (await IDB.getAll('familias')).filter(f => _famRefIds.has(f.familyId));

  // Agrupar acomp por NIS (último por NIS)
  const ultimoAcomp = new Map();
  acomps.forEach(a => {
    const prev = ultimoAcomp.get(a.nis);
    if (!prev || new Date(a.data) > new Date(prev.data)) ultimoAcomp.set(a.nis, a);
  });

  // Aplicar filtro (por EAS)
  const { eas = '' } = filtro;
  const famsFiltradas = eas
    ? familias.filter(f => f.eas && f.eas.includes(eas))
    : familias;

  // Resumo por EAS
  const porEas = new Map();
  benefs.forEach(b => {
    const key = b.eas || 'Sem EAS';
    if (!porEas.has(key)) porEas.set(key, { total: 0, acompanhados: 0, gestantes: 0, vacPend: 0 });
    const s = porEas.get(key);
    s.total++;
    const a = ultimoAcomp.get(b.nis);
    if (a) {
      s.acompanhados++;
      if (a.gestante) s.gestantes++;
      if (a.vacina_ok === false) s.vacPend++;
    }
  });

  const hoje = new Date().toLocaleDateString('pt-BR');
  const acMes = acomps.filter(a => {
    const d = new Date(a.data); const ini = new Date(); ini.setDate(1); ini.setHours(0,0,0,0);
    return d >= ini;
  }).length;

  const easOptions = [...new Set(familias.map(f=>f.eas).filter(Boolean))].sort();

  const html = `
    <div>
      ${await _reportHeader(
        'Programa Bolsa Família — Relatório de Acompanhamento',
        `Emitido em ${hoje}${vi&&vf?' · Vigência '+new Date(vi+'T12:00').toLocaleDateString('pt-BR')+' a '+new Date(vf+'T12:00').toLocaleDateString('pt-BR'):''}`
      )}

      <h2>Resumo Geral</h2>
      <table>
        <tr><th>Beneficiários</th><th>Famílias</th><th>Acomp. Total</th><th>Acomp. Mês Atual</th><th>Gestantes Acomp.</th></tr>
        <tr><td>${benefs.length}</td><td>${familias.length}</td><td>${acomps.length}</td><td>${acMes}</td><td>${acomps.filter(a=>a.gestante).length}</td></tr>
      </table>

      <h2>Resumo por EAS</h2>
      <table>
        <tr><th>Unidade de Saúde (EAS)</th><th>Beneficiários</th><th>Acompanhados</th><th>Cobertura</th><th>Gestantes</th><th>Vac. Pendente</th></tr>
        ${[...porEas.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([easName, s])=>`
          <tr class="no-break">
            <td>${esc(easName)}</td>
            <td style="text-align:center">${s.total}</td>

            <td style="text-align:center">${s.total>0?Math.round(s.acompanhados/s.total*100):0}%</td>
            <td style="text-align:center">${s.gestantes}</td>
            <td style="text-align:center;color:${s.vacPend>0?'#b91c1c':'inherit'}">${s.vacPend}</td>
          </tr>`).join('')}
      </table>

      <h2>Famílias sem nenhum acompanhamento</h2>
      <table>
        <tr><th>Código Familiar</th><th>Endereço</th><th>Bairro</th><th>EAS</th><th>Membros</th></tr>

          <tr class="no-break">

function _easDoLogin() { return (ME && ME.eas) ? String(ME.eas).trim() : ''; }

async function gerarRelatorioAcomp(opts) {
  opts = opts || {};
  const isAdmin = ME.role === 'admin';
  const meuEas = _easDoLogin();
  if (!isAdmin && !meuEas) {
    showToast('Sua conta não tem um Estabelecimento de Saúde vinculado. Peça ao administrador para vincular em Config → Usuários.', 'warn');
    return;
  }
  const easFiltro = isAdmin ? (opts.eas || '') : meuEas;

  const benefs = await getBenefCache();
  const acomps = await getAcompCache();
  const byNis = new Map();
  benefs.forEach(b => byNis.set(b.nis, b));

  // Só acompanhamentos efetivamente realizados (com dados preenchidos)
  let feitos = acomps.filter(a => a && a.acompanhado !== false && a.data);
  // Último por NIS
  const ultimo = new Map();
  feitos.forEach(a => {
    const at = ultimo.get(a.nis);
    if (!at || String(a.data) > String(at.data)) ultimo.set(a.nis, a);
  });

  let linhas = [];
  ultimo.forEach((a, nis) => {
    const b = byNis.get(nis) || {};
    const eas = (b.eas || a.estabelecimento || '').trim();
    if (easFiltro && eas !== easFiltro) return;
    linhas.push({
      cod_fam: b.cod_fam || '',
      nis: nis,
      nome: b.nome || '',
      dob: b.dob || '',
      eas: eas || '(sem EAS)',
      data: a.data,
      peso: a.peso,
      altura: a.altura,
      imc: a.imc,
      vacina: a.vacina_ok,
      gestante: a.gestante,
      prenatal: a.prenatal,
      tria_risco: a.tria_risco,
      obs: a.observacoes
    });
  });

  if (!linhas.length) {
    showToast('Nenhum acompanhamento realizado' + (easFiltro ? ' neste EAS' : '') + '.', 'warn');
    return;
  }
  linhas.sort((x,y) => (x.eas||'').localeCompare(y.eas||'','pt') || (x.nome||'').localeCompare(y.nome||'','pt'));

  const fmtD = d => { if(!d) return '—'; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:esc(String(d)); };
  const vac = v => v===true?'Sim':(v===false?'Não':'—');
  const idadeDe = dob => { const m=String(dob||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return '—'; const n=new Date(+m[1],+m[2]-1,+m[3]); if(isNaN(n)) return '—'; const h=new Date(); let a=h.getFullYear()-n.getFullYear(); if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate())) a--; return a>=0?String(a):'—'; };
  const preN = p => p==='sim'?'Sim':(p==='nao'?'Não':'—');
  const triaTxt = r => r==='sem_risco'?'Sem risco':(r==='risco'?'Risco':(r==='risco_alto'?'Risco alto':'—'));
  const cabTab = `<tr><th class="mk">✓</th><th>Cód. Familiar</th><th>NIS</th><th>Nome</th><th>Nascimento</th><th>Idade</th><th>EAS</th><th>Data acomp.</th><th>Peso (kg)</th><th>Estatura (cm)</th><th>IMC</th><th>Vacina</th><th>Gestante</th><th>Pré-natal</th><th>TRIA</th><th>Observações</th></tr>`;
  const linhaHtml = r => `<tr class="no-break">
      <td class="mk">✓</td>
      <td>${esc(r.cod_fam)}</td>
      <td>${esc(r.nis)}</td>
      <td>${esc(r.nome)}</td>
      <td style="text-align:center">${fmtD(r.dob)}</td>
      <td style="text-align:center">${idadeDe(r.dob)}</td>
      <td>${esc(r.eas)}</td>
      <td style="text-align:center">${fmtD(r.data)}</td>
      <td style="text-align:center">${r.peso!=null?esc(String(r.peso)):'—'}</td>
      <td style="text-align:center">${r.altura!=null?esc(String(r.altura)):'—'}</td>
      <td style="text-align:center">${r.imc!=null?esc(String(r.imc)):'—'}</td>
      <td style="text-align:center">${vac(r.vacina)}</td>
      <td style="text-align:center">${r.gestante?'Sim':'—'}</td>
      <td style="text-align:center">${preN(r.prenatal)}</td>
      <td style="text-align:center">${triaTxt(r.tria_risco)}</td>
      <td>${r.obs?esc(String(r.obs)):'—'}</td>
    </tr>`;

  // Corpo: agrupado por EAS quando o admin pede "Todas"
  let corpo = '';
  if (!easFiltro) {
    const grupos = new Map();
    linhas.forEach(r => { if(!grupos.has(r.eas)) grupos.set(r.eas, []); grupos.get(r.eas).push(r); });
    [...grupos.keys()].sort((a,b)=>a.localeCompare(b,'pt')).forEach(k => {
      const g = grupos.get(k);
      corpo += `<div class="rpt-eas-sub">${esc(k)} — ${g.length} acompanhamento${g.length===1?'':'s'}</div>
        <table class="mapa2">${cabTab}${g.map(linhaHtml).join('')}</table>`;
    });
  } else {
    corpo = `<table class="mapa2">${cabTab}${linhas.map(linhaHtml).join('')}</table>`;
  }

  const escopo = easFiltro ? esc(easFiltro) : 'Todos os estabelecimentos';
  const hoje = new Date().toLocaleDateString('pt-BR');
  const resp  = await IDB.getMeta('sobreResponsavel') || '';
  const cargo = await IDB.getMeta('sobreCargo') || '';

  const html = `<div class="rpt">
    <style>@media print{@page{size:A4 landscape}}</style>
    ${await _reportHeader('Relatório de Acompanhamentos Realizados',
        `Estabelecimento: <strong>${escopo}</strong> · Emitido em ${hoje} · Responsável pela emissão: ${esc(ME.nome||'—')}`)}
    <div class="rpt-selo">Dados já preenchidos</div>
    <div class="rpt-selo-nota">As linhas marcadas com ✓ correspondem a acompanhamentos já realizados e registrados no sistema.</div>

    <div class="rpt-kpis">
      <div class="rpt-kpi"><div class="k-num">${linhas.length}</div><div class="k-lbl">Total de acompanhamentos</div></div>
      <div class="rpt-kpi"><div class="k-num">${new Set(linhas.map(r=>r.cod_fam).filter(Boolean)).size}</div><div class="k-lbl">Famílias atendidas</div></div>
      <div class="rpt-kpi"><div class="k-num">${linhas.filter(r=>r.vacina===true).length}</div><div class="k-lbl">Vacinação em dia</div></div>
    </div>

    <h2>Beneficiários acompanhados</h2>
    ${corpo}

    <div class="rpt-sign">
      <div class="sign-line"></div>
      <div class="sign-name">${esc(resp || ME.nome || '')}</div>
      <div class="sign-role">${esc(cargo || 'Responsável')}</div>
    </div>
    <div class="rpt-foot">Gerado pelo sistema Bolsa Família v3 PRO · Device: ${DEVICE_ID.substring(0,8)}</div>
  </div>`;

  $('#printArea').innerHTML = html;
  window.print();
  showToast('✓ Relatório enviado para impressão', 'ok');
}

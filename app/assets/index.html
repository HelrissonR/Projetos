:root{--bg:#ffffff;--panel:#ffffff;--panel-2:#f2f3f6;--text:#1a1d24;--muted:#6b7280;--border:#e6e8ee;--accent:#16181d;--accent-hi:#000000;--accent-soft:#f2f3f5;--accent-text:#ffffff;--accent-2:#16181d;--accent-2-soft:#f2f3f5;--brand-blue:#1351b4;--accent-rgb:22,24,29;--ok:#16a34a;--ok-soft:#f0fdf4;--warn:#d97706;--warn-soft:#fffbeb;--err:#dc2626;--err-soft:#fef2f2;--r:10px;--r-lg:16px;--shadow-sm:0 1px 3px rgba(20,40,28,.06),0 1px 2px rgba(20,40,28,.04);--shadow-md:0 4px 12px rgba(20,40,28,.08),0 2px 4px rgba(20,40,28,.04);--shadow-lg:0 8px 24px rgba(20,40,28,.1),0 4px 8px rgba(20,40,28,.04)}
[data-theme="dark"]{--bg:#0e0f12;--panel:#17191e;--panel-2:#212430;--text:#f0f1f5;--muted:#9aa0ac;--border:#2c2f38;--accent:#f0f1f5;--accent-hi:#ffffff;--accent-soft:#20232b;--accent-text:#0e0f12;--accent-2:#f0f1f5;--accent-2-soft:#20232b;--brand-blue:#5b8def;--accent-rgb:240,241,245;--ok:#30d158;--ok-soft:#0d3320;--warn:#ff9f0a;--warn-soft:#3d2100;--err:#ff453a;--err-soft:#3d0c00;--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family,system-ui,-apple-system,sans-serif);font-size:var(--font-size-base,15px);line-height:1.5;color:var(--text);background:var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:100px}
header.top{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:13px 18px 12px;display:flex;align-items:center;gap:12px}
/* Contraste dos elementos do cabeçalho sobre o gradiente amarelo */
header.top h1{color:#191d24}
header.top .btn-icon{color:#191d24}
header.top .btn-icon:hover{background:rgba(0,0,0,.10);color:#000}
header.top .ss{background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
[data-theme="dark"] header.top h1,[data-theme="dark"] header.top .btn-icon{color:var(--text)}
/* Fundo em gradiente (igual ao login) nas demais telas do app */
#pageApp.active{background:linear-gradient(180deg,var(--accent-soft) 0%,var(--bg) 32%,var(--bg) 100%);background-attachment:fixed;min-height:100vh}
/* ── Camada de transição de cor na rolagem ── */
#scrollTint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;background:linear-gradient(160deg,rgba(var(--accent-rgb),.10) 0%,transparent 45%,rgba(var(--accent-rgb),.08) 100%);filter:hue-rotate(calc(var(--sc,0) * 60deg));transition:filter .3s linear;mix-blend-mode:normal}
[data-theme="dark"] #scrollTint{opacity:.7}
body:has(#pageLogin.active) #scrollTint{display:none}
.app{position:relative;z-index:1}
.top h1{font-size:15px;font-weight:600;flex:1}
.top .vig{font-size:11px;font-weight:500;padding:4px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.top .vig.w{background:var(--warn-soft);color:var(--warn)}
.top .vig.e{background:var(--err-soft);color:var(--err)}
.top .right{display:flex;gap:4px;align-items:center}
main{padding:20px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:transparent;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
nav.bottom .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid color-mix(in srgb,var(--border) 80%,transparent);border-radius:22px;padding:3px 6px;box-shadow:var(--shadow-md)}
nav.bottom button{padding:7px 4px;color:var(--muted);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px;position:relative;transition:color .15s,background .15s}
nav.bottom button:active{background:var(--panel-2);transform:scale(.94);transition:transform .08s}
nav.bottom button[aria-current="page"]{color:var(--text);font-weight:700}
nav.bottom button[aria-current="page"]::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav.bottom svg{width:22px;height:22px}
h2{font-size:22px;font-weight:600;margin-bottom:4px}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;box-shadow:var(--shadow-sm)}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}.card+.card{margin-top:12px}
.card:active{transform:scale(.985);transition:transform .08s,box-shadow .08s}
.card-sub{background:var(--panel-2);border:1px solid transparent;cursor:default;box-shadow:none}.card-sub:hover{border-color:transparent;box-shadow:none}
.nh{cursor:default}.nh:hover{border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:500;border:1px solid transparent;transition:background .15s,box-shadow .15s,transform .1s}
.btn:active{transform:scale(.96);transition:transform .08s}
.btn-p{background:var(--accent);color:var(--accent-text);font-weight:700;box-shadow:0 2px 8px rgba(var(--accent-rgb),.3)}.btn-p:hover{background:var(--accent-hi);box-shadow:0 4px 12px rgba(var(--accent-rgb),.4)}
.btn-g{color:var(--text);border-color:var(--border);background:var(--panel);box-shadow:var(--shadow-sm)}.btn-g:hover{background:var(--panel-2);box-shadow:var(--shadow-md)}
.btn-b{width:100%}.btn-s{padding:6px 10px;font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
input[type="text"],input[type="password"],input[type="url"],input[type="email"],input[type="date"],input[type="number"],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.2),0 1px 4px rgba(0,0,0,.04)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:420px){.g2{grid-template-columns:1fr}}
.s3>*+*{margin-top:var(--gap-3,16px)}.s4>*+*{margin-top:var(--gap-4,20px)}
.flex{display:flex}.aic{align-items:center}.jcb{justify-content:space-between}
#toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 40px);background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;white-space:pre-line}
#toast.show{opacity:1}#toast.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
#toast.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
#toast.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.page{display:none}.page.active{display:block}
/* ── Login — nova tela moderna ── */
/* IMPORTANT: display is controlled solely by .page / .page.active — do NOT set display here */
#pageLogin.active{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,var(--accent-soft) 0%,var(--bg) 42%,var(--bg) 100%)}
#pageLogin.active.has-bg{background-size:cover;background-position:center;background-repeat:no-repeat}
body:has(#pageLogin.active) header.top,
body:has(#pageLogin.active) nav.bottom{display:none!important}
.lcard-page{width:100%;max-width:400px;display:flex;flex-direction:column}

/* ── Hero zone (base branca + detalhe Bolsa Família) ── */
.lcard-hero{background:radial-gradient(130% 100% at 50% -20%,var(--accent-soft) 0%,var(--panel) 62%);padding:46px 24px 72px;position:relative;overflow:hidden;text-align:center;border-radius:24px 24px 0 0;border:none}
[data-theme="dark"] .lcard-hero{background:radial-gradient(130% 100% at 50% -20%,var(--accent-soft) 0%,var(--panel) 62%)}
.lhero-blob{display:none}/* círculos decorativos desativados; use imagem própria atrás da logo */
.lhero-blob-1{width:240px;height:240px;background:color-mix(in srgb,var(--accent) 9%,transparent);bottom:-90px;right:-60px}
.lhero-blob-2{width:160px;height:160px;background:color-mix(in srgb,var(--accent-2) 10%,transparent);top:-55px;left:-40px}
.lhero-blob-3{width:72px;height:72px;background:color-mix(in srgb,var(--accent) 12%,transparent);top:30px;right:36px}
[data-theme="dark"] .lhero-blob{opacity:.5}

/* ── Logo no hero ── */
.lcard-logo-wrap{display:flex;justify-content:center;margin-bottom:16px;position:relative;z-index:2}
.lcard-logo-ring{width:104px;height:104px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:transparent;border:none;box-shadow:none}
[data-theme="dark"] .lcard-logo-ring{background:transparent;border:none}
.lcard-logo-ring img,.lcard-logo-ring svg{width:92px;height:92px;object-fit:contain}
/* Imagem própria atrás da logo (tela de login) */
.lcard-hero.has-hero-bg{background-size:cover;background-position:center;background-repeat:no-repeat}
.lcard-hero.has-hero-bg .lcard-sub{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.lcard-sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.55;padding:0 20px;margin:0;position:relative;z-index:2}
[data-theme="dark"] .lcard-sub{color:var(--muted)}

/* ── Form card sobrepõe o hero ── */
.lcard{background:var(--panel);border-radius:24px 24px 20px 20px;overflow:visible;box-shadow:0 -4px 20px rgba(0,0,0,.07),var(--shadow-lg);border:1px solid var(--border);margin-top:-28px;position:relative;z-index:3;padding:28px 22px 20px}
[data-theme="dark"] .lcard{background:var(--panel)}

/* Ocultar elementos do layout antigo */
.lcard-top,.lcard-wave,.lcard-deco,.lcard-deco2,.lcard-form{display:none!important}

/* ── Título e campos ── */
.lcard-title{text-align:left;font-size:22px;font-weight:800;margin-bottom:22px;letter-spacing:-.02em;color:var(--text)}
.lfield-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.lfield{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:14px;background:var(--panel-2);transition:border-color .15s,box-shadow .15s,background .15s;overflow:hidden}
.lfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18);background:var(--panel)}
.lfield-icon{width:46px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;pointer-events:none}
.lfield-input{flex:1;border:none;background:transparent;padding:14px 8px 14px 0;font-size:15px;color:var(--text);min-width:0}
.lfield-input:focus{outline:none;box-shadow:none;border:none}
.lfield-input::placeholder{color:var(--muted)}
.lfield-reveal{width:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:none;cursor:pointer;flex-shrink:0;transition:color .15s;padding:0;align-self:stretch}
.lfield-reveal:hover{color:var(--text)}

/* ── Botão entrar ── */
.lcard-btn{border-radius:14px!important;font-size:15px;font-weight:700;padding:14px 16px!important;letter-spacing:.01em;display:flex!important;align-items:center;justify-content:center;gap:8px}
.lcard-btn:active{transform:scale(.97)!important}

/* ── Erro de login visível ── */
.lerr-msg{display:none;background:var(--err-soft);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 30%,transparent);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;margin-top:12px;text-align:center;line-height:1.4}
.lerr-msg.show{display:block}
.lerr-reset{margin-top:8px;display:inline-block;font-size:12px;font-weight:700;color:var(--err);cursor:pointer;text-decoration:underline}

/* ── Trust badges ── */
.lcard-trust{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.ltrust-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:500}
.ltrust-dot{width:3px;height:3px;border-radius:50%;background:var(--border);flex-shrink:0}

/* ── Selo do desenvolvedor ── */
.lcard-dev{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.lcard-dev .ldev-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;background:var(--accent);color:var(--accent-text);font-size:9px;font-weight:800;letter-spacing:.01em;flex-shrink:0}

/* ══ LOGIN — animações modernas ══════════════════════ */
@keyframes lFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes lPop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes lFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6px,-14px) scale(1.06)}}
@keyframes lHalo{0%{box-shadow:0 8px 32px rgba(0,0,0,.15),0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 8px 32px rgba(0,0,0,.15),0 0 0 20px rgba(255,255,255,0)}}
@keyframes lGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes lShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
@keyframes lSpin{to{transform:rotate(360deg)}}
@keyframes lShine{from{left:-60%}to{left:130%}}

/* Hero: fundo estático e limpo (design simplificado) */
/* Logo: entrada suave com pop (sem halo pulsante) */
.lcard-logo-ring{animation:lPop .5s cubic-bezier(.34,1.45,.64,1) both}
.lcard-sub{opacity:0;animation:lFadeUp .55s cubic-bezier(.22,1,.36,1) .25s forwards}
/* Card e conteúdo: entrada escalonada */
.lcard{animation:lFadeUp .55s cubic-bezier(.22,1,.36,1) .12s both}
.lcard>*{opacity:0;animation:lFadeUp .5s cubic-bezier(.22,1,.36,1) forwards}
.lcard>*:nth-child(1){animation-delay:.28s}
.lcard>*:nth-child(2){animation-delay:.38s}
.lcard>*:nth-child(3){animation-delay:.46s}
.lcard>*:nth-child(4){animation-delay:.54s}
.lcard>*:nth-child(5){animation-delay:.62s}
.lcard>*:nth-child(6){animation-delay:.70s}
.lcard>*:nth-child(n+7){animation-delay:.78s}
/* Campos: micro-interação no foco */
.lfield{transition:border-color .15s,box-shadow .15s,background .15s,transform .15s}
.lfield:focus-within{transform:translateY(-1px)}
.lfield-icon{transition:color .2s,transform .2s}
.lfield:focus-within .lfield-icon{color:var(--accent-hi);transform:scale(1.15)}
/* Botão: estado carregando (brilho removido — design simplificado) */
.lcard-btn{position:relative;overflow:hidden}
.lcard-btn.loading{pointer-events:none;opacity:.85}
.lspin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.2);border-top-color:rgba(0,0,0,.75);border-radius:50%;display:inline-block;animation:lSpin .7s linear infinite;flex-shrink:0}
/* Erro: card treme */
.lcard.shake{animation:lShake .5s cubic-bezier(.36,.07,.19,.97)}
/* Acessibilidade: sem animação quando o usuário pedir */
@media (prefers-reduced-motion:reduce){
  .lcard,.lcard>*,.lcard-sub,.lcard-hero,.lcard-logo-ring,.lhero-blob-1,.lhero-blob-2,.lhero-blob-3,.lcard-btn::after{animation:none!important;opacity:1!important}
}
body.anim-none .lcard>*,body.anim-none .lcard-sub{opacity:1!important}

/* ══ PÁGINAS — entrada escalonada dos cards ══════════ */
@keyframes pFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#mc.enter>div>*{opacity:0;animation:pFadeUp .42s cubic-bezier(.22,1,.36,1) forwards}
#mc.enter>div>*:nth-child(1){animation-delay:.02s}
#mc.enter>div>*:nth-child(2){animation-delay:.07s}
#mc.enter>div>*:nth-child(3){animation-delay:.12s}
#mc.enter>div>*:nth-child(4){animation-delay:.17s}
#mc.enter>div>*:nth-child(5){animation-delay:.22s}
#mc.enter>div>*:nth-child(6){animation-delay:.27s}
#mc.enter>div>*:nth-child(7){animation-delay:.32s}
#mc.enter>div>*:nth-child(8){animation-delay:.37s}
#mc.enter>div>*:nth-child(n+9){animation-delay:.42s}
@media (prefers-reduced-motion:reduce){#mc.enter>div>*{animation:none!important;opacity:1!important}}
body.anim-none #mc.enter>div>*{opacity:1!important}

/* ── Blocos de instituições ── */
.lcard-blocks{padding:14px 0 4px;border-top:1px solid var(--border);margin-top:12px}
.lcard-blocks-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.lcard-blocks-row .lblock-img{flex-shrink:0}
.lcard-blocks-col{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.lblock-img{display:flex;align-items:center;justify-content:center;overflow:hidden;border:none;background:transparent}
.lblock-img img{width:100%;height:100%;object-fit:contain}
.lblock-text{text-align:center;max-width:180px}
.lcard-blocks-col .lblock-text{max-width:100%;width:100%}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.tag-ok{background:var(--ok-soft);color:var(--ok)}.tag-i{background:var(--accent-soft);color:var(--accent-hi)}.tag-w{background:var(--warn-soft);color:var(--warn)}
.fb{display:inline-flex;padding:4px 8px;background:var(--accent-soft);border-radius:var(--r);font-size:11px;font-weight:600}
#sheet{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;max-height:88vh;overflow-y:auto;z-index:101;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,0,.15,1);box-shadow:0 -4px 32px rgba(0,0,0,.12)}
#sheet.show{transform:translateY(0)}
#sheetOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none}
#sheetOverlay.show{opacity:1;pointer-events:all}
#sheetH{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#sheetT{font-size:17px;font-weight:600}#sheetB{padding:20px}
.ss{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 8px;border-radius:999px;background:var(--panel-2)}
.ss.on{color:var(--ok)}.ss.sync{color:var(--accent)}.ss.off{color:var(--err)}
.ss .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ss.sync .dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.pend{position:relative}.pend::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--warn);border-radius:50%;border:2px solid var(--panel)}
.cbf{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer}
.cbf:hover{background:var(--panel-2)}
.cbf input[type="checkbox"],.cbf input[type="radio"]{width:20px;height:20px;cursor:pointer}
.color-input{display:flex;gap:8px;align-items:center}
.color-input input[type="color"]{width:60px;height:40px;border:none;border-radius:var(--r);cursor:pointer}
.ur{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--panel-2);border-radius:var(--r);margin-bottom:8px}
.lp{width:80px;height:80px;margin:0 auto;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lp img{width:100%;height:100%;object-fit:contain}
.fi{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0}
.btn .fi,.btn svg{margin-right:5px}
.btn-icon{padding:8px;border-radius:var(--r);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.btn-icon:hover{background:var(--panel-2);color:var(--text)}
.nav-icon{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;color:var(--muted);font-size:11px;font-weight:500;border-radius:18px;position:relative;transition:color .15s,background .15s}
.nav-icon:active{background:var(--panel-2);transform:scale(.94);transition:transform .08s}
.nav-icon[aria-current="page"]{color:var(--text);font-weight:700}
.nav-icon[aria-current="page"]::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
#sheet::before{content:'';display:block;width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 4px;flex-shrink:0}

@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--border) 50%,var(--panel-2) 75%);background-size:1200px 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r)}
.skel-h{height:18px;width:55%;margin-bottom:10px}
.skel-t{height:13px;width:80%;margin-bottom:6px}
.skel-t2{height:13px;width:50%}
.skel-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
#toast{display:flex;align-items:flex-start;gap:10px}
#toast .t-icon{flex-shrink:0;line-height:1.4}
#toast .t-msg{flex:1;white-space:pre-line}
.search-wrap{position:relative}
.search-wrap input{padding-left:40px!important}
.search-wrap .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex;align-items:center}
.form-sep{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;margin-top:4px}
.cfg-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px}
.cfg-card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--panel-2)}
.cfg-card-body{padding:16px}
.cfg-card-body .s3>*+*{margin-top:14px}
[data-theme="dark"] .tag-i{background:var(--accent-soft);color:var(--accent)}
[data-theme="dark"] .fb{background:var(--accent-soft);color:var(--accent)}
.alert-action{cursor:pointer;transition:box-shadow .15s,transform .12s}
.alert-action:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.alert-action:active{transform:scale(.985);transition:transform .08s}
.empty-state{text-align:center;padding:44px 24px;color:var(--muted)}
.empty-state .ei{font-size:48px;line-height:1;margin-bottom:14px;opacity:.35}
.empty-state strong{display:block;font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:14px;line-height:1.6}
.empty-state .btn{margin-top:16px}
.res-card-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.res-card-meta{margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-card-meta span{font-size:12px;color:var(--muted)}
.res-card-meta .dot{width:3px;height:3px;background:var(--border);border-radius:50%;display:inline-block}

/* ── Matriz de permissões ── */
.perm-matrix{width:100%;border-collapse:collapse;font-size:13px}
.perm-matrix th,.perm-matrix td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.perm-matrix th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel-2)}
.perm-matrix th.col,.perm-matrix td.col{text-align:center;width:90px}
.perm-matrix tr.group td{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--panel-2);padding-top:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.perm-matrix input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.perm-matrix-wrap{overflow-x:auto;margin:-4px}
.perm-matrix-wrap > table{margin:4px}

/* ── Banner informativo ── */
.home-banner{border-radius:var(--r-lg);border:1px solid transparent;position:relative;overflow:hidden;margin-left:-14px;margin-right:-14px}
.home-banner.type-info{background:var(--accent-soft);border-color:var(--accent)}
.home-banner.type-warn{background:var(--warn-soft);border-color:var(--warn)}
.home-banner.type-ok{background:var(--ok-soft);border-color:var(--ok)}
.home-banner.type-err{background:var(--err-soft);border-color:var(--err)}
.home-banner-inner{padding:14px 16px}
.home-banner-title{font-size:13px;font-weight:700;margin-bottom:3px}
.home-banner.type-info .home-banner-title{color:var(--accent-hi)}
.home-banner.type-warn .home-banner-title{color:var(--warn)}
.home-banner.type-ok   .home-banner-title{color:var(--ok)}
.home-banner.type-err  .home-banner-title{color:var(--err)}
.home-banner-body{font-size:13px;line-height:1.55;white-space:pre-wrap}
.home-banner-edit{position:absolute;top:8px;right:8px;opacity:.6;z-index:3;background:rgba(255,255,255,.7)!important}
[data-theme="dark"] .home-banner-edit{background:rgba(0,0,0,.5)!important}
.home-banner-edit:hover{opacity:1}
/* Slides */
.home-banner-slides{position:relative;width:100%;aspect-ratio:3/1;background:var(--panel-2);overflow:hidden}
.home-banner-slides .bs{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .6s ease}
.home-banner-slides .bs.active{opacity:1}
.home-banner-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.home-banner-dots .d{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.15);cursor:pointer;transition:all .2s}
.home-banner-dots .d.active{background:#fff;transform:scale(1.2)}
/* Lista de imagens no editor */
.bimg-list{display:flex;flex-direction:column;gap:6px}
.bimg-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r)}
.bimg-item img{width:56px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0;border:1px solid var(--border)}
.bimg-item-info{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.bimg-item button{flex-shrink:0}

/* ── Moodboard dashboard (home) ── */
.mb-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mb-hero-num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.mb-tria-bar{height:10px;border-radius:999px;display:flex;gap:2px;overflow:hidden;background:var(--border);margin-bottom:12px}
.mb-tria-bar .tseg{border-radius:999px;height:100%}
/* Wizard do acompanhamento */
.wiz-bar{display:flex;gap:5px}
.wiz-seg{flex:1;height:5px;border-radius:999px;background:var(--border);transition:background .3s}
.wiz-seg.active{background:var(--accent)}
/* Progresso da família (modo mutirão) */
.fam-prog{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--panel-2)}
.fam-prog-bar{height:7px;border-radius:999px;background:var(--border);overflow:hidden}
.fam-prog-bar>div{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
/* Anel de cobertura da vigência (Home) */
.cov-hero{display:flex;align-items:center;gap:18px;padding:16px}
.cov-ring{position:relative;flex-shrink:0}
.cov-ring svg{display:block;transform:rotate(-90deg)}
.cov-ring .cov-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;line-height:1}
.cov-ring .cov-pct small{font-size:9px;font-weight:600;color:var(--muted);margin-top:2px;letter-spacing:.04em}
/* Banner de sync pendente */
.sync-pend{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);cursor:pointer;font-size:13px;font-weight:600}
/* Chips de buscas recentes */
.recent-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.recent-chips button{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.recent-chips button:active{transform:scale(.96)}
/* Botão modo offline no topo */
.btn-offline{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--panel);color:var(--text);transition:all .2s;white-space:nowrap}
.btn-offline.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn-offline:active{transform:scale(.96)}
/* Botão de voz na busca */
.mic-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:50%;display:flex}
.mic-btn.rec{color:var(--err);animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{opacity:1}50%{opacity:.4}}
.mb-feed{display:flex;flex-direction:column}
.mb-feed-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);transition:background .12s}
.mb-feed-item:last-child{border-bottom:none;padding-bottom:0}
.mb-avatar{width:32px;height:32px;border-radius:50%;background:hsl(var(--av-h,48) 70% 88%);color:hsl(var(--av-h,48) 55% 30%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
[data-theme="dark"] .mb-avatar{background:hsl(var(--av-h,48) 40% 24%);color:hsl(var(--av-h,48) 75% 75%)}
.mb-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb-quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;text-align:center;box-shadow:var(--shadow-sm)}
.mb-quick-btn:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-md)}
.mb-quick-btn:active{transform:scale(.94);transition:transform .08s}
.mb-quick-icon{width:38px;height:38px;border-radius:var(--r);background:var(--panel-2);display:flex;align-items:center;justify-content:center}
.mb-quick-label{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.mb-cov-bar{height:6px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--border);margin-top:6px}
.mb-cov-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,var(--accent)))}
/* ── Métricas principais compactas ── */
.mb-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.mb-stat-grid{grid-template-columns:repeat(2,1fr)}}
.mb-stat{padding:11px 10px;text-align:center;border:1px solid var(--border);background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.mb-stat-num{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.5px}
.mb-stat-lbl{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.15}
.mb-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb-kpi{padding:14px 10px;text-align:center;border:1px solid var(--border);background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .1s}
.mb-kpi[onclick]:hover{box-shadow:var(--shadow-md)}
.mb-kpi[onclick]:active{transform:scale(.96);transition:transform .08s}
.mb-kpi-num{font-size:26px;font-weight:800;line-height:1;letter-spacing:-0.5px}
.mb-kpi-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;line-height:1.2}

/* ── Rodapé personalizado ── */
#appFooter{display:none}
#appFooter.show{display:block}
.footer-block-img{max-width:100%;height:auto;display:block}
.fblock-row{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.fblock-row:last-child{margin-bottom:0}

/* ══ FILTROS ACOMPANHAMENTOS ══════════════════════════ */
.af-bar{display:flex;align-items:center;gap:8px}
.af-bar input{flex:1;min-width:0}
.af-btn{position:relative;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border:1px solid var(--border);background:var(--panel);border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text)}
.af-btn:hover{border-color:var(--accent)}
.af-btn.has-filter{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-hi)}
.af-badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px}
.af-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:none;flex-direction:column;gap:14px;margin-top:0}
.af-panel.open{display:flex}
.af-group-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.af-chips{display:flex;flex-wrap:wrap;gap:6px}
.afchip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;transition:all .15s;font-weight:500;line-height:1}
.afchip:hover:not(.active){border-color:var(--accent)}
.afchip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.af-date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.af-date-row input{font-size:12px;padding:6px 8px}

/* ══ PERSONALIZAÇÃO AVANÇADA ══════════════════════════ */
/* Densidade: compacto */
body.density-compact{--gap-3:10px;--gap-4:14px}
body.density-compact .card{padding:12px}
body.density-compact main{padding:14px}
body.density-compact #sheetB{padding:14px}
/* Densidade: espaçado */
body.density-comfortable{--gap-3:24px;--gap-4:28px}
body.density-comfortable .card{padding:20px}
body.density-comfortable main{padding:28px}

/* Raio dos cards: quadrado */
body.radius-square{--r:3px;--r-lg:4px}
/* Raio dos cards: arredondado (padrão = r:8 r-lg:12) */
/* Raio dos cards: pill */
body.radius-pill{--r:999px;--r-lg:20px}
body.radius-pill .card{border-radius:20px}
body.radius-pill #sheet{border-top-left-radius:28px;border-top-right-radius:28px}

/* Sombra nos cards */
body.shadow-sm .card{box-shadow:0 1px 4px rgba(0,0,0,.06)}
body.shadow-md .card{box-shadow:0 4px 16px rgba(0,0,0,.10)}
body.shadow-lg .card{box-shadow:0 8px 32px rgba(0,0,0,.14)}

/* Botões: outline */
body.btn-outline .btn-p{background:transparent;border-color:var(--accent);color:var(--accent-hi)}
body.btn-outline .btn-p:hover{background:var(--accent-soft)}
/* Botões: soft */
body.btn-soft .btn-p{background:var(--accent-soft);border-color:transparent;color:var(--accent-hi)}
body.btn-soft .btn-p:hover{background:var(--accent-soft);filter:brightness(.95)}

/* Imagem de fundo na tela de login — handled in .lcard-page block above */

/* ── Rótulos do menu de navegação ── */
body.nav-no-labels .nav-icon span,
body.nav-no-labels nav.bottom button span{display:none}
body.nav-no-labels .nav-icon,
body.nav-no-labels nav.bottom button{padding:10px 4px}

/* ── Menu compacto ── */
body.nav-compact nav.bottom{padding:3px 8px}
body.nav-compact .nav-icon,
body.nav-compact nav.bottom button{padding:5px 4px;font-size:10px}

/* ── Velocidade das animações ── */
body.anim-none *,body.anim-none *::before,body.anim-none *::after{transition:none!important;animation:none!important}
body.anim-fast *{transition-duration:.07s!important}
body.anim-slow *{transition-duration:.45s!important}

/* ── Linhas zebradas ── */
body.zebra #sR .card:nth-child(even),
body.zebra #famLista .card:nth-child(even),
body.zebra #acompLista .card:nth-child(even){background:var(--panel-2)!important}

/* ── Separadores entre itens ── */
body.list-dividers #sR .card+.card,
body.list-dividers #famLista .card+.card,
body.list-dividers #acompLista .card+.card{border-top:1px solid var(--border)}

/* ── Largura do conteúdo ── */
body.width-narrow main>.inner,body.width-narrow header>.inner,body.width-narrow nav.bottom>.inner{max-width:560px}
body.width-wide   main>.inner,body.width-wide   header>.inner,body.width-wide   nav.bottom>.inner{max-width:900px}

/* ── Fundo do app (main) ── */
#mc.has-app-bg{background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;min-height:100vh}

/* ══ PERSONALIZAÇÕES EXTRA ══════════════════════════════ */
/* Plano de fundo em gradiente suave */
body.bg-gradient{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft) 0%,var(--bg) 45%),radial-gradient(100% 80% at 0% 100%,var(--accent-2-soft) 0%,transparent 50%);background-attachment:fixed}
/* Indicador do menu como pílula preenchida */
body.navind-pill nav.bottom button[aria-current="page"]::before,
body.navind-pill .nav-icon[aria-current="page"]::before{display:none}
body.navind-pill nav.bottom button[aria-current="page"],
body.navind-pill .nav-icon[aria-current="page"]{background:var(--accent-soft);color:var(--accent-hi)}

/* ══ LAYOUT DESKTOP — barra lateral em telas largas ══════ */
@media(min-width:1000px){
  body:not(.desk-bottom) .app{
    max-width:1180px;display:grid;align-items:start;column-gap:22px;
    grid-template-columns:236px minmax(0,1fr);
    grid-template-areas:"side head" "side main" "side foot";
    grid-template-rows:auto 1fr auto;padding-bottom:24px;
  }
  body:not(.desk-bottom).width-wide   .app{max-width:1360px}
  body:not(.desk-bottom).width-narrow .app{max-width:1020px}
  body:not(.desk-bottom) header.top{grid-area:head;border-radius:0 0 16px 16px;margin-bottom:4px}
  body:not(.desk-bottom) main#mc{grid-area:main}
  body:not(.desk-bottom) #appFooter{grid-area:foot}
  body:not(.desk-bottom) nav.bottom{
    grid-area:side;position:sticky;top:0;align-self:start;height:100vh;
    left:auto;right:auto;bottom:auto;padding:18px 0;z-index:5;
    display:flex;flex-direction:column;
  }
  body:not(.desk-bottom) nav.bottom .inner{
    display:flex;flex-direction:column;grid-template-columns:none;
    gap:6px;padding:14px 10px;border-radius:18px;width:100%;
  }
  body:not(.desk-bottom) nav.bottom .inner::before{
    content:'Menu';display:block;font-size:10px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:4px 12px 8px;
  }
  body:not(.desk-bottom) nav.bottom button,
  body:not(.desk-bottom) nav.bottom .nav-icon{
    flex-direction:row;justify-content:flex-start;gap:13px;width:100%;
    padding:12px 14px;font-size:14px;border-radius:12px;font-weight:600;
  }
  body:not(.desk-bottom) nav.bottom button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-hi)}
  body:not(.desk-bottom) nav.bottom button[aria-current="page"]::before,
  body:not(.desk-bottom) nav.bottom .nav-icon[aria-current="page"]::before{display:none}
  body:not(.desk-bottom) nav.bottom svg{width:21px;height:21px}
  body:not(.desk-bottom).nav-no-labels nav.bottom button span{display:inline!important}
  /* Dashboard aproveita a largura: cards de métrica em 4 colunas */
  body:not(.desk-bottom) #mc .g2{grid-template-columns:1fr 1fr}
}

/* ══ BENTO BOX & STATUS BADGES ══════════════════════════ */
/* Bento hero cards — left accent strip */
.bento-accent-ok{border-left:3px solid var(--ok)!important;background:linear-gradient(135deg,var(--panel) 60%,color-mix(in srgb,var(--ok-soft) 40%,var(--panel)))!important}
.bento-accent-accent{border-left:3px solid var(--accent)!important;background:linear-gradient(135deg,var(--panel) 60%,color-mix(in srgb,var(--accent-soft) 40%,var(--panel)))!important}

/* Status badges for beneficiary cards */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;line-height:1.4}
.badge-gestante{background:var(--ok-soft);color:var(--ok)}
.badge-vacpend{background:var(--err-soft);color:var(--err)}
.badge-tria-r{background:var(--warn-soft);color:var(--warn)}
.badge-tria-ra{background:var(--err-soft);color:var(--err)}
.badge-tria-sr{background:var(--ok-soft);color:var(--ok)}

/* cfg-card improved */
.cfg-card{box-shadow:var(--shadow-sm)}
.cfg-card-head{background:var(--panel-2)}

/* Smoother list transitions */
#sR .card,#famLista .card,#acompLista .card{transition:border-color .15s,box-shadow .15s,transform .1s}

/* Toast visual refinement */
#toast{border-radius:var(--r-lg)!important;box-shadow:0 8px 32px rgba(0,0,0,.14)!important}

/* Overlay: softer blur-based */
#sheetOverlay{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}

/* Quick btn icon on hover */
.mb-quick-btn:hover .mb-quick-icon{background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel-2))}

/* Header title refinement */
.top h1{font-size:15px;font-weight:700;flex:1;letter-spacing:-.01em}

/* Vigência badge */
.top .vig{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}

/* h2 refinement */
h2{font-size:21px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}

/* ── Relatório (PDF / impressão) — refino preto & branco ── */
#printArea{display:none}
.rpt-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:18px}
.rpt-logo{width:56px;height:56px;object-fit:contain;flex-shrink:0}
.rpt-inst{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.12;color:#111}
.rpt-title{font-size:12px;font-weight:600;color:#333;margin-top:3px}
.rpt-meta{font-size:10.5px;color:#666;margin-top:4px;line-height:1.5}
.rpt-kpis{display:flex;flex-wrap:wrap;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:16px}
.rpt-kpi{flex:1;min-width:88px;padding:12px 14px;border-right:1px solid #eee}
.rpt-kpi:last-child{border-right:0}
.rpt-kpi .k-num{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;color:#111;font-variant-numeric:tabular-nums}
.rpt-kpi .k-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-top:6px}
.ui-confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity .18s;padding:24px}
.ui-confirm-ov.show{opacity:1}
.ui-confirm{background:var(--card,#fff);color:var(--text);border:1px solid var(--line,rgba(0,0,0,.12));border-radius:16px;max-width:340px;width:100%;padding:20px;box-shadow:0 14px 44px rgba(0,0,0,.30);transform:translateY(8px);transition:transform .18s}
.ui-confirm-ov.show .ui-confirm{transform:none}
.ui-confirm-title{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.ui-confirm-msg{font-size:13.5px;color:var(--muted,#667);line-height:1.5;margin-bottom:18px}
.ui-confirm-btns{display:flex;gap:10px}
.ui-confirm-btns .btn{flex:1}
.ui-confirm .btn-danger{background:var(--err,#c62828);color:#fff;border-color:transparent}
#printArea .rpt-selo{display:inline-block;border:1.5px solid #111;border-radius:4px;padding:3px 9px;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.10em;margin-top:6px}
#printArea .rpt-selo-nota{font-size:8.5px;color:#555;margin:4px 0 10px}
#printArea table.mapa2 th,#printArea table.mapa2 td{font-size:8.6px;padding:3px 4px}
#printArea table.mapa2 td.mk{width:12px;text-align:center;font-weight:800;border-left:2px solid #111}
#printArea table.mapa2 th.mk{width:12px;border-left:2px solid #111}
#printArea .rpt-sign{margin-top:34px;text-align:center;page-break-inside:avoid}
#printArea .rpt-sign .sign-line{width:230px;border-top:1px solid #111;margin:0 auto 5px}
#printArea .rpt-sign .sign-name{font-size:10.5px;font-weight:700}
#printArea .rpt-sign .sign-role{font-size:8.5px;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
#printArea .rpt-eas-sub{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px;border-bottom:1px solid #111;padding-bottom:2px}
@media print{
  @page{size:A4;margin:14mm}
  body>*{display:none!important}
  #printArea{display:block!important;color:#111;font-family:system-ui,-apple-system,Arial,sans-serif;font-size:11.5px;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{font-size:17px;margin:0}
  #printArea h2{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#555;margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid #ddd}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:10.5px;font-variant-numeric:tabular-nums}
  #printArea thead{display:table-header-group}
  #printArea th{background:#f4f4f4;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px;color:#333;text-align:left;padding:6px 8px;border-bottom:1.5px solid #111}
  #printArea td{padding:5px 8px;border-bottom:1px solid #e2e2e2;vertical-align:top}
  #printArea tbody tr:nth-child(even) td{background:#fafafa}
  #printArea .pg{page-break-after:always}
  #printArea .no-break{page-break-inside:avoid}
  #printArea .rpt-foot{margin-top:22px;font-size:9px;color:#888;border-top:1px solid #eee;padding-top:8px}
}

/* ── Refino: cabeçalho, fichas (sheet) e formulário ── */
header.top{padding:12px 16px}
.top .vig{font-weight:600}
#sheetT{letter-spacing:-.01em;font-weight:750}
#sheetB .card{border-radius:12px}
#sheetB .sheet-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
#wizLbl{text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:10.5px}
.wiz-seg{height:4px}
</style>
</head>

const SecureAuth = {
  // Fallback FNV-1a para contextos HTTP sem crypto.subtle (ex: rede local)
  _fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    // Expande para 32 chars combinando 4 rounds com seeds diferentes
    const rounds = [h, h ^ 0xdeadbeef, Math.imul(h, 3) >>> 0, Math.imul(h, 7) ^ 0xc0ffee];
    return rounds.map(v => v.toString(16).padStart(8, '0')).join('');
  },

  async hashPassword(password) {
    const str = password + 'bf-salt-2024';
    try {
      if (typeof crypto !== 'undefined' && crypto.subtle) {
        const encoder = new TextEncoder();
        const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(str));
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
      }
    } catch(e) { /* fallthrough */ }
    // Contexto não-seguro (HTTP em rede local): usa FNV-1a como fallback
    return 'h1:' + this._fnv(str);
  },

  async verifyPassword(password, hash) {
    const computed = await this.hashPassword(password);
    return computed === hash;
  },

  // ── Hash com salt POR USUÁRIO (usado no cache de credencial offline) ──
  _randSalt() {
    const a = new Uint8Array(16);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (let i = 0; i < 16; i++) a[i] = Math.random() * 256 | 0;
    return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  async hashSalted(password, salt) {
    const str = salt + ':' + password;
    try {
      if (typeof crypto !== 'undefined' && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return 's2:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* fallthrough */ }
    return 's1:' + this._fnv(str); // contexto sem crypto.subtle
  },
  async verifySalted(password, salt, hash) {
    if (!salt || !hash) return false;
    return (await this.hashSalted(password, salt)) === hash;
  }
};

// ── Credencial offline: salva hash salgado por usuário no registro local ──
async function _cacheOfflineCred(userId, password) {
  const users = JSON.parse(await IDB.getMeta('users') || '[]');
  const rec = users.find(x => x.id === userId);
  if (!rec) return;
  if (!rec.off_salt) rec.off_salt = SecureAuth._randSalt();
  rec.off_hash = await SecureAuth.hashSalted(password, rec.off_salt);
  delete rec.pass; // remove qualquer senha legada em texto
  await IDB.setMeta('users', JSON.stringify(users));
}
// Verifica credencial offline (novo formato salgado ou legado pass_hash)
async function _verifyOfflineCred(u, password) {
  if (u.off_salt && u.off_hash) return SecureAuth.verifySalted(password, u.off_salt, u.off_hash);
  if (u.pass_hash) return SecureAuth.verifyPassword(password, u.pass_hash); // legado
  if (u.pass) return u.pass === password; // legado antigo
  return false;
}

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

}

// ─── Reconciliação de famílias ───────────────────────────────────────────────
// Corrige a divergência "famílias > beneficiários": remove famílias ÓRFÃS
// (nenhum beneficiário aponta para elas) que sobram de re-importações/mudança
// de código familiar, e recalcula membros/total_membros a partir da fonte de
// verdade (a store de beneficiários, cuja chave é o NIS único).
// Retorna { antes, depois, removidas, benef }.
async function reconcileFamilias() {
  const benef = await IDB.getAll('beneficiarios');
  const familias = await IDB.getAll('familias');
  const antes = familias.length;

  // Agrupa beneficiários por código familiar (cod_fam === familyId da família)
  const porFam = new Map();
  for (const b of benef) {
    if (!b.cod_fam) continue;
    if (!porFam.has(b.cod_fam)) porFam.set(b.cod_fam, []);
    porFam.get(b.cod_fam).push(b);
  }

  const aRemover = [];   // familyIds órfãos
  const aAtualizar = []; // famílias com total_membros desatualizado
  for (const f of familias) {
    const membros = porFam.get(f.familyId);
    if (!membros || membros.length === 0) {
      aRemover.push(f.familyId);
    } else if ((f.membros?.length || 0) !== membros.length) {
      f.membros = membros.map(b => ({ nis: b.nis, nome: b.nome, dob: b.dob, idade: b.idade, gestante: b.gestante }));
      f.total_membros = membros.length;
      aAtualizar.push(f);
    }
  }

  // Todas as remoções/atualizações em UMA transação (rápido mesmo com milhares)
  if (aRemover.length || aAtualizar.length) {
    await new Promise((resolve, reject) => {
      const tx = IDB.db.transaction('familias', 'readwrite');
      const os = tx.objectStore('familias');
      aRemover.forEach(id => os.delete(id));
      aAtualizar.forEach(f => os.put(f));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

const RateLimit = {
  requests: [],
  maxPerMinute: 100,
  
  check() {
    const now = Date.now();
    // Remove requisições antigas (mais de 1 minuto)
    this.requests = this.requests.filter(t => t > now - 60000);
    
    if (this.requests.length >= this.maxPerMinute) {
      showToast('Muitas requisições, aguarde 1 minuto', 'warn');
      return false;
    }
    
    this.requests.push(now);

function _tempoRel(iso){
  if(!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return 'agora';
  if(s < 3600) return 'há '+Math.floor(s/60)+' min';
  if(s < 86400) return 'há '+Math.floor(s/3600)+' h';
  const d = Math.floor(s/86400);
  if(d === 1) return 'ontem';
  if(d < 30) return 'há '+d+' dias';
  return new Date(iso).toLocaleDateString('pt-BR');

  // UPSERT para Supabase (sem DELETE) - Com auto-correção de colunas
  async upsertBatch(table, rows, conflictCol) {
    if (!SB || !rows.length) return { count: 0, error: null };
    const BATCH = 500;
    let total = 0;
    
    for (let i = 0; i < rows.length; i += BATCH) {
      let chunk = rows.slice(i, i + BATCH);
      let attempt = 0;
      let maxAttempts = 5;
      
      while (attempt < maxAttempts) {
        const { error } = await SB.from(table).upsert(chunk, {
          onConflict: conflictCol,
          ignoreDuplicates: false
        });
        
        if (!error) {
          total += chunk.length;
          break;
        }
        
        // Auto-correção: detectar coluna inexistente e remover
        const colMatch = error.message.match(/Could not find the '(\w+)' column/i);
        if (colMatch && attempt < maxAttempts - 1) {
          const badCol = colMatch[1];
          console.warn(`⚠️ Coluna '${badCol}' não existe em '${table}'. Removendo e tentando novamente...`);
          chunk = chunk.map(row => {
            const newRow = {...row};
            delete newRow[badCol];
            return newRow;
          });
          attempt++;
          continue;
        }

        // Chave duplicada: o UPSERT já mantém o registro atualizado — não é erro real
        if (error.code === '23505' || /duplicate key|already exists/i.test(error.message || '')) {
          console.warn(`⚠️ Duplicada ignorada em '${table}' (upsert mantém atualizado):`, error.message);
          total += chunk.length;
          break;
        }

        // Outros erros: retornar
        return { count: total, error };
      }
    }
    return { count: total, error: null };
  },

  // Busca TODAS as linhas de uma tabela em páginas (Supabase limita ~1000 por consulta)
  async fetchAllPaged(table, lastDown) {
    const PAGE = 1000;
    let from = 0, all = [];
    while (true) {
      const { data, error } = await SB.from(table)
        .select('*').gt('updated_at', lastDown)
        .order('updated_at', { ascending: true })
        .range(from, from + PAGE - 1);
      if (error) throw new Error(`${table}: ${error.message}`);
      if (!data || data.length === 0) break;
      all = all.concat(data);
      if (data.length < PAGE) break;
      from += PAGE;
    }
    return all;
  },

    if (!RateLimit.check()) return;
    this.setStatus('sync', 'Baixando...');

    const lastDown = await IDB.getMeta('lastDownload') || '1970-01-01T00:00:00Z';
    const maxTs = (rows) => rows.reduce((m, r) => (r.updated_at && r.updated_at > m) ? r.updated_at : m, lastDown);

    try {
      // Configurações administrativas primeiro (vigência, usuários, permissões…)
      await this.downloadSettings();

      // 1. Beneficiários (paginado + gravação em lote)
      const newBen = await this.fetchAllPaged('beneficiarios', lastDown);
      if (newBen.length) {
        const now = new Date().toISOString();
        await IDB.putAll('beneficiarios', newBen.map(b => ({
          nis: b.nis, cns: b.cns, nome: b.nome, dob: b.dob,
          idade: b.idade, endereco: b.endereco, bairro: b.bairro,
          cod_fam: b.cod_fam, tel: b.tel, cpf: b.cpf, eas: b.eas,
          gestante: b.gestante, cadastro_avulso: b.cadastro_avulso,
          updated_at: b.updated_at, synced_at: now
        })));
        invalidateBenefCache();
        await this.logSync('download', 'beneficiarios', newBen.length, 'ok');
      }

      // 2. Famílias (paginado). Membros calculados com UM mapa (evita O(n²))
      const newFam = await this.fetchAllPaged('familias', lastDown);
      if (newFam.length) {
        const allBen = await IDB.getAll('beneficiarios');
        const porCod = new Map();
        for (const b of allBen) {
          if (!b.cod_fam) continue;
          if (!porCod.has(b.cod_fam)) porCod.set(b.cod_fam, []);
          porCod.get(b.cod_fam).push(b);
        }
        const now = new Date().toISOString();
        await IDB.putAll('familias', newFam.map(f => {
          const membros = (porCod.get(f.family_id) || porCod.get('FAM_' + f.cod_familiar) || []);
          return {
            familyId: f.family_id, cod_familiar: f.cod_familiar,
            endereco: f.endereco, bairro: f.bairro, cep: f.cep,
            zona: f.zona, telefone: f.telefone, eas: f.eas,
            total_membros: membros.length || f.total_membros,
            membros, updated_at: f.updated_at, synced_at: now
          };
        }));
        await this.logSync('download', 'familias', newFam.length, 'ok');
      }

      // 3. Acompanhamentos (paginado)
      const newAcomp = await this.fetchAllPaged('acompanhamentos', lastDown);
      if (newAcomp.length) {
        const now = new Date().toISOString();
        // Soft-delete: linhas com deleted_at são removidas localmente; as demais, gravadas
        const ativos   = newAcomp.filter(a => !a.deleted_at);
        const excluidos = newAcomp.filter(a => a.deleted_at);
        if (ativos.length) await IDB.putAll('acompanhamentos', ativos.map(a => ({ ...a, synced_at: now })));
        for (const a of excluidos) { try { await IDB.delete('acompanhamentos', a.id); } catch(e){} }
        invalidateAcompCache();
        await this.logSync('download', 'acompanhamentos', newAcomp.length, 'ok');
      }

      // Avança o marcador pela MAIOR data recebida (mais seguro que "agora")
      const novoMarcador = [maxTs(newBen), maxTs(newFam), maxTs(newAcomp)]
        .reduce((m, t) => t > m ? t : m, lastDown);
      await IDB.setMeta('lastDownload', novoMarcador);

      const total = newBen.length + newFam.length + newAcomp.length;
      this.setStatus('on', 'Sincronizado');
      // Atualização SUAVE: não recarrega a página inteira (evita "piscar" durante o uso).
      // Só atualiza o painel do admin na Home; as demais telas pegam os dados novos
      // na próxima navegação (os caches já foram invalidados acima).
      // Só re-renderiza se o usuário estiver na HOME (dashboard). Nas telas de
      // trabalho (Busca/Agrupamentos/Registros) nunca interrompe quem está usando.
      if (total > 0) {
        // Após baixar dados novos, remove famílias órfãs antes de atualizar o painel
        try { if (newFam.length || newBen.length) await reconcileFamilias(); } catch(e){ console.warn('reconcile:', e); }
        _scheduleHomeRefresh();
      }

    } catch (err) {
      console.error('❌ Download error:', err);
      this.setStatus('off', 'Offline');
      await this.logSync('download', 'all', 0, 'error', err.message).catch(()=>{});
      // Silencioso: sem internet é estado normal em campo, não mostra alerta vermelho.
    }
  },

  // Full sync
  async fullSync() {
    if (!SB || MANUAL_OFF) return;
    if (!navigator.onLine) { this.setStatus('off', 'Offline'); return; } // sem internet: não tenta (evita erros)
    await this.uploadSettings();
    await this.upload();
    await this.download();
  },

  // Log real no Supabase
  async logSync(action, table, count, status, details) {
    try {
      if (SB) {
        await SB.from('sync_log').insert({
          device_id: DEVICE_ID,
          usuario_id: ME?.id || null,
          action, tabela: table,
          records_affected: count,
          status,
          details: details ? { message: details } : null
        });
      }
    } catch (e) { console.warn('Log sync error:', e); }
  },

  // Realtime subscriptions
  startRealtime() {
    if (!SB || MANUAL_OFF) return;
    try {
      RT_SUB = SB.channel('db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'beneficiarios' }, () => {
          console.log('🔔 Realtime: beneficiarios changed');
          this.download();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'acompanhamentos' }, () => {
          console.log('🔔 Realtime: acompanhamentos changed');
          this.download();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'familias' }, () => {
          console.log('🔔 Realtime: familias changed');
          this.download();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'presence' }, () => {
          _refreshAdminHome(); // alguém entrou/saiu → atualiza painel do admin
        })
        .subscribe((status) => {
          console.log('📡 Realtime status:', status);
          if (status === 'SUBSCRIBED') this.setStatus('on', 'Tempo real');
        });
    } catch (e) { console.warn('Realtime error:', e); }
  },

  stopRealtime() {
    if (RT_SUB) { SB?.removeChannel(RT_SUB); RT_SUB = null; }
    if (SYNC_TID) { clearInterval(SYNC_TID); SYNC_TID = null; }
  },

  // Polling fallback
  startPolling(ms = 30000) {
    this.stopRealtime();
    SYNC_TID = setInterval(() => this.fullSync(), ms);
    console.log(`🔄 Polling: ${ms}ms`);
  }
};

// PRESENÇA — quem está online (heartbeat) + keep-alive do Supabase
// ═══════════════════════════════════════════════════════
const Presence = {
  tid: null,
  async beat() {
    if (!SB || !ME || MANUAL_OFF) return;
    try {
      await SB.from('presence').upsert({
        device_id: DEVICE_ID,
        user_name: ME.nome,
        usuario: ME.user,
        role: ME.role,
        estabelecimento: (await IDB.getMeta('instituicao')) || '',
        last_seen: new Date().toISOString()
      }, { onConflict: 'device_id' });
    } catch (e) { /* tabela presence pode não existir ainda */ }
  },
  start() {
    if (!SB || !ME) return;
    this.beat();                       // bate já no login (também serve de keep-alive)
    if (this.tid) clearInterval(this.tid);
    this.tid = setInterval(() => this.beat(), 45000); // a cada 45s
  },
  stop() {
    if (this.tid) { clearInterval(this.tid); this.tid = null; }
    if (SB) { try { SB.from('presence').delete().eq('device_id', DEVICE_ID).then(()=>{}, ()=>{}); } catch(e){} }
  },
  _onlineCache: null, _onlineTs: 0,
  async online(force = false) {
    if (!SB) return [];
    if (!force && this._onlineCache && Date.now() - this._onlineTs < 5000) return this._onlineCache;
    const cutoff = new Date(Date.now() - 120000).toISOString(); // online = visto nos últimos 2 min
    try {
      const { data } = await SB.from('presence').select('*').gt('last_seen', cutoff).order('last_seen', { ascending:false });
      this._onlineCache = data || []; this._onlineTs = Date.now();
      return this._onlineCache;
    } catch (e) { return this._onlineCache || []; }
  }
};

// Re-renderiza a Home no lugar (sem piscar/rolar) se o admin estiver nela
function _refreshAdminHome() {
  if (ME?.role === 'admin') { Presence._onlineTs = 0; _scheduleHomeRefresh(); } // invalida cache e agenda
}

// Assinatura do que é VISÍVEL na Home. Se não mudar, não re-renderiza (evita piscar).
async function _homeSig() {
  try {
    const nb = await IDB.count('beneficiarios');
    const nf = await IDB.count('familias');
    const na = await IDB.count('acompanhamentos');
    const on = (await Presence.online()).map(o => o.device_id).sort().join(',');
    return `${nb}|${nf}|${na}|${on}`;
  } catch (e) { return String(Math.random()); } // em erro, não bloqueia o refresh
}

// Agenda um refresh com DEBOUNCE: várias notificações em rajada viram um só refresh.
let _homeRefreshDebTid = null;
function _scheduleHomeRefresh(force = false) {
  if (_homeRefreshDebTid) clearTimeout(_homeRefreshDebTid);
  _homeRefreshDebTid = setTimeout(() => { _homeRefreshDebTid = null; _softRefreshHome(force); }, 1200);
}

// Re-render SUAVE da Home: preserva a rolagem, não re-anima os contadores
// e nunca interrompe formulário aberto ou usuário digitando (evita "piscar")
let _softHomeTs = 0, _lastHomeSig = '';
async function _softRefreshHome(force = false) {
  const el = $('#mc');
  if (!el || el.dataset.page !== 'home') return;
  if (document.getElementById('sheet')?.classList.contains('show')) return; // formulário aberto
  const ae = document.activeElement;
  if (ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return;     // usuário digitando
  const now = Date.now();
  if (!force && now - _softHomeTs < 15000) return;                          // no máx. 1 refresh/15s
  // Só re-renderiza se algo visível mudou → sem isso, sincronizações e batidas
  // de presença ficavam recriando a tela inteira (o "piscar").
  const sig = await _homeSig();
  if (!force && sig === _lastHomeSig) { _softHomeTs = now; return; }
  _softHomeTs = now;
  _lastHomeSig = sig;
  const sy = window.scrollY;
  const h = await renderHome();
  const el2 = $('#mc');
  if (!el2 || el2.dataset.page !== 'home') return; // usuário navegou enquanto renderizava
  el2.innerHTML = h;
  _renderFooter();
  _startBannerSlideshow();
  window.scrollTo(0, sy); // mantém a posição — sem "pulo" para o topo
}

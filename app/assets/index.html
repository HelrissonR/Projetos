// IMPORT (suporte MHTML do MAPA)
// ═══════════════════════════════════════════════════════
function findCol(headers, patterns) {
  for (const p of patterns) {
    const idx = headers.findIndex(h => {
      const n = h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const pn = p.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return n.includes(pn);
    });
    if (idx !== -1) return idx;
  }
  return -1;
}

function decodeMHTML(raw) {
  // Encontrar boundary dinâmico
  const bMatch = raw.match(/boundary="([^"]+)"/);
  if (!bMatch) return raw;
  const boundary = bMatch[1];
  const parts = raw.split('--' + boundary);
  
  // Encontrar a Part com mais dados (sheet001.htm = dados reais)
  let bestPart = null, bestTRs = 0;
  for (const part of parts) {
    // Pular headers MIME da parte
    const bodyStart = part.indexOf('\r\n\r\n');
    if (bodyStart === -1) continue;
    let body = part.substring(bodyStart + 4);
    
    // Decodificar quoted-printable
    body = body.replace(/=\r?\n/g, '');
    body = body.replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
    
    // Contar <tr> para achar a parte com dados
    const trCount = (body.match(/<tr/gi) || []).length;
    if (trCount > bestTRs) {
      bestTRs = trCount;
      bestPart = body;
    }
  }
  
  console.log(`📄 MHTML: boundary="${boundary}", ${parts.length} parts, melhor part tem ${bestTRs} <tr>`);
  return bestPart || raw;
}

function parseMapaFormat(doc) {
  const rows = Array.from(doc.querySelectorAll('tr'));
  const beneficiarios = [];
  const familias = new Map();
  let currentFamily = null;

  for (const row of rows) {
    const cells = Array.from(row.querySelectorAll('td'));
    if (!cells.length) continue;
    
    // Juntar texto de todas as células para detecção
    const allText = cells.map(c => c.textContent.trim()).join('|');
    
    // Detectar bloco de família: procurar "Código Familiar" em QUALQUER célula
    if (allText.includes('digo Familiar') || allText.includes('Codigo Familiar')) {
      let cod = null;

      // Estratégia 1: "Código Familiar: XXXXXXXXXX" ou "Código Familiar XXXXXXXXXX" no mesmo texto
      const directMatch = allText.match(/c[oó]digo\s+familiar[^|]*?[:\s]+(\d{6,12})/i);
      if (directMatch) cod = directMatch[1];

      // Estratégia 2: célula com label + célula seguinte com o número isolado
      if (!cod) {
        for (let ci = 0; ci < cells.length; ci++) {
          const t = cells[ci].textContent.trim();
          if (/c[oó]digo\s+familiar/i.test(t)) {
            // Número pode estar na mesma célula depois do rótulo
            const mSame = t.match(/c[oó]digo\s+familiar[^0-9]*(\d{6,12})/i);
            if (mSame) { cod = mSame[1]; break; }
            // Ou na célula imediatamente seguinte
            if (ci + 1 < cells.length) {
              const next = cells[ci + 1].textContent.trim();
              if (/^\d{6,12}$/.test(next)) { cod = next; break; }
            }
          }
        }
      }

      // Estratégia 3: último recurso — número isolado de 7-12 dígitos que não seja CEP
      // CEP válido = 8 dígitos no formato XXXXX-XXX ou XXXXXXXX
      if (!cod) {
        for (const cell of cells) {
          const t = cell.textContent.trim();
          if (/^\d{7,12}$/.test(t) && !/^\d{5}-?\d{3}$/.test(t)) {
            cod = t;
            break;
          }
        }
      }

      if (!cod) continue;

      // Extrair endereço e bairro de TODAS as células
      let endereco = '', bairro = '', cep = '', zona = '', tel = '', eas = '';
      for (const cell of cells) {
        const t = cell.textContent.trim();
        if ((t.includes('Endere') || t.includes('BAIRRO')) && t.length > 20) {
          const full = t.replace(/16\s*-\s*Endere[çc]o:\s*/i, '').trim();
          const bM = full.match(/BAIRRO:\s*([^C]+?)(?:CEP|$)/i);
          const cM = full.match(/CEP:\s*(\d+)/i);
          const zM = full.match(/ZONA\s+(RURAL|URBANA)/i);
          const tM = full.match(/TELEFONE:\s*(\d+)/i);
          bairro = bM ? bM[1].trim() : '';
          cep = cM ? cM[1] : '';
          zona = zM ? zM[1] : '';
          tel = tM ? tM[1] : '';
          endereco = full.split(/BAIRRO:/i)[0].trim();
        }
        if (t.includes('EAS') || (t.includes('17 -') && t.length > 10)) {
          eas = t.replace(/17\s*-\s*EAS:\s*/i, '').trim();
        }
      }

      const familyId = 'FAM_' + cod;
      currentFamily = {
        familyId, cod_familiar: cod, endereco, bairro, cep, zona, telefone: tel, eas,
        membros: [], updated_at: new Date().toISOString()
      };
      familias.set(familyId, currentFamily);
      continue;
    }

    // Detectar beneficiário: "1 -" pode estar junto ou separado do NIS
    let nis = '', cns = '', nome = '', dob = null;
    
    for (let i = 0; i < cells.length; i++) {
      const t = cells[i].textContent.trim();
      const tNext = (i+1 < cells.length) ? cells[i+1].textContent.trim() : '';
      
      // NIS: "1 - 16503444924" (junto) ou "1 -" + "16503444924" (separado)
      if (/^1\s*-\s*\d{11}/.test(t)) {
        nis = t.match(/(\d{11})/)[1];
      } else if (/^1\s*-\s*$/.test(t) && /^\d{11}$/.test(tNext)) {
        nis = tNext;
      }
      
      // CNS: "1.1 -702007362475080"
      if (/^1\.1\s*-/.test(t)) {
        cns = t.replace(/^1\.1\s*-\s*/, '').trim();
      } else if (/^1\.1\s*-\s*$/.test(t) && tNext) {
        cns = tNext;
      }
      
      // Nome: "2 - CLARICE LOPES(O)" ou "2 -" + "CLARICE LOPES(O)"
      if (/^2\s*-\s*.+/.test(t)) {
        nome = t.replace(/^2\s*-\s*/, '').replace(/\([OD]\)/g, '').trim();
      } else if (/^2\s*-\s*$/.test(t) && tNext && !/^\d/.test(tNext)) {
        nome = tNext.replace(/\([OD]\)/g, '').trim();
      }
      
      // Data nasc: "3 - 19/06/2008" ou "3 -" + "19/06/2008"
      const dateStr = /^3\s*-\s*.+/.test(t) ? t : (/^3\s*-\s*$/.test(t) ? tNext : '');
      if (dateStr) {
        const dateM = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if (dateM) dob = `${dateM[3]}-${dateM[2]}-${dateM[1]}`;
      }
    }
    
    if (nis && currentFamily) {
      const age = dob ? Math.floor((Date.now() - new Date(dob)) / 31557600000) : null;
      const b = {
        nis, cns, nome, dob, idade: age,
        endereco: currentFamily.endereco,
        bairro: currentFamily.bairro,
        cod_fam: currentFamily.familyId,
        tel: currentFamily.telefone,
        cpf: '', gestante: false,
        updated_at: new Date().toISOString()
      };
      beneficiarios.push(b);
      currentFamily.membros.push(b);
    }
  }
  return { beneficiarios, familias: Array.from(familias.values()) };
}

function parseSimpleTable(doc) {
  const table = doc.querySelector('table');
  if (!table) return null;
  const rows = Array.from(table.querySelectorAll('tr'));
  if (rows.length < 2) return null;

  const headers = Array.from(rows[0].querySelectorAll('th, td')).map(th => th.textContent.trim());
  const ci = {
    nis: findCol(headers, ['NIS']),
    nome: findCol(headers, ['Nome']),
    endereco: findCol(headers, ['Endereço','Endereco']),
    bairro: findCol(headers, ['Bairro']),
    idade: findCol(headers, ['Idade']),
    cod_fam: findCol(headers, ['Código Familiar','Codigo Familiar','cod_fam','Cod Familiar','CodFamiliar','Família','Familia'])
  };
  if (ci.nis === -1 || ci.nome === -1) return null;

  const beneficiarios = [];
  const famMap = new Map();

  for (let i = 1; i < rows.length; i++) {
    const cells = Array.from(rows[i].querySelectorAll('td'));
    const nis = cells[ci.nis]?.textContent.trim() || '';
    const nome = cells[ci.nome]?.textContent.trim() || '';
    if (!nis || !nome) continue;
    const endereco = ci.endereco !== -1 ? (cells[ci.endereco]?.textContent.trim()||'') : '';
    const bairro = ci.bairro !== -1 ? (cells[ci.bairro]?.textContent.trim()||'') : '';
    const idade = ci.idade !== -1 ? parseInt(cells[ci.idade]?.textContent.trim())||null : null;
    const codFam = ci.cod_fam !== -1 ? (cells[ci.cod_fam]?.textContent.trim()||'') : '';

    // Prioridade: 1) Código Familiar, 2) NIS individual (nunca endereço!)
    const familyId = codFam ? 'FAM_' + codFam : 'FAM_IND_' + nis;

    if (!famMap.has(familyId)) {
      famMap.set(familyId, { familyId, cod_familiar: codFam || null, endereco: endereco || 'Sem endereço', bairro, membros: [], updated_at: new Date().toISOString() });
    }

    const b = { nis, nome, dob: null, idade, endereco, bairro, cod_fam: familyId, tel: '', cns: '', cpf: '', gestante: false, updated_at: new Date().toISOString() };
    beneficiarios.push(b);
    famMap.get(familyId).membros.push(b);
  }

  return { beneficiarios, familias: Array.from(famMap.values()) };
}

// Parseia um arquivo (MHTML "MAPA" ou XLSX/CSV) → {beneficiarios, familias, _acomps?} (sem salvar)
async function parseImportFile(file) {
    const ab = await file.arrayBuffer();
    const isXLSX = /\.(xlsx|csv)$/i.test(file.name); // XLSX.read também lê CSV (e-Gestor exporta ambos)
    let result = null;

    if (isXLSX && typeof XLSX !== 'undefined') {
      // ═══════════════════════════════════════════════
      // PARSER XLSX — lê todas as abas
      // ═══════════════════════════════════════════════
      console.log('📊 Importando XLSX...');
      const wb = XLSX.read(ab, { type: 'array', cellDates: true });
      
      const beneficiarios = [];
      const famMap = new Map();
      const acompsImp = [];
      let totalAbas = 0;
      // Date → 'YYYY-MM-DD' no fuso LOCAL (toISOString desloca 1 dia em UTC-3)
      const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      for (const sheetName of wb.SheetNames) {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (rows.length < 2) continue;

        // ── Detectar colunas pelo header ──────────────────
        // Normaliza: minúscula + remove acentos para comparação robusta
        const norm = s => String(s||'').trim().toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g,'');
        const hdr     = rows[0].map(h => String(h||'').trim());
        const hdrNorm = hdr.map(norm);

        const ci = {
          // "Código Familiar" — busca por 'familiar' (único no arquivo)
          cod_fam:    hdrNorm.findIndex(h => h.includes('familiar')),
          endereco:   hdrNorm.findIndex(h => h.includes('endere')),
          // EAS — coluna exata "EAS" ou começa com 'eas'
          eas:        hdrNorm.findIndex(h => h === 'eas' || h.startsWith('eas ')),
          nis:        hdrNorm.findIndex(h => h === 'nis' || (h.includes('nis') && !h.includes('ocorr'))),
          cns:        hdrNorm.findIndex(h => h === 'cns' || (h.includes('cns') && !h.includes('ocorr'))),
          nome:       hdrNorm.findIndex(h => h === 'nome'),
          dob:        hdrNorm.findIndex(h => h.includes('nascimento')),
          data_acomp: hdrNorm.findIndex(h => h.includes('data') && h.includes('acompanhamento')),
          peso:       hdrNorm.findIndex(h => h.includes('peso')),
          estatura:   hdrNorm.findIndex(h => h.includes('estatura') || h.includes('altura')),
          vacina:     hdrNorm.findIndex(h => h.includes('vacina') && h.includes('dia')),
          gestacao:   hdrNorm.findIndex(h => h.includes('gestac') || h.includes('gestacional')),
          prenatal:   hdrNorm.findIndex(h => h.includes('natal') && h.includes('realiz')),
          dum:        hdrNorm.findIndex(h => h === 'dum'),
          // Marcador de "já acompanhado" (sem data): coluna Situação/Acompanhado
          acomp_flag: hdrNorm.findIndex(h => (h.includes('acompanhad') || h.includes('situac')) && !h.includes('data') && !h.includes('motivo')),
        };

        console.log(`  🔍 Aba "${sheetName}" — colunas detectadas:`,
          Object.entries(ci).map(([k,v])=>v>=0?`${k}[${v}]="${hdr[v]}"`:null).filter(Boolean).join(', '));

        if (ci.nis === -1 || ci.nome === -1) {
          console.warn(`⚠️ Aba "${sheetName}": NIS ou Nome não encontrado, pulando`);
          continue;
        }
        if (ci.cod_fam === -1) {
          console.warn(`⚠️ Aba "${sheetName}": "Código Familiar" não encontrado — famílias individualizadas por NIS`);
        }

        totalAbas++;
        let abaCount = 0;

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          const nis = String(r[ci.nis] || '').trim();
          // Detectar gestante ANTES de limpar o nome
          const nomeRaw  = String(r[ci.nome] || '').trim();
          const gestante = /\(G\)$/i.test(nomeRaw);
          const nome     = nomeRaw.replace(/\s*\(O\)\s*$|\s*\(G\)\s*$/gi, '').trim();
          if (!nis || !nome) continue;

          // Código Familiar — validar como numérico (3-12 dígitos; aceita códigos curtos)
          const codFamRaw = ci.cod_fam >= 0 ? String(r[ci.cod_fam] || '').trim() : '';
          const codFam    = /^\d{3,12}$/.test(codFamRaw) ? codFamRaw : '';
          if (codFamRaw && !codFam)
            console.warn(`⚠️ Linha ${i+1}: Código Familiar inválido ("${codFamRaw}")`);

          const enderecoRaw = ci.endereco >= 0 ? String(r[ci.endereco] || '').trim() : '';
          const easRaw      = ci.eas >= 0 ? String(r[ci.eas] || '').trim() : sheetName;
          const cns         = ci.cns >= 0 ? String(r[ci.cns] || '').trim() : '';

          // Extrair componentes do endereço (formato "BAIRRO: X CEP: Y ZONA Z TELEFONE: W")
          let bairro = '', cep = '', zona = '', telefone = '';
          const bairroM = enderecoRaw.match(/BAIRRO:\s*(.+?)(?:\s+CEP:|\s*$)/i);
          if (bairroM) bairro = bairroM[1].trim();
          const cepM = enderecoRaw.match(/CEP:\s*(\d{5,8})/i);
          if (cepM) cep = cepM[1];
          const zonaM = enderecoRaw.match(/ZONA\s+(RURAL|URBANA)/i);
          if (zonaM) zona = zonaM[1];
          const telM = enderecoRaw.match(/TELEFONE:\s*(\d[\d\s-]*\d)/i);
          if (telM) telefone = telM[1].replace(/\s/g,'');
          const endLimpo = enderecoRaw.replace(/\s*BAIRRO:.*$/i, '').trim();

          // Data de nascimento
          let dob = null, idade = null;
          if (ci.dob >= 0 && r[ci.dob]) {
            const raw = r[ci.dob];
            if (raw instanceof Date) {
              dob = isoLocal(raw);
            } else {
              const p = String(raw).match(/(\d{2})\/(\d{2})\/(\d{4})/);
              if (p) dob = `${p[3]}-${p[2]}-${p[1]}`;
            }
            if (dob) idade = Math.floor((Date.now() - new Date(dob)) / 31557600000);
          }

          // ── Agrupamento ESTRITAMENTE pelo Código Familiar ──
          const familyId = codFam ? 'FAM_' + codFam : 'FAM_IND_' + nis;

          if (!famMap.has(familyId)) {
            famMap.set(familyId, {
              familyId,
              cod_familiar: codFam || null,
              endereco: endLimpo || 'Sem endereço',
              bairro, cep, zona, telefone,
              eas: easRaw,
              total_membros: 0,
              membros: [],
              updated_at: new Date().toISOString()
            });
          }

          const b = {
            nis, cns, nome, dob, idade,
            endereco: endLimpo, bairro, cep, zona,
            cod_fam: familyId,
            eas: easRaw,
            tel: telefone,
            cpf: '',
            gestante,
            updated_at: new Date().toISOString()
          };
          beneficiarios.push(b);
          famMap.get(familyId).membros.push({ nis, nome, dob, idade, gestante });
          famMap.get(familyId).total_membros++;
          abaCount++;

          // ── Detectar se a linha indica acompanhamento ──
          // 1) Data do Acompanhamento preenchida  OU  2) marcador "acompanhado/situação" = sim
          let dataAcomp = null;
          if (ci.data_acomp >= 0 && r[ci.data_acomp]) {
            const rawDA = r[ci.data_acomp];
            if (rawDA instanceof Date) {
              dataAcomp = isoLocal(rawDA);
            } else {
              const p = String(rawDA).match(/(\d{2})\/(\d{2})\/(\d{4})/);
              if (p) dataAcomp = `${p[3]}-${p[2]}-${p[1]}`;
            }
          }
          // Marcador de acompanhado sem data → usa a data da importação (conta na vigência atual)
          let flagAcomp = false;
          if (!dataAcomp && ci.acomp_flag >= 0) {
            const fv = norm(r[ci.acomp_flag]);
            flagAcomp = fv === 's' || fv === 'sim' || fv === 'x' || fv === '1'
              || fv.includes('acompanhad') || fv.includes('realizad') || fv.includes('conclu');
            if (flagAcomp) dataAcomp = isoLocal(new Date());
          }
          if (dataAcomp) {
            {
              const pesoV    = ci.peso >= 0     ? (parseFloat(r[ci.peso]) || null) : null;
              const statV    = ci.estatura >= 0 ? (parseInt(r[ci.estatura]) || null) : null;
              const imcV     = pesoV && statV && statV > 0
                ? +(pesoV / Math.pow(statV/100, 2)).toFixed(2) : null;
              const vacinaV  = ci.vacina >= 0   ? String(r[ci.vacina]||'').toLowerCase() : '';
              const preV     = ci.prenatal >= 0 ? String(r[ci.prenatal]||'').toLowerCase() : '';
              const dumRaw   = ci.dum >= 0 && r[ci.dum];
              let dumV = null;
              if (dumRaw) {
                if (dumRaw instanceof Date) dumV = isoLocal(dumRaw);
                else { const p=String(dumRaw).match(/(\d{2})\/(\d{2})\/(\d{4})/); if(p) dumV=`${p[3]}-${p[2]}-${p[1]}`; }
              }
              // id determinístico (NIS+semestre): reimportar atualiza em vez de duplicar
              acompsImp.push({
                id: acompId(nis, dataAcomp),
                nis, data: dataAcomp,
                tecnico: 'Importação', estabelecimento: easRaw,
                peso: pesoV, altura: statV, imc: imcV,
                vacina_ok: vacinaV.includes('sim') || vacinaV === 's' ? true
                         : vacinaV.includes('nao') || vacinaV.includes('não') || vacinaV === 'n' ? false : null,
                gestante, dum: dumV,
                prenatal: preV.includes('sim')||preV==='s' ? 'sim' : preV.includes('nao')||preV.includes('não')||preV==='n' ? 'nao' : null,
                observacoes: null,
                importado: true,
                device_id: DEVICE_ID,
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
              });
            }
          }
        }
        console.log(`  📋 ${sheetName}: ${abaCount} beneficiários`);
      }

      const familias = Array.from(famMap.values());
      result = { beneficiarios, familias };
      if (acompsImp.length) result._acomps = acompsImp;
      if (result._acomps?.length) {
        console.log(`📋 ${result._acomps.length} acompanhamentos importados da planilha`);
      }
      console.log(`📊 Total: ${beneficiarios.length} beneficiários, ${familias.length} famílias (${totalAbas} abas)`);

    } else {
      // ═══════════════════════════════════════════════
      // PARSER HTML/XLS (MHTML) — formato antigo
      // ═══════════════════════════════════════════════
      const u8 = new Uint8Array(ab);
      let text = new TextDecoder('iso-8859-1').decode(u8);
      if (text.includes('�')) text = new TextDecoder('utf-8').decode(u8);

      const isMHTML = text.startsWith('MIME-') || text.includes('Content-Transfer-Encoding:');
      if (isMHTML) {
        console.log('📄 MHTML detectado');
        text = decodeMHTML(text);
      }

      const doc = new DOMParser().parseFromString(text, 'text/html');
      result = parseMapaFormat(doc);
      if (!result.beneficiarios.length) {
        console.log('📄 Tentando parser de tabela simples...');
        result = parseSimpleTable(doc);
      }
    }

    return result;
}

// Salva o resultado do import ({beneficiarios, familias, _acomps}) com merge seguro de acompanhamentos
async function saveImportResult(result) {
    // LIMPAR dados antigos antes de reimportar (evita duplicação)
    const existingBen = await IDB.count('beneficiarios');
    const existingFam = await IDB.count('familias');
    
    if (existingBen > 0) {
      const confirmar = await uiConfirm(
        `Já existem ${existingBen} beneficiários e ${existingFam} famílias.\nO arquivo contém ${result.beneficiarios.length} beneficiários e ${result.familias.length} famílias.\n\nSubstituir os dados existentes? (Substituir = limpar e reimportar; Mesclar = manter e somar)`,
        {title:'Importar dados', okText:'Substituir', cancelText:'Mesclar', danger:true}
      );
      
      if (confirmar) {
        console.log('🗑️ Limpando dados antigos...');
        await IDB.clear('beneficiarios');
        await IDB.clear('familias');
      }
    }

    // Salvar no IndexedDB
    await IDB.putAll('beneficiarios', result.beneficiarios);
    await IDB.putAll('familias', result.familias);
    if (result._acomps?.length) {
      // Merge seguro: não sobrescreve peso/altura/observações já coletados no app.
      // Apenas garante que o acompanhamento exista e conte na vigência.
      const merged = [];
      for (const a of result._acomps) {
        const ex = await IDB.get('acompanhamentos', a.id);
        if (ex) {
          merged.push({
            ...ex,
            data:        ex.data || a.data,          // mantém a data já registrada (continuidade)
            peso:        ex.peso        ?? a.peso,
            altura:      ex.altura      ?? a.altura,
            imc:         ex.imc         ?? a.imc,
            vacina_ok:   ex.vacina_ok   ?? a.vacina_ok,
            prenatal:    ex.prenatal    ?? a.prenatal,
            dum:         ex.dum         ?? a.dum,
            observacoes: ex.observacoes ?? a.observacoes,
            gestante:    a.gestante || ex.gestante,
            updated_at:  new Date().toISOString()
          });
        } else {
          merged.push(a);
        }
      }
      await IDB.putAll('acompanhamentos', merged);
    }
    invalidateBenefCache(); invalidateAcompCache(); // força recarga dos caches após importar
    try { await reconcileFamilias(); } catch(e){ console.warn('reconcile:', e); } // remove famílias órfãs
    _audit('data.import', 'planilha', `${result.beneficiarios.length} benef.`);

    const msg = `✓ ${result.beneficiarios.length} beneficiários\n${result.familias.length} famílias`
      + (result._acomps?.length ? `\n${result._acomps.length} acompanhamentos` : '');
    console.log(msg);
    showToast(msg, 'ok');

    // Sync com Supabase se conectado
    if (SB) {
      Sync.upload();
    }
}

// Import simples (um arquivo) — mantém compatibilidade
async function importFile(file) {
  if (!file) return;
  showToast('Processando...', 'warn');
  try {
    const result = await parseImportFile(file);
    if (!result || !result.beneficiarios.length) { showToast('Nenhum beneficiário encontrado', 'err'); return; }
    await saveImportResult(result);
  } catch (e) {
    console.error('Import error:', e);
    showToast('Erro ao importar: ' + e.message, 'err');
  }
}

async function _doImportMapa() {
  const f1 = document.getElementById('impMapa1')?.files?.[0];
  const f2 = document.getElementById('impMapa2')?.files?.[0];

  closeSheet();
  showToast('Processando…', 'warn');

    if (!f2) { await importFile(f1); return; }

  }
}

// Parser dedicado do MAPA 2 (xlsx individualizado) → lista de acompanhamentos por NIS
async function parseMapa2(file) {
  const ab = await file.arrayBuffer();
  const isXLSX = /\.(xlsx|csv)$/i.test(file.name);
  const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseDate = raw => {
    if (!raw) return null;
    if (raw instanceof Date) return isoLocal(raw);
    const p = String(raw).match(/(\d{2})\/(\d{2})\/(\d{4})/); return p ? `${p[3]}-${p[2]}-${p[1]}` : null;
  };
  const out = [];
  let rowsAll = [];
  if (isXLSX && typeof XLSX !== 'undefined') {
    const wb = XLSX.read(ab, { type:'array', cellDates:true });
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' });
      if (rows.length >= 2) rowsAll.push([sn, rows]);
    }
  } else {
    // fallback MHTML/HTML
    const u8 = new Uint8Array(ab); let text = new TextDecoder('iso-8859-1').decode(u8);
    if (text.includes('�')) text = new TextDecoder('utf-8').decode(u8);
    if (text.startsWith('MIME-') || text.includes('Content-Transfer-Encoding:')) text = decodeMHTML(text);
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const trs = Array.from(doc.querySelectorAll('table tr')).map(tr => Array.from(tr.querySelectorAll('td,th')).map(td => td.textContent.trim()));
    if (trs.length >= 2) rowsAll.push(['', trs]);
  }
  for (const [sn, rows] of rowsAll) {
    const hdr = rows[0].map(h => norm(h));
    const find = (...keys) => hdr.findIndex(h => keys.every(k => h.includes(k)));
    const ci = {
      eas:       (()=>{ let i = hdr.findIndex(h=>h==='eas'||h.startsWith('eas ')); return i>=0?i:find('unidade','saude'); })(),
      nis:       hdr.findIndex(h => h==='nis' || (h.includes('nis') && !h.includes('ocorr'))),
      nome:      hdr.findIndex(h => h==='nome'),
      idade:     find('idade'),
      endereco:  hdr.findIndex(h => h.includes('endere')),
      bairro:    find('bairro'),
      acomp:     hdr.findIndex(h => h==='acompanhado' || (h.includes('acompanhad') && !h.includes('dt') && !h.includes('data') && !h.includes('motivo') && !h.includes('registr') && !h.includes('outro'))),
      motivo:    hdr.findIndex(h => h.includes('motivo') && (h.includes('nao acomp') || h.includes('não acomp') || h.includes('acompanh'))),
      dtAcomp:   hdr.findIndex(h => (h.includes('dt') || h.includes('data')) && h.includes('acomp')),
      gestante:  find('gestante'),
      dum:       hdr.findIndex(h => h==='dum'),
      prenatal:  find('natal'),
      peso:      find('peso'),
      altura:    hdr.findIndex(h => h.includes('altura') || h.includes('estatura')),
      vacina:    hdr.findIndex(h => h.includes('vacina')),
    };
    if (ci.nis < 0) continue;
    for (let i=1;i<rows.length;i++){
      const r = rows[i];
      const nis = String(r[ci.nis]||'').trim();
      if (!/^\d{6,}$/.test(nis)) continue;
      const acRaw = ci.acomp>=0 ? norm(r[ci.acomp]) : '';
      const acompanhado = acRaw==='sim' || acRaw==='s' || acRaw==='1' || acRaw.includes('sim');
      const naoAcomp    = acRaw==='nao' || acRaw==='não' || acRaw.includes('nao') || acRaw.includes('não');
      const pesoV   = ci.peso>=0   ? (parseFloat(r[ci.peso])||null) : null;
      const alturaV = ci.altura>=0 ? (parseInt(r[ci.altura])||null) : null;
      const vRaw    = ci.vacina>=0 ? norm(r[ci.vacina]) : '';
      const pRaw    = ci.prenatal>=0 ? norm(r[ci.prenatal]) : '';
      const gRaw    = ci.gestante>=0 ? norm(r[ci.gestante]) : '';
      out.push({
        nis,
        nome:     ci.nome>=0 ? String(r[ci.nome]||'').replace(/\s*\([OGD]\)\s*$/i,'').trim() : '',
        idade:    ci.idade>=0 ? (parseInt(r[ci.idade])||null) : null,
        endereco: ci.endereco>=0 ? String(r[ci.endereco]||'').trim() : '',
        bairro:   ci.bairro>=0 ? String(r[ci.bairro]||'').trim() : '',
        eas:      ci.eas>=0 ? String(r[ci.eas]||'').trim() : sn,
        acompanhado, naoAcomp,
        motivo:   ci.motivo>=0 ? String(r[ci.motivo]||'').trim() : '',
        dtAcomp:  ci.dtAcomp>=0 ? parseDate(r[ci.dtAcomp]) : null,
        peso: pesoV, altura: alturaV,
        imc: (pesoV && alturaV && alturaV>0) ? +(pesoV/Math.pow(alturaV/100,2)).toFixed(2) : null,
        vacina_ok: vRaw.includes('sim')||vRaw==='s' ? true : vRaw.includes('nao')||vRaw.includes('não')||vRaw==='n' ? false : null,
        prenatal: pRaw.includes('sim')||pRaw==='s' ? 'sim' : pRaw.includes('nao')||pRaw.includes('não')||pRaw==='n' ? 'nao' : null,
        dum: ci.dum>=0 ? parseDate(r[ci.dum]) : null,
        gestante: gRaw.includes('sim') || gRaw==='s',
      });
    }
  }
  return out;
}

// Importa MAPA 1 (base) e cruza com MAPA 2 (individualizado)
async function importDualMapa(f1, f2) {
  const base = await parseImportFile(f1);
  if (!base || !base.beneficiarios.length) { showToast('MAPA 1: nenhum beneficiário encontrado', 'err'); return; }
  const mapa2 = await parseMapa2(f2);
  if (!mapa2.length) { showToast('MAPA 2: nenhum registro lido — importando só a base', 'warn'); await saveImportResult(base); return; }

  const now = new Date().toISOString();
  const isoHoje = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const baseByNis = new Map(base.beneficiarios.map(b => [String(b.nis), b]));
  const acomps = [...(base._acomps || [])];
  let marcados = 0, adicionados = 0;

  for (const e of mapa2) {
    let b = baseByNis.get(e.nis);
    // Beneficiário só no MAPA 2 → adiciona ao banco (família individualizada)
    if (!b) {
      const famId = 'FAM_IND_' + e.nis;
      b = { nis:e.nis, cns:'', nome:e.nome, dob:null, idade:e.idade,
            endereco:e.endereco, bairro:e.bairro, cod_fam:famId, eas:e.eas,
            tel:'', cpf:'', gestante:e.gestante, updated_at:now };
      base.beneficiarios.push(b); baseByNis.set(e.nis, b);
      base.familias.push({ familyId:famId, cod_familiar:null, endereco:e.endereco, bairro:e.bairro,
            cep:'', zona:'', telefone:'', eas:e.eas, total_membros:1,
            membros:[{ nis:e.nis, nome:e.nome, idade:e.idade, gestante:e.gestante }], updated_at:now });
      adicionados++;
    }
    // Marca acompanhamento (conta na vigência) — mesmo sem peso/altura
    if (e.acompanhado || e.dtAcomp || (e.naoAcomp && e.motivo)) {
      const data = e.dtAcomp || isoHoje;
      acomps.push({
        id: acompId(e.nis, data), nis: e.nis, data,
        tecnico: 'Importação (MAPA 2)', estabelecimento: e.eas,
        peso: e.peso, altura: e.altura, imc: e.imc,
        vacina_ok: e.vacina_ok, gestante: e.gestante, dum: e.dum, prenatal: e.prenatal,
        acompanhado: e.naoAcomp && !e.acompanhado ? false : true,
        motivo_na: (e.naoAcomp && !e.acompanhado) ? (e.motivo || 'Sem motivo informado') : null,
        observacoes: null, importado: true, device_id: DEVICE_ID,
        created_at: now, updated_at: now
      });
      if (e.acompanhado || e.dtAcomp) marcados++;
    }
  }
  base._acomps = acomps;
  await saveImportResult(base);
  showToast(`✓ Base importada\n${marcados} marcados como acompanhados (MAPA 2)\n${adicionados} adicionados só do MAPA 2`, 'ok');
}

// ═══════════════════════════════════════════════════════
// VIEWS
// ═══════════════════════════════════════════════════════
async function renderHome() {
  const nb = await IDB.count('beneficiarios');
  // Contagem REAL de famílias = códigos familiares distintos entre os beneficiários
  // existentes. Evita contar famílias órfãs/fantasma (que faziam o total estourar
  // acima do nº de beneficiários). Garante sempre: famílias ≤ beneficiários.
  const _benHome = await getBenefCache();
  const _liveFamIds = new Set(_benHome.filter(b => b.cod_fam).map(b => b.cod_fam));
  const nf = _liveFamIds.size;
  const na = await IDB.count('acompanhamentos');
  const inst = await IDB.getMeta('instituicao') || 'Prefeitura Municipal';
  const ls = await IDB.getMeta('lastDownload');

  // ── Indicadores ──────────────────────────────────────
  const acomps  = await getAcompCache();
  // Só famílias reais (com beneficiário vinculado) — descarta fantasmas nos indicadores
  const familias = (await IDB.getAll('familias')).filter(f => _liveFamIds.has(f.familyId));

  // Acomp este mês
  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  const acMes = acomps.filter(a => new Date(a.data) >= inicioMes).length;

  // Acompanhamentos realizados HOJE (para destaque na tela inicial — todos os perfis)
  const _hd = new Date();
  const hojeISO = `${_hd.getFullYear()}-${String(_hd.getMonth()+1).padStart(2,'0')}-${String(_hd.getDate()).padStart(2,'0')}`;
  const acHoje = acomps.filter(a => a && a.acompanhado !== false && String(a.data||'').slice(0,10) === hojeISO).length;

  // Famílias sem nenhum acompanhamento
  const nisAcomp = new Set(acomps.map(a => a.nis));
  const _mNis = m => typeof m === 'string' ? m : m.nis;
  const famSemAcomp = familias.filter(f => !f.membros?.some(m => nisAcomp.has(_mNis(m)))).length;

  // Gestantes
  const gestantes = acomps.filter(a => a.gestante).length;

  // Vacinação pendente (último acomp por NIS com vacina_ok=false)
  const ultimoAcomp = new Map();
  acomps.forEach(a => {
    const prev = ultimoAcomp.get(a.nis);
    if (!prev || new Date(a.data) > new Date(prev.data)) ultimoAcomp.set(a.nis, a);
  });
  const vacPendente = [...ultimoAcomp.values()].filter(a => a.vacina_ok === false).length;

  // ── TRIA breakdown ───────────────────────────────────
  const triaCom   = acomps.filter(a => a.tria_risco);
  const triaSR    = triaCom.filter(a => a.tria_risco === 'sem_risco').length;
  const triaR     = triaCom.filter(a => a.tria_risco === 'risco').length;
  const triaRA    = triaCom.filter(a => a.tria_risco === 'risco_alto').length;
  const triaTotal = triaCom.length;
  const triaOn    = await triaAtiva(); // oculta o bloco TRIA do painel quando desativada

  // ── Últimos 6 meses ──────────────────────────────────
  const now = new Date();
  const monthData = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const lbl = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()];
    monthData.push({ key, lbl, count: 0, isCur: i === 0 });
  }
  acomps.forEach(a => {
    if (!a.data) return;
    const d = new Date(a.data);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const m = monthData.find(x => x.key === key);
    if (m) m.count++;
  });
  const maxCount = Math.max(...monthData.map(m => m.count), 1);

  // ── Cobertura do mês (% de beneficiários únicos acompanhados) ──
  const nisAcompMes = new Set(acomps.filter(a => new Date(a.data) >= inicioMes).map(a => a.nis));
  const coveragePct = nb > 0 ? Math.round((nisAcompMes.size / nb) * 100) : 0;

  // ── Atividade recente (últimos 5) ────────────────────
  const benefs = await getBenefCache();
  const nisToNome = {};
  benefs.forEach(b => { if (b.nis) nisToNome[b.nis] = b.nome; });
  const recent = [...acomps].sort((a,b) => new Date(b.data||0) - new Date(a.data||0)).slice(0, 5);

  // ── Periodicidade: acompanhamentos vencidos ──────────
  const vencidosN = _calcVencidos(benefs, ultimoAcomp).length;

  // ── Helpers ──────────────────────────────────────────
  function initials(nome) {
    if (!nome) return '?';
    const parts = nome.trim().split(/\s+/);
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
  }
  function fmtDate(d) {
    if (!d) return '';
    return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
  }

  // ── Meta da vigência ─────────────────────────────────
  const vigIni = await IDB.getMeta('vigenciaInicio') || '2026-01-01';
  const vigFim = await IDB.getMeta('vigenciaFim') || '2026-12-31';
  const vIni = new Date(vigIni + 'T00:00:00'), vFim = new Date(vigFim + 'T23:59:59');
  const nisVig = new Set(acomps.filter(a => {
    if (!a.data) return false;
    const d = new Date(a.data + 'T12:00:00');
    return d >= vIni && d <= vFim;
  }).map(a => a.nis));
  const vigDone = nisVig.size;
  const vigPct = nb > 0 ? Math.min(100, Math.round(vigDone / nb * 100)) : 0;
  const agora = new Date();
  const diasRest = Math.max(0, Math.ceil((vFim - agora) / 864e5));
  const diasPassados = Math.max(1, Math.ceil((Math.min(agora, vFim) - vIni) / 864e5));
  const vigFaltam = Math.max(0, nb - vigDone);
  const ritmo = vigDone / diasPassados;
  let projTxt, projColor = 'var(--muted)';
  if (vigFaltam === 0 && nb > 0) { projTxt = `${fi('award',13)} Meta concluída — todos acompanhados!`; projColor = 'var(--ok)'; }
  else if (diasRest === 0) { projTxt = `Vigência encerrada — ${vigFaltam} sem acompanhamento`; projColor = 'var(--err)'; }
  else if (ritmo > 0) {
    const diasNec = Math.ceil(vigFaltam / ritmo);
    const porDia = Math.ceil(vigFaltam / diasRest);
    projTxt = diasNec <= diasRest
      ? `Nesse ritmo, você conclui em ~${diasNec} dias — dentro do prazo ✓`
      : `Ritmo necessário: ${porDia} beneficiário${porDia > 1 ? 's' : ''}/dia para fechar a vigência`;
    projColor = diasNec <= diasRest ? 'var(--ok)' : 'var(--warn)';
  } else projTxt = 'Nenhum acompanhamento registrado nesta vigência ainda';
  const ringC = 2 * Math.PI * 34;
  const ringOff = (ringC * (1 - vigPct / 100)).toFixed(1);
  const ringColor = vigPct >= 100 ? 'var(--ok)' : 'var(--accent)';
  const vigCard = nb > 0 ? `
    <div class="card card-sub nh" style="padding:16px">
      <div class="mb-section-title">${fi('target', 12)} Meta da vigência
        <span class="tag ${diasRest <= 30 ? 'tag-w' : 'tag-i'}" style="margin-left:auto">${diasRest} dias restantes</span></div>
      <div style="display:flex;align-items:center;gap:16px">
        <svg viewBox="0 0 84 84" style="width:84px;height:84px;flex-shrink:0">
          <circle cx="42" cy="42" r="34" fill="none" stroke="var(--border)" stroke-width="8"/>
          <circle cx="42" cy="42" r="34" fill="none" stroke="${ringColor}" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="${ringC.toFixed(1)}" stroke-dashoffset="${ringOff}"
            transform="rotate(-90 42 42)" style="transition:stroke-dashoffset .8s cubic-bezier(.34,1.2,.64,1)"/>
          <text x="42" y="47" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)">${vigPct}%</text>
        </svg>
        <div style="flex:1;min-width:0">
          <div style="font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1"><span data-cnt="${vigDone}">${vigDone.toLocaleString('pt-BR')}</span><span style="font-size:13px;font-weight:600;color:var(--muted)"> / ${nb.toLocaleString('pt-BR')}</span></div>
          <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:3px">beneficiários acompanhados na vigência</div>
          <div style="font-size:12px;color:${projColor};font-weight:600;margin-top:8px;line-height:1.4">${projTxt}</div>
        </div>
      </div>
    </div>` : '';

  const bannerHtml = await renderBanner('home');
  const hoje = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  const showAlerts = await IDB.getMeta('designShowAlerts') !== 'hide';

  // ── Lembrete de backup semanal (admin) ───────────────
  let backupBanner = '';
  if (ME.role === 'admin' && nb > 0) {
    const last = localStorage.getItem('lastAutoBackup');
    const dias = last ? Math.floor((Date.now() - new Date(last)) / 864e5) : null;
    if (dias === null || dias >= 7) {
      backupBanner = `
      <div class="sync-pend" style="background:var(--accent-soft);border-color:var(--accent);color:var(--text)"
        onclick="exportBackup().then(()=>_softRefreshHome(true))" title="Baixa o backup completo (JSON) e zera o lembrete">
        ${fi('save',15)}
        <span style="flex:1">Backup semanal ${dias===null?'nunca feito':'há '+dias+' dias'} — toque para baixar agora</span>
        <span style="text-decoration:underline">Fazer backup</span>
      </div>`;
    }
  }

  // ── Registros aguardando sincronização ───────────────
  const pendSync = acomps.filter(a => !a.synced_at).length;
  const syncBanner = (SB && pendSync > 0) ? `
    <div class="sync-pend" onclick="if(MANUAL_OFF){toggleManualOffline()}else{Sync.upload();showToast('Sincronizando...','ok')}" title="Toque para sincronizar agora">
      ${fi('refresh-cw',15)}
      <span style="flex:1">${pendSync} registro${pendSync>1?'s':''} aguardando sincronização${MANUAL_OFF?' — modo offline ativado':navigator.onLine?'':' — sem internet, será enviado ao reconectar'}</span>
      ${MANUAL_OFF?`<span style="text-decoration:underline">Reativar</span>`:navigator.onLine?`<span style="text-decoration:underline">Sincronizar</span>`:''}
    </div>` : '';

  // ── Painel do ADMIN: operadores online + contagem de acompanhamentos (tempo real) ──
  let adminPanel = '';
  if (ME.role === 'admin') {
    const usersList = JSON.parse(await IDB.getMeta('users') || '[]');
    const onlineList = await Presence.online();
    const onlineSet = new Set(onlineList.flatMap(p => [String(p.usuario||'').toLowerCase(), String(p.user_name||'').toLowerCase()]));
    const refSem = semestreAtualRef();
    const cntTotal = {}, cntSem = {};
    acomps.forEach(a => {
      const t = a.tecnico; if (!t) return;
      cntTotal[t] = (cntTotal[t]||0) + 1;
      if (semestreRef(a.data) === refSem) cntSem[t] = (cntSem[t]||0) + 1;
    });
    const ops = usersList.filter(u => u.ativo !== false && u.role !== 'visualizador');
    const isOn = u => onlineSet.has(String(u.user||'').toLowerCase()) || onlineSet.has(String(u.nome||'').toLowerCase());
    const nOnline = ops.filter(isOn).length;
    // online primeiro, depois por nº de acompanhamentos
    ops.sort((a,b) => (isOn(b)-isOn(a)) || ((cntTotal[b.nome]||0)-(cntTotal[a.nome]||0)));
    const rows = ops.map(u => {
      const on = isOn(u);
      const total = cntTotal[u.nome] || 0, sem = cntSem[u.nome] || 0;
      return `<div class="flex aic jcb card card-sub nh" style="padding:10px 12px">
        <div class="flex aic" style="gap:9px;min-width:0">
          <span style="width:9px;height:9px;border-radius:50%;flex-shrink:0;background:${on?'var(--ok)':'var(--border)'};${on?'box-shadow:0 0 0 3px var(--ok-soft)':''}"></span>
          <div style="min-width:0">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(u.nome)}${u.role==='admin'?' <span class="tag tag-i" style="font-size:9px">admin</span>':''}</div>
            <div class="small muted" style="font-size:11px">${on?'<span style="color:var(--ok);font-weight:600">online agora</span>':'offline'}</div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:800;font-size:17px;color:var(--accent);line-height:1">${total}</div>
          <div class="small muted" style="font-size:10px">${sem} no semestre</div>
        </div>
      </div>`;
    }).join('');
    adminPanel = `<div class="card card-sub nh" style="padding:14px">
      <div class="mb-section-title">${fi('users',12)} Operadores
        <span class="tag tag-ok" style="margin-left:auto">${nOnline} online</span></div>
      <div class="s3" style="--gap-3:6px;margin-top:8px">${rows || '<div class="small muted">Nenhum operador cadastrado.</div>'}</div>
      <div class="small muted" style="font-size:10px;margin-top:8px;text-align:center">Atualiza em tempo real conforme os operadores acessam e registram acompanhamentos.</div>
    </div>`;
  }

  // ── Empty state ──────────────────────────────────────
  if (nb === 0) {
    return `<div class="s4">
      <div class="flex aic jcb">
        <div><h2 style="font-size:20px">Olá, ${esc(ME.nome.split(' ')[0])}</h2><p class="small muted">${esc(inst)}</p></div>
      </div>
      ${bannerHtml}
      <div class="empty-state">
        <div class="ei">${fi('clipboard',44)}</div>
        <strong>Nenhum dado importado</strong>
        <p>Importe a planilha da base de dados para começar a usar o sistema.</p>
        ${can('data.import')?`<button class="btn btn-p" onclick="showImportMapaModal()" style="display:inline-flex;align-items:center;gap:6px">${fi('upload',15)} Importar agora</button>`:''}
      </div>
    </div>`;
  }

  // ── Moodboard dashboard ──────────────────────────────
  return `<div class="s4">

    <!-- Cabeçalho -->
    <div class="flex aic jcb">
      <div>
        <h2 style="font-size:20px">Olá, ${esc(ME.nome.split(' ')[0])}</h2>
        <p class="small muted">${esc(inst)} &middot; <span style="text-transform:capitalize">${hoje}</span></p>
      </div>
    </div>

    ${bannerHtml}

    ${syncBanner}
    ${backupBanner}

    ${adminPanel}

    <!-- ── Destaque: acompanhamentos realizados hoje (todos os perfis) ── -->
    <div class="card nh mb-today" onclick="nav('acomp')" style="cursor:pointer;padding:16px;display:flex;align-items:center;gap:14px;background:var(--accent);color:#fff;border:none">
      <div style="font-size:36px;font-weight:800;line-height:1;min-width:52px;text-align:center">${acHoje.toLocaleString('pt-BR')}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:15px">Acompanhamentos realizados hoje</div>
        <div style="font-size:12px;opacity:.9;text-transform:capitalize">${hoje}</div>
      </div>
      <div style="opacity:.9">${fi('check-circle',28)}</div>
    </div>

    <!-- ── Métricas principais (compactas) ── -->
    <div class="mb-stat-grid">
      <div class="mb-stat">
        <div class="mb-stat-num" style="color:var(--accent)"><span data-cnt="${nb}">${nb.toLocaleString('pt-BR')}</span></div>
        <div class="mb-stat-lbl">Beneficiários</div>

      </div>
      <div class="mb-stat">
        <div class="mb-stat-num" style="color:var(--ok)">${coveragePct}<span style="font-size:14px">%</span></div>

    <!-- ── KPIs de atenção (Gestantes / Vac. pend. / Sem acomp.) ocultos por padrão ── -->

    ${vigCard}

    <div class="card card-sub nh" style="padding:16px">
      <div class="mb-section-title">${fi('bar-chart-2',12)} Últimos 6 meses <span style="margin-left:auto;font-size:10px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0">${na} total</span></div>
      <div style="height:64px;display:flex;align-items:flex-end;gap:4px">
        ${monthData.map(m => `<div style="flex:1;border-radius:5px 5px 0 0;background:${m.isCur?'var(--accent)':m.count>0?'color-mix(in srgb,var(--accent) 25%,var(--border))':'var(--border)'};height:${Math.max(4,Math.round((m.count/maxCount)*60))}px;transition:height .4s cubic-bezier(.34,1.56,.64,1)" title="${m.lbl}: ${m.count} acomp."></div>`).join('')}
      </div>
      <div style="display:flex;gap:4px;margin-top:5px">
        ${monthData.map(m => `<div style="flex:1;text-align:center;font-size:10px;color:${m.isCur?'var(--text)':'var(--muted)'};font-weight:${m.isCur?700:400}">${m.lbl}</div>`).join('')}

      <div style="display:flex;gap:4px;margin-top:1px">
        ${monthData.map(m => `<div style="flex:1;text-align:center;font-size:10px;color:${m.isCur?'var(--text)':'var(--muted)'};font-weight:${m.isCur?700:400}">${m.count > 0 ? m.count : ''}</div>`).join('')}

let _famPage = 1;
const FAM_PER_PAGE = 40;

function _renderFamLista(familias, nb, page) {
  page = page || 1;
  _famPage = page;
  const total  = familias.length;
  const slice  = familias.slice(0, page * FAM_PER_PAGE);
  const temMais = total > slice.length;

  // Guarda a lista filtrada para o "Carregar mais"
  window._famListaAtual = familias;

  const codDisplay = f => {
    const c = f.familyId || '';
    return c.startsWith('FAM_IND_') ? '(individual)' : c.replace(/^FAM_/,'');
  };

  if (total === 0) return `<div class="empty-state"><div class="ei">${fi('home',44)}</div><strong>Nenhuma família encontrada</strong><p>Ajuste os filtros ou importe a base de dados.</p></div>`;

  return `<div class="card nh" style="background:var(--accent-soft);border-color:var(--accent)">
      <div class="flex aic jcb">
        <div><div style="font-size:30px;font-weight:700;line-height:1">${total.toLocaleString('pt-BR')}</div><div class="small muted">Famílias</div></div>
        <div style="text-align:right"><div style="font-size:22px;font-weight:600;line-height:1">${nb.toLocaleString('pt-BR')}</div><div class="small muted">Beneficiários</div></div>
      </div></div>
    ${slice.map(f=>{
      const set = window._acompSemSet || new Set();
      const mem = f.membros || [];
      const nMem = mem.length;
      const nOk = mem.filter(m => set.has(typeof m==='string'?m:m.nis)).length;
      const todosOk = nMem > 0 && nOk === nMem;
      const acTag = nMem === 0 ? ''
        : todosOk ? `<span class="tag tag-ok" style="font-size:10px">${fi('check-circle',11)} Em dia</span>`
        : nOk > 0 ? `<span class="tag tag-w" style="font-size:10px">${nOk}/${nMem} acomp.</span>` : '';
      const st = todosOk ? 'border-left:4px solid var(--ok);' : '';
      return `<div class="card" style="${st}" onclick="showFamily('${esc(f.familyId)}')">
      <div class="flex aic jcb" style="margin-bottom:6px"><div class="fb">${esc(codDisplay(f))}</div><div style="display:flex;gap:4px;align-items:center">${acTag}<span class="tag tag-i">${nMem} membro${nMem!==1?'s':''}</span></div></div>
      <div style="font-weight:500;font-size:14px">${esc((f.endereco||'').substring(0,80))}</div>
      <div class="res-card-meta" style="margin-top:4px">${esc(f.bairro||'')}${f.bairro&&f.eas?'<span class="dot"></span>':''}${f.eas?esc(f.eas.substring(0,35)):''}</div></div>`;}).join('')}
    ${temMais ? `<button class="btn btn-g btn-b" id="btnMaisFams" onclick="_carregarMaisFamilias()"
      style="margin-top:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px">
      ${fi('chevron-down',14)} Carregar mais (${total - slice.length} restantes)</button>` : ''}`;
}

async function _carregarMaisFamilias() {
  const nb = await IDB.count('beneficiarios');
  const lista = window._famListaAtual || [];
  const html = _renderFamLista(lista, nb, _famPage + 1);
  const container = document.getElementById('famLista');
  if (container) container.innerHTML = html;
}

async function filtrarFamilias() {
  const busca  = ($('#famBusca')?.value||'').trim().toLowerCase();
  const bairro = $('#famBairro')?.value||'';
  const eas    = $('#famEas')?.value||'';
  const zona   = $('#famZona')?.value||'';

  let fams = await IDB.getAll('familias');
  if (busca)  fams = fams.filter(f =>
    (f.endereco||'').toLowerCase().includes(busca) ||
    (f.bairro||'').toLowerCase().includes(busca)   ||
    (f.cod_familiar||'').includes(busca)            ||
    f.membros?.some(m => (typeof m === 'string' ? m : (m.nome||'')).toLowerCase().includes(busca)));
  if (bairro) fams = fams.filter(f => f.bairro === bairro);
  if (eas)    fams = fams.filter(f => f.eas === eas);
  if (zona)   fams = fams.filter(f => f.zona === zona);
  fams = fams.sort((a,b) => (b.membros?.length||0)-(a.membros?.length||0));

  const nb = await IDB.count('beneficiarios');
  const lista = $('#famLista');
  if (lista) lista.innerHTML = _renderFamLista(fams, nb, 1); // reseta para página 1
}

          <button class="afchip ${f.situacao.includes('nao_sync')?'active':''}"    data-fsit="nao_sync"    onclick="setAcompFiltro('situacao','nao_sync')">${fi('cloud',11)} Não sincronizado</button>
          <button class="afchip ${f.situacao.includes('avulso')?'active':''}"      data-fsit="avulso"      onclick="setAcompFiltro('situacao','avulso')">${fi('clipboard',11)} Cadastro avulso</button>

    acomps.map(a => _renderAcompCard(a, bMap, canEdit)).join('')}
    ${total > 50 ? `<div class="card card-sub nh muted small" style="text-align:center;padding:10px">Mostrando 50 de ${total}. Use a busca para filtrar.</div>` : ''}
    </div></div>`;
}

// ── Controle do painel de filtros ──────────────────────
function toggleAcompFiltros() {
  const panel = document.getElementById('acompFiltroPanel');
  const btn   = document.getElementById('afToggleBtn');
  if (!panel) return;
  const open = panel.classList.toggle('open');
  if (btn) btn.classList.toggle('has-filter', open || _contarFiltrosAtivos() > 0);
}

function setAcompFiltro(key, val) {
  if (!window._acompFiltros) window._acompFiltros = { periodo:'todos', tria:'todos', situacao:[], dataInicio:'', dataFim:'' };
  const f = window._acompFiltros;
  if (key === 'situacao') {
    const idx = f.situacao.indexOf(val);
    if (idx > -1) f.situacao.splice(idx, 1); else f.situacao.push(val);
  } else {
    f[key] = val;
  }
  // Mostrar/ocultar seletor de datas personalizadas
  const dr = document.getElementById('afDateRange');
  if (dr) dr.style.display = f.periodo === 'custom' ? 'grid' : 'none';
  _atualizarChipsAcomp();
  filtrarAcomps(document.getElementById('acompBusca')?.value || '');
}

function setAcompFiltroData(key, val) {
  if (!window._acompFiltros) window._acompFiltros = { periodo:'todos', tria:'todos', situacao:[], dataInicio:'', dataFim:'' };
  window._acompFiltros[key] = val;
  filtrarAcomps(document.getElementById('acompBusca')?.value || '');
}

function limparFiltrosAcomp() {
  window._acompFiltros = { periodo:'todos', tria:'todos', situacao:[], dataInicio:'', dataFim:'' };
  const busca = document.getElementById('acompBusca');
  if (busca) busca.value = '';
  const dr = document.getElementById('afDateRange');
  if (dr) dr.style.display = 'none';
  _atualizarChipsAcomp();
  filtrarAcomps('');
}

function _contarFiltrosAtivos() {
  const f = window._acompFiltros || {};
  let n = 0;
  if (f.periodo && f.periodo !== 'todos') n++;
  if (f.tria && f.tria !== 'todos') n++;
  n += (f.situacao || []).length;
  return n;
}

function _atualizarChipsAcomp() {
  const f = window._acompFiltros || {};
  document.querySelectorAll('[data-fperiodo]').forEach(el =>
    el.classList.toggle('active', el.dataset.fperiodo === (f.periodo||'todos')));
  document.querySelectorAll('[data-ftria]').forEach(el =>
    el.classList.toggle('active', el.dataset.ftria === (f.tria||'todos')));
  document.querySelectorAll('[data-fsit]').forEach(el =>
    el.classList.toggle('active', (f.situacao||[]).includes(el.dataset.fsit)));
  // Badge e cor do botão
  const n = _contarFiltrosAtivos();
  const badge = document.getElementById('acompFiltroBadge');
  if (badge) { badge.textContent = n||''; badge.style.display = n ? 'flex' : 'none'; }
  const btn = document.getElementById('afToggleBtn');
  const panel = document.getElementById('acompFiltroPanel');
  if (btn) btn.classList.toggle('has-filter', n > 0 || panel?.classList.contains('open'));
}

// ── Filtro principal ────────────────────────────────────
function filtrarAcomps(q) {
  q = (q||'').trim().toLowerCase();
  const lista   = document.getElementById('acompLista');
  const count   = document.getElementById('acompCount');
  if (!lista) return;
  const todos   = window._todosAcomps  || [];
  const bMap    = window._acompBMap    || new Map();
  const canEdit = window._acompCanEdit || false;
  const f       = window._acompFiltros || {};

  const _card = (a) => {
    const b = bMap.get(a.nis);
    return `<div class="card nh">
      <div class="flex aic jcb" style="margin-bottom:6px">
        <div style="font-weight:500">${esc(b?.nome||'NIS: '+a.nis)}${a.cadastro_avulso?' <span class="tag tag-w">AVULSO</span>':''}</div>
        <span class="tag tag-ok">${new Date(a.data).toLocaleDateString()}</span>
      </div>
      <div class="small muted">NIS: ${esc(a.nis)}${a.conta_sync?' · via '+esc(a.conta_sync.split('@')[0]):''} ${a.synced_at?'':'<span class="tag tag-w">Pendente</span>'}</div>
      ${(a.tecnico||a.estabelecimento)?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px">
        ${a.tecnico?`<span class="tag tag-i" style="font-size:10px">${fi('users',11)} ${esc(a.tecnico)}</span>`:''}
        ${a.estabelecimento?`<span class="small muted" style="display:inline-flex;align-items:center;gap:3px">${fi('map-pin',11)} ${esc(a.estabelecimento)}</span>`:''}
      </div>`:''}
      ${a.acompanhado===false?`<div class="small" style="color:var(--warn);font-weight:600">✗ Não acompanhado${a.motivo_na?` — ${esc(a.motivo_na)}`:''}</div>`:''}
      ${a.peso?`<div class="small">Peso: ${a.peso}kg | Altura: ${a.altura}cm | IMC: ${a.imc}</div>`:''}
      ${a.vacina_ok!=null?`<div class="small">Vacina: ${a.vacina_ok?'✓ Em dia':'✗ Pendente'}</div>`:''}
      ${a.gestante?`<div class="small">Gestante ${a.dum?`(DUM: ${new Date(a.dum).toLocaleDateString()})`:''}</div>`:''}
      ${a.tria_risco?`<div class="small" style="margin-top:4px">TRIA: ${_triaLabel(a.tria_risco)}</div>`:''}
      ${a.observacoes?`<div class="small muted" style="font-style:italic;margin-bottom:6px">"${esc(a.observacoes)}"</div>`:''}
      ${(can('acomp.edit')||can('acomp.delete'))?`<div class="flex" style="gap:6px;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">
        ${can('acomp.edit')?`<button class="btn btn-s btn-g" onclick="editAcomp('${a.id}')" style="display:inline-flex;align-items:center;gap:4px">${fi('edit',13)} Editar</button>`:''}
        ${can('acomp.delete')?`<button class="btn btn-s btn-g" onclick="deleteAcomp('${a.id}')" style="display:inline-flex;align-items:center;gap:4px;color:var(--err)">${fi('x-circle',13)} Excluir</button>`:''}
      </div>`:''}
    </div>`;
  };

  // Helpers de período
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const periodoOk = (dataStr) => {
    if (!f.periodo || f.periodo === 'todos') return true;
    const d = new Date(dataStr); d.setHours(0,0,0,0);
    if (f.periodo === 'hoje')   return d.getTime() === hoje.getTime();
    if (f.periodo === 'semana') { const s=new Date(hoje); s.setDate(s.getDate()-6); return d>=s; }
    if (f.periodo === 'mes')    return d.getMonth()===hoje.getMonth() && d.getFullYear()===hoje.getFullYear();
    if (f.periodo === 'custom') {
      if (f.dataInicio && d < new Date(f.dataInicio)) return false;
      if (f.dataFim    && d > new Date(f.dataFim))    return false;
      return true;
    }
    return true;
  };

  let filtrados = todos.filter(a => {
    // Texto
    if (q) {
      const nome = (bMap.get(a.nis)?.nome||'').toLowerCase();
      if (!a.nis.includes(q) && !nome.includes(q) && !(a.data||'').includes(q)) return false;
    }
    // Período
    if (!periodoOk(a.data)) return false;
    // TRIA
    if (f.tria && f.tria !== 'todos') {
      if ((a.tria_risco||'') !== f.tria) return false;
    }
    // Situação (multi-toggle — E lógico)
    for (const sit of (f.situacao||[])) {
      if (sit === 'gestante'    && !a.gestante)             return false;
      if (sit === 'vac_pendente' && a.vacina_ok !== false)  return false;
      if (sit === 'nao_sync'    && a.synced_at)             return false;
      if (sit === 'avulso'      && !a.cadastro_avulso)      return false;
    }
    return true;
  });

  const totalFiltrado = filtrados.length;
  const nAtivos = _contarFiltrosAtivos();

  if (count) count.textContent = (q || nAtivos > 0)
    ? `${totalFiltrado} resultado(s)`
    : `${todos.length} registros`;

  lista.innerHTML = filtrados.length
    ? filtrados.slice(0,100).map(_card).join('')
      + (filtrados.length > 100 ? `<div class="card card-sub nh muted small" style="text-align:center;padding:10px">Mostrando 100 de ${filtrados.length}.</div>` : '')
    : `<div class="card card-sub nh muted" style="text-align:center;padding:20px">
        <div style="margin-bottom:8px;color:var(--muted)">${fi('search',28)}</div>
        <strong>Nenhum resultado encontrado</strong>
        <p class="small" style="margin-top:4px">Tente ajustar os filtros ou a busca.</p>
        <button class="btn btn-s btn-g" onclick="limparFiltrosAcomp()" style="margin-top:10px;display:inline-flex;align-items:center;gap:4px">${fi('x',12)} Limpar filtros</button>
      </div>`;
}

async function wipeLocalData() {
  if (!await uiConfirm('Apagar TODOS os dados locais deste aparelho (beneficiários, famílias e acompanhamentos)?\n\nA nuvem NÃO é afetada.', {title:'Apagar dados locais', okText:'Apagar', danger:true})) return;
  if (!await uiConfirm('Registros ainda não sincronizados serão perdidos definitivamente. Tem certeza?', {title:'Confirmar exclusão', okText:'Apagar tudo', danger:true})) return;
  for (const s of ['beneficiarios', 'familias', 'acompanhamentos']) await IDB.clear(s);
  await IDB.setMeta('lastDownload', null);
  await IDB.setMeta('lastUpload', null);
  invalidateBenefCache(); invalidateAcompCache();
  showToast('Dados locais apagados. Use "Baixar" na aba Sincronização para recarregar da nuvem.', 'ok');
  nav('config');
}

// ─── Backup completo (JSON) ─────────────────────────────
async function exportBackup() {
  try {
    const [ben, fam, aco, meta] = await Promise.all([
      IDB.getAll('beneficiarios'), IDB.getAll('familias'),
      IDB.getAll('acompanhamentos'), IDB.getAll('meta')
    ]);
    const backup = {
      _app: 'bolsa-familia', _version: 3, _exportedAt: new Date().toISOString(),
      beneficiarios: ben, familias: fam, acompanhamentos: aco, meta
    };
    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    try { localStorage.setItem('lastAutoBackup', new Date().toISOString()); } catch(e){}
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-bolsafamilia-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    _audit('data.export', 'backup', `${ben.length} benef.`);
    showToast(`✓ Backup exportado (${ben.length} beneficiários)`, 'ok');
  } catch (e) {
    showToast('Erro ao exportar backup: ' + e.message, 'err');
  }
}

async function importBackup(file) {
  if (!file) return;
  if (!await uiConfirm('Os dados atuais deste aparelho serão SUBSTITUÍDOS pelos do arquivo. Registros não sincronizados serão perdidos.', {title:'Restaurar backup', okText:'Restaurar', danger:true})) return;
  try {
    const b = JSON.parse(await file.text());
    if (!b || b._app !== 'bolsa-familia' || !Array.isArray(b.beneficiarios)) {
      showToast('Arquivo de backup inválido', 'err'); return;
    }
    await IDB.clear('beneficiarios'); await IDB.clear('familias'); await IDB.clear('acompanhamentos');
    if (b.beneficiarios.length) await IDB.putAll('beneficiarios', b.beneficiarios);
    if (b.familias?.length)     await IDB.putAll('familias', b.familias);
    if (b.acompanhamentos?.length) await IDB.putAll('acompanhamentos', b.acompanhamentos);
    if (Array.isArray(b.meta)) {
      for (const m of b.meta) { if (m.key === 'session') continue; await IDB.put('meta', m); }
    }
    invalidateBenefCache(); invalidateAcompCache(); _invalidatePermsCache();
    _audit('data.restore', 'backup', `${b.beneficiarios.length} benef.`);
    showToast(`✓ Backup restaurado: ${b.beneficiarios.length} beneficiários. Recarregando…`, 'ok');
    setTimeout(() => location.reload(), 1000);
  } catch (e) {
    showToast('Erro ao restaurar backup: ' + e.message, 'err');
  }
}

  openSheet('Trocar minha senha', `<div class="s3">

  </div>`);
}

async function saveMyPass() {
  const p1 = $('#mp1').value, p2 = $('#mp2').value;
  if (p1.length < 6) { showToast('A senha deve ter pelo menos 6 caracteres', 'err'); return; }
  if (['123','123456','111111','senha','000000'].includes(p1)) { showToast('Escolha uma senha menos óbvia', 'err'); return; }
  if (p1 !== p2) { showToast('As senhas não coincidem', 'err'); return; }

  if (SB && navigator.onLine && window._sbAuthed) {
    try {
      const { error } = await SB.auth.updateUser({ password: p1 });
      if (error) console.warn('⚠️ updateUser Supabase:', error.message);
    } catch (e) { console.warn('⚠️ updateUser falhou:', e?.message); }
  }

  const users = JSON.parse(await IDB.getMeta('users') || '[]');
  const u = users.find(x => x.id === ME.id);
  if (!u) { showToast('Usuário não encontrado', 'err'); return; }
  if (!u.off_salt) u.off_salt = SecureAuth._randSalt();
  u.off_hash = await SecureAuth.hashSalted(p1, u.off_salt);
  delete u.pass; delete u.pass_hash; delete u.mustChangePass;
  await IDB.setMeta('users', JSON.stringify(users));
  ME = u;
  _audit('user.edit', 'usuario', u.user);
  closeSheet();
  showToast('✓ Senha atualizada', 'ok');
}

async function nav(page, _fromPop) {
  const mc = $('#mc');
  // Mostrar skeleton imediatamente
  mc.innerHTML = _navSkeleton();
  mc.classList.add('loading');

  let html = '';
  switch(page) {
    case 'home':     html = await renderHome(); break;
    case 'search':   html = await renderSearch(); break;
    case 'families': html = await renderFamilies(); break;
    case 'acomp':    window._acompFiltros = { periodo:'todos', tria:'todos', situacao:[], dataInicio:'', dataFim:'' }; html = await renderAcomp(); break;
    case 'config':   html = await renderConfig(); break;
    default: mc.classList.remove('loading'); return;
  }
  mc.innerHTML = html;
  mc.classList.remove('loading');
  mc.classList.remove('enter'); void mc.offsetWidth; mc.classList.add('enter');
  mc.dataset.page = page;
  // Guarda a assinatura da Home recém-renderizada (base para o refresh suave)
  if (page === 'home') { _softHomeTs = Date.now(); try { _lastHomeSig = await _homeSig(); } catch(e){ _lastHomeSig = ''; } }
  // Histórico para o botão "voltar" (Android / navegador) funcionar dentro do app
  if (!_fromPop) {
    try {
      if (history.state && history.state.app === 'page') history.pushState({ app:'page', page }, '', '#'+page);
      else history.replaceState({ app:'page', page }, '', '#'+page);
    } catch(e) {}
  }
  if (page === 'config') {
    let t = window._cfgTab || (ME?.role === 'admin' ? 'geral' : 'aparencia');
    if (ME?.role !== 'admin' && ['sync', 'usuarios'].includes(t)) t = 'aparencia';
    setCfgTab(t);
  }
  $$('nav.bottom .nav-icon').forEach(b => { b.dataset.p===page ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'); });
  // Auto-atualização do painel do admin na Home (envelhecimento do "online")
  if (window._homeRefreshTid) { clearInterval(window._homeRefreshTid); window._homeRefreshTid = null; }
  if (page === 'home' && ME?.role === 'admin') {
    window._homeRefreshTid = setInterval(() => _softRefreshHome(), 60000);
  }
  window.scrollTo(0,0);
  _updateSyncBadge();
  _startBannerSlideshow();
  _renderFooter();
  _animateCounters();
}

// Anima números marcados com data-cnt (contagem 0 → valor, ease-out)
function _animateCounters() {
  const els = document.querySelectorAll('[data-cnt]');
  if (!els.length) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el => {
    const target = +el.dataset.cnt;
    delete el.dataset.cnt; // não re-animar
    if (!isFinite(target) || target <= 0 || reduce) { el.textContent = (isFinite(target)?target:0).toLocaleString('pt-BR'); return; }
    const t0 = performance.now(), dur = 650;
    const step = t => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e).toLocaleString('pt-BR');
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function doSearch(q) {
  const c=$('#sR'); if(!c)return;
  q=q.trim().toLowerCase();

  const f = _searchFilters;
  const temFiltro = f.eas||f.bairro||f.zona||f.gestante||f.vacPend||f.semAcomp;

  if(!q && !temFiltro){
    c.innerHTML=`<div class="empty-state" style="padding:28px 16px"><div class="ei">${fi('search',40)}</div><strong>Encontre um beneficiário</strong><p>Busque por NIS, nome ou use os filtros — ou toque no microfone para falar.</p></div>`;
    return;
  }

  let all = await getBenefCache();

  // ── Filtros avançados ─────────────────────────────
  if (f.eas)     all = all.filter(b => b.eas === f.eas);
  if (f.bairro)  all = all.filter(b => b.bairro === f.bairro);
  if (f.zona)    all = all.filter(b => b.zona === f.zona);
  if (f.gestante) all = all.filter(b => b.gestante);
  if (f.vacPend || f.semAcomp) {
    const acomps = await getAcompCache();
    const ultimoAcomp = new Map();
    acomps.forEach(a => {
      const prev = ultimoAcomp.get(a.nis);
      if (!prev || new Date(a.data) > new Date(prev.data)) ultimoAcomp.set(a.nis, a);
    });
    if (f.vacPend)  all = all.filter(b => ultimoAcomp.get(b.nis)?.vacina_ok === false);
    if (f.semAcomp) all = all.filter(b => !ultimoAcomp.has(b.nis));
  }
  // ─────────────────────────────────────────────────

  // Acompanhamentos do semestre atual (destaque + ordenação "pendentes primeiro")
  const refSem = semestreAtualRef();
  const acompSemestre = new Map();
  for (const a of await getAcompCache()) {
    if (semestreRef(a.data) === refSem) {
      const prev = acompSemestre.get(a.nis);
      if (!prev || new Date(a.data) > new Date(prev.data)) acompSemestre.set(a.nis, a);
    }
  }

  let match = q
    ? all.filter(b => b.nis.includes(q) || b.nome.toLowerCase().includes(q))
    : all;
  if (f.pendFirst) match = match.slice().sort((a,b) => (acompSemestre.has(a.nis)?1:0) - (acompSemestre.has(b.nis)?1:0));
  const results = match.slice(0, q ? 20 : 30);

  // Guarda buscas recentes (com resultado) para os chips de atalho
  if (q && q.length >= 3 && results.length) _saveRecentSearch(q);

  if(!results.length){
    const parcial    = all.filter(b => b.nome.toLowerCase().startsWith(q.substring(0,3))).slice(0,5);
    const porBairro  = all.filter(b => b.bairro && b.bairro.toLowerCase().includes(q)).slice(0,5);
    const porFam     = all.filter(b => b.cod_fam && b.cod_fam.toLowerCase().includes(q)).slice(0,5);
    
    let html = `<div class="card card-sub nh" style="background:var(--warn-soft);border-color:var(--warn);padding:12px;margin-bottom:12px">
      <div style="color:var(--warn);font-weight:500">${fi('x-circle',13)} Nenhum beneficiário encontrado para: <strong>"${esc(q)}"</strong></div>`;

    if (parcial.length > 0) {
      html += `<div class="small" style="margin-top:8px;font-weight:500;display:flex;align-items:center;gap:4px">${fi('edit',13)} Nomes parecidos:</div>
        ${parcial.map(b=>`<div class="card card-sub nh" style="margin-top:6px;cursor:pointer" onclick="showBenef('${b.nis}')">
          ${esc(b.nome)} <span class="small muted">(NIS: ${esc(b.nis)})</span></div>`).join('')}`;
    }
    if (porBairro.length > 0) {
      html += `<div class="small" style="margin-top:8px;font-weight:500;display:flex;align-items:center;gap:4px">${fi('map-pin',13)} Por bairro:</div>
        ${porBairro.slice(0,3).map(b=>`<div class="card card-sub nh" style="margin-top:6px;cursor:pointer" onclick="showBenef('${b.nis}')">
          ${esc(b.nome)} <span class="small muted">(${esc(b.bairro)})</span></div>`).join('')}`;
    }
    if (porFam.length > 0) {
      html += `<div class="small" style="margin-top:8px;font-weight:500;display:flex;align-items:center;gap:4px">${fi('users',13)} Por família:</div>
        ${porFam.slice(0,3).map(b=>`<div class="card card-sub nh" style="margin-top:6px;cursor:pointer" onclick="showBenef('${b.nis}')">
          ${esc(b.nome)} <span class="small muted">(Fam: ${esc(b.cod_fam)})</span></div>`).join('')}`;
    }
    if (!parcial.length && !porBairro.length && !porFam.length) {
      html += `<div class="small muted" style="margin-top:8px">Verifique a digitação ou tente NIS, nome, bairro ou código familiar.</div>`;
    }

    html += `</div>`;

    // Botão cadastrar acompanhamento avulso
    // _avulsoNome armazena o nome via variável global — evita injeção em onclick
    const canEdit = ME && ME.role !== 'visualizador';
    if (canEdit) {
      _avulsoNome = /^\d+$/.test(q) ? '' : q.toUpperCase();
      html += `<div class="card" style="background:var(--accent-soft);border-color:var(--accent);cursor:pointer" onclick="showAcompAvulso()">
        <div class="flex aic" style="gap:12px">
          <span style="display:flex;color:var(--accent-text)">${fi('clipboard',28)}</span>
          <div>
            <div style="font-weight:600;color:var(--accent-text)">Cadastrar acompanhamento avulso</div>
            <div class="small muted">Beneficiário não encontrado na base — registrar manualmente</div>
          </div>
        </div>
      </div>`;
    }

    c.innerHTML = html;
    return;
  }

  c.innerHTML = results.map(b=>{
    let idadeStr = '';
    if (b.idade) { idadeStr = b.idade + ' anos'; }
    else if (b.dob) { idadeStr = Math.floor((Date.now() - new Date(b.dob)) / 31557600000) + ' anos'; }
    const codFamDisplay = b.cod_fam && !b.cod_fam.startsWith('FAM_IND_') ? b.cod_fam.replace(/^FAM_/,'') : '';
    const acSem = acompSemestre.get(b.nis);
    const naoAc = acSem?.acompanhado === false;
    const dataAcomp = acSem ? new Date(acSem.data + 'T12:00:00').toLocaleDateString('pt-BR') : '';
    // Diferença visual FORTE: verde sólido = acompanhado · laranja = não localizado · neutro c/ selo = pendente
    const cardStyle = acSem
      ? (naoAc ? 'border-left:5px solid var(--warn);background:var(--warn-soft)'
               : 'border-left:5px solid var(--ok);background:var(--ok-soft)')
      : 'border-left:5px solid var(--border)';
    const statusIcon = acSem
      ? `<span style="flex-shrink:0;display:flex;align-items:center;color:var(--${naoAc?'warn':'ok'})">${fi(naoAc?'alert-triangle':'check-circle',26)}</span>`
      : `<span style="flex-shrink:0;display:flex;align-items:center;color:var(--muted);opacity:.45">${fi('clock',24)}</span>`;
    return `<div class="card" style="${cardStyle};display:flex;align-items:center;gap:12px" onclick="showBenef('${b.nis}')">
      <div style="flex:1;min-width:0">
      <div class="res-card-name">
        ${esc(b.nome)}
        ${acSem?(naoAc
          ?`<span class="tag tag-w" style="font-size:10px">${fi('alert-triangle',11)} Não localizado · ${semestreLabel(refSem)}</span>`
          :`<span class="tag tag-ok" style="font-size:10px">${fi('check-circle',11)} Acompanhado · ${semestreLabel(refSem)}</span>`)
          :`<span class="tag" style="font-size:10px;background:var(--panel-2);color:var(--muted);border:1px dashed var(--border)">Pendente na vigência</span>`}
        ${b.gestante?'<span class="tag tag-w" style="font-size:10px">Gestante</span>':''}
        ${b.cadastro_avulso?'<span class="tag tag-w" style="font-size:10px">Avulso</span>':''}
        ${b.cadastro_manual?'<span class="tag tag-i" style="font-size:10px">Manual</span>':''}
      </div>
      <div class="res-card-meta">
        <span>NIS: ${esc(b.nis)}</span>
        ${idadeStr?`<span class="dot"></span><span>${idadeStr}</span>`:''}
        ${codFamDisplay?`<span class="dot"></span><span>Fam: ${esc(codFamDisplay)}</span>`:''}
        ${b.bairro?`<span class="dot"></span><span>${esc(b.bairro)}</span>`:''}
        ${acSem?`<span class="dot"></span><span style="color:var(--${naoAc?'warn':'ok'});font-weight:600">${naoAc?'não localizado':'acompanhado'} em ${dataAcomp}</span>`:''}
      </div>
      </div>
      ${statusIcon}
    </div>`;
  }).join('');
}

function _getRecentSearches(){

function _saveRecentSearch(q){
  try {
    const list = _getRecentSearches().filter(x => x !== q);

  } catch(e){}

// ── Busca por voz (Web Speech API — quando o navegador suporta) ──
function _voiceSearch(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Busca por voz não suportada neste navegador', 'warn'); return; }
  const btn = document.getElementById('micBtn');
  const rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn?.classList.add('rec');
  rec.onresult = e => {
    const txt = e.results[0][0].transcript.trim();
    const inp = document.getElementById('sI');
    if (inp) { inp.value = txt; doSearch(txt); }
  };
  rec.onend   = () => btn?.classList.remove('rec');
  rec.onerror = () => { btn?.classList.remove('rec'); showToast('Não entendi — tente de novo', 'warn'); };
  try { rec.start(); showToast('🎤 Fale o nome ou NIS...', 'ok'); } catch(e){ btn?.classList.remove('rec'); }
}

async function _getFooterCfg() {
  return {
    enabled: await IDB.getMeta('footerEnabled') === 'on',
    bg:      await IDB.getMeta('footerBg')      || '#ffffff',
    padding: await IDB.getMeta('footerPadding') || 'md',
    blocks:  JSON.parse(await IDB.getMeta('footerBlocks') || '[]')
  };
}
async function _saveFooterCfg(cfg) {
  await IDB.setMeta('footerEnabled', cfg.enabled ? 'on' : 'off');
  await IDB.setMeta('footerBg',      cfg.bg);
  await IDB.setMeta('footerPadding', cfg.padding);
  await IDB.setMeta('footerBlocks',  JSON.stringify(cfg.blocks));
}
async function _renderFooter() {
  const el = document.getElementById('appFooter');
  if (!el) return;
  const cfg = await _getFooterCfg();
  if (!cfg.enabled || cfg.blocks.length === 0) { el.style.display = 'none'; return; }
  const padMap = { sm:'8px 20px', md:'16px 20px', lg:'28px 20px' };
  const pad = padMap[cfg.padding] || padMap.md;
  const blocksHtml = cfg.blocks.map((b, i) => {
    const mb = i < cfg.blocks.length - 1 ? 'margin-bottom:8px' : '';
    if (b.type === 'text') {
      const st = [
        `font-size:${b.fontSize||14}px`,
        `color:${b.color||'#525252'}`,
        `text-align:${b.align||'center'}`,
        b.bold   ? 'font-weight:700'   : '',
        b.italic ? 'font-style:italic' : '',
        mb
      ].filter(Boolean).join(';');
      return `<div style="${st}">${esc(b.text||'').replace(/\n/g,'<br>')}</div>`;
    }
    if (b.type === 'image' && b.imgData) {
      const marg = b.align === 'left' ? 'margin-right:auto' : b.align === 'right' ? 'margin-left:auto' : 'margin:0 auto';
      return `<div style="${mb}"><img src="${b.imgData}" class="footer-block-img" style="width:${b.imgWidth||100}%;${marg};display:block"></div>`;
    }
    return '';
  }).join('');
  el.style.display = 'block';
  el.innerHTML = `<div style="background:${cfg.bg};border-top:1px solid var(--border)"><div style="padding:${pad};max-width:640px;margin:0 auto">${blocksHtml}</div></div>`;
}

async function addFooterBlock(type) {
  const cfg = await _getFooterCfg();
  if (!cfg.enabled) return;
  const id = crypto.randomUUID();
  if (type === 'text') {
    cfg.blocks.push({ id, type:'text', text:'', fontSize:14, color:'#525252', align:'center', bold:false, italic:false });
  } else {
    cfg.blocks.push({ id, type:'image', imgData:null, imgWidth:100, align:'center' });
  }
  await _saveFooterCfg(cfg);
  const idx = cfg.blocks.length - 1;
  await _refreshFooterBlocksList();
  editFooterBlock(idx);
}

async function removeFooterBlock(idx) {
  const cfg = await _getFooterCfg();
  cfg.blocks.splice(idx, 1);
  await _saveFooterCfg(cfg);
  await _refreshFooterBlocksList();
  _renderFooter();
}

async function moveFooterBlock(idx, dir) {
  const cfg = await _getFooterCfg();
  const ni = idx + dir;
  if (ni < 0 || ni >= cfg.blocks.length) return;
  [cfg.blocks[idx], cfg.blocks[ni]] = [cfg.blocks[ni], cfg.blocks[idx]];
  await _saveFooterCfg(cfg);
  await _refreshFooterBlocksList();
  _renderFooter();
}

async function saveFooterTextBlock(idx) {
  const cfg = await _getFooterCfg();
  const b   = cfg.blocks[idx];
  if (!b || b.type !== 'text') return;

  b.italic   = document.getElementById('fbItalic')?.checked || false;
  await _saveFooterCfg(cfg);
  closeSheet();
  await _refreshFooterBlocksList();
  _renderFooter();

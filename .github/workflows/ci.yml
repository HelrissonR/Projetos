name: CI (app-vendas)

on:
  push:
    branches: ['**']
    paths: ['app-vendas/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['app-vendas/**', '.github/workflows/ci.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-vendas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-vendas/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

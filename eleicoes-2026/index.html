<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Candidaturas — Eleições 2026</title>
  <meta name="description" content="Dashboard interativo de monitoramento das candidaturas das Eleições 2026 no Brasil." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">2026</div>
        <span class="brand-name">Monitor Eleitoral</span>
      </div>
      <nav class="nav">
        <a class="nav-item active" href="#" data-view="painel" title="Painel"><span class="nav-ico">◫</span><span class="nav-txt">Painel</span></a>
        <a class="nav-item" href="#" data-view="candidatos" title="Candidatos"><span class="nav-ico">◍</span><span class="nav-txt">Candidatos</span></a>
        <a class="nav-item" href="#" data-view="noticias" title="Notícias"><span class="nav-ico">✎</span><span class="nav-txt">Notícias</span></a>
        <a class="nav-item" href="#" data-view="sobre" title="Sobre"><span class="nav-ico">ⓘ</span><span class="nav-txt">Sobre</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="theme-toggle" id="themeToggle" title="Alternar tema">◐</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="topbar-title">
          <h1 id="viewTitle">Painel geral</h1>
          <p id="viewSubtitle">Acompanhamento das candidaturas em tempo quase real</p>
        </div>
        <div class="search">
          <span class="search-ico">⌕</span>
          <input type="search" id="searchInput" placeholder="Buscar candidato, partido ou UF..." />
        </div>
      </header>

      <div class="banner-aviso" id="bannerAviso">
        <strong>Dados ilustrativos.</strong>
        <span id="avisoTexto"></span>
        <button class="banner-close" id="bannerClose" aria-label="Fechar">×</button>
      </div>

      <!-- KPIs -->
      <section class="kpis" id="kpis"></section>

      <!-- Filtros -->
      <section class="filters" id="filters">
        <div class="filter-group" id="filterCargo"></div>
        <div class="filter-group filter-uf">
          <select id="filterUf"><option value="">Todas as UFs</option></select>
          <select id="filterOrder">
            <option value="viab">Ordenar: viabilidade</option>
            <option value="nome">Ordenar: nome</option>
            <option value="tend">Ordenar: tendência</option>
          </select>
        </div>
      </section>

      <!-- Cards -->
      <section class="grid" id="cards"></section>

      <!-- Rodapé de painel -->
      <section class="panels" id="panels">
        <div class="panel">
          <h3>Distribuição por viabilidade</h3>
          <div class="bars" id="barsViab"></div>
        </div>
        <div class="panel">
          <h3>Atividade recente</h3>
          <ul class="activity" id="activity"></ul>
        </div>
      </section>
    </main>
  </div>

  <!-- Drawer de detalhe -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <script src="app.js"></script>
</body>
</html>
